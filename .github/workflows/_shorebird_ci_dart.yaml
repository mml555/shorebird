# Generated by shorebird_ci --style static. Safe to edit.
# Reusable workflow: CI steps for a single Dart package.
on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      package_path:
        required: true
        type: string
      has_unit_tests:
        required: false
        default: true
        type: boolean
      subpackages:
        required: false
        default: ""
        type: string
      needs_redis:
        required: false
        default: false
        type: boolean
      runners:
        required: false
        default: '["ubuntu-latest"]'
        type: string
      min_coverage:
        required: false
        default: ""
        type: string
      coverage_excludes:
        required: false
        default: ""
        type: string
      report_on:
        required: false
        default: ""
        type: string
      total_shards:
        required: false
        default: 1
        type: number
      shard_index:
        required: false
        default: 0
        type: number

permissions:
  contents: read

jobs:
  ci:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) || vars.HOSTED_RUNNERS == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || (vars.HOSTED_RUNNERS == 'true' && inputs.runners || '["ubuntu-latest"]')) }}
    # Self-hosted runners are only for trusted events. A pull request from
    # a fork must never run on hardware the repo owner controls.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || matrix.os }}
    # A hung test would otherwise hold a home runner for the 6h default.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐳 Run Redis
        if: inputs.needs_redis
        run: |
          docker pull redis/redis-stack-server:latest
          name="redis-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.package_name }}-${{ strategy.job-index }}"
          docker run --name "$name" -d -p 127.0.0.1::6379 --rm -e REDIS_ARGS="--requirepass password" redis/redis-stack-server:latest
          echo "REDIS_CONTAINER=$name" >> "$GITHUB_ENV"
          echo "REDIS_PORT=$(docker port "$name" 6379/tcp | head -n1 | sed 's/.*://')" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Install Dependencies
        working-directory: ${{ inputs.package_path }}
        run: |
          dart pub get --no-example
          for sub in ${{ inputs.subpackages }}; do
            dart pub get --no-example -C "$sub"
          done
      - working-directory: ${{ inputs.package_path }}
        run: |
          dart format --set-exit-if-changed .
          if [ -d routes/.well-known ]; then
            dart format --set-exit-if-changed routes/.well-known
          fi
      - working-directory: ${{ inputs.package_path }}
        run: |
          dart analyze --fatal-warnings .
          if [ -d routes/.well-known ]; then
            dart analyze --fatal-warnings routes/.well-known
          fi
      - name: Run Tests
        if: inputs.has_unit_tests
        working-directory: ${{ inputs.package_path }}
        env:
          MIN_COVERAGE: ${{ inputs.min_coverage }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          REPORT_ON: ${{ inputs.report_on }}
          RUNNER_OS_NAME: ${{ matrix.os }}
          SHARD_INDEX: ${{ inputs.shard_index }}
          TOTAL_SHARDS: ${{ inputs.total_shards }}
          WORKSPACE_ROOT: ${{ github.workspace }}
        run: |
          set -f
          files=$(find test -name '*_test.dart' | sort | awk -v n="${TOTAL_SHARDS:-1}" -v i="${SHARD_INDEX:-0}" 'NR % n == i')
          if [ -z "$files" ]; then
            exit 0
          fi
          if [ -n "$MIN_COVERAGE" ] && [ "$MIN_COVERAGE" != "0" ] && [ "$RUNNER_OS_NAME" = "ubuntu-latest" ]; then
            # Pinned until https://github.com/dart-lang/tools/issues/2667 is fixed.
            dart pub global activate coverage 1.15.1
            COVERAGE_DIR="$(pwd -W 2>/dev/null || pwd)/coverage"
            # --concurrency=4: dart test's default is half the cores. On the
            # 32-core home runner (16 at once), coverage collection livelocks:
            # 50 files hung for 30+ min, but passed in 50s with 4 at once and
            # 148s with 1. Without coverage the same files pass in 5s either way.
            printf '%s\n' "$files" | xargs -n 50 dart test --concurrency=4 --coverage="$COVERAGE_DIR"
            if [ -z "$(find coverage -name '*.json' -print -quit)" ]; then
              echo "::error::dart test wrote no coverage files to coverage/"
              exit 1
            fi
            if [ -z "$REPORT_ON" ]; then
              if [ -d routes ]; then
                REPORT_ON="lib,routes"
              else
                REPORT_ON="lib"
              fi
            fi
            if [ -f .dart_tool/package_config.json ]; then
              PACKAGE_CONFIG=".dart_tool/package_config.json"
            else
              PACKAGE_CONFIG="$WORKSPACE_ROOT/.dart_tool/package_config.json"
            fi
            SCOPED_CONFIG="$(dirname "$PACKAGE_CONFIG")/package_config_scoped.json"
            jq --arg name "$PACKAGE_NAME" '.packages |= map(select(.name == $name))' "$PACKAGE_CONFIG" > "$SCOPED_CONFIG"
            dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --packages="$SCOPED_CONFIG" --report-on="$REPORT_ON" --check-ignore
          else
            printf '%s\n' "$files" | xargs -n 50 dart test --concurrency=4
          fi
      - name: Check Coverage
        if: inputs.has_unit_tests && inputs.min_coverage != '' && inputs.min_coverage != '0' && matrix.os == 'ubuntu-latest'
        working-directory: ${{ inputs.package_path }}
        env:
          EXCLUDES: ${{ inputs.coverage_excludes }}
          MIN_COVERAGE: ${{ inputs.min_coverage }}
        run: |
          dart pub global activate shorebird_ci 0.3.0
          shorebird_ci check_coverage coverage/lcov.info --min "$MIN_COVERAGE" --exclude "$EXCLUDES"
      - name: 🐳 Stop Redis
        if: always() && inputs.needs_redis
        run: |
          if [ -n "${REDIS_CONTAINER:-}" ]; then
            docker rm -f "$REDIS_CONTAINER" || true
          fi
