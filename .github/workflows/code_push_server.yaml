# CI for the self-hosted code_push_server package. Standalone (its own
# pubspec.lock, not a workspace member), so it's built and tested on its own.
# Path-filtered to only run when this package (or this workflow) changes.
name: code_push_server

on:
  push:
    paths:
      - packages/code_push_server/**
      - .github/workflows/code_push_server.yaml
  pull_request:
    paths:
      - packages/code_push_server/**
      - .github/workflows/code_push_server.yaml

# Cancel superseded runs on the same ref.
concurrency:
  group: code_push_server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/code_push_server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # libsqlite3: the single-container (SQLite) backend uses sqlite3 via FFI.
      # shellcheck: lint the shell tooling (below). Both in one apt call.
      - name: Install libsqlite3 + shellcheck
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev shellcheck

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (fail on any lint)
        run: dart analyze --fatal-infos --fatal-warnings

      # Lint the shell tooling (setup, ops, iOS signing, smoke/e2e). Gates on
      # warnings+errors; --source-path=SCRIPTDIR lets it follow sourced libs.
      - name: Shellcheck (shell tooling)
        run: |
          echo "Scanning shell scripts:"
          git ls-files -z '*.sh' | xargs -0 -r -n1 echo " -"
          git ls-files -z '*.sh' | xargs -0 -r shellcheck -x --source-path=SCRIPTDIR --severity=warning

      - name: Unit + backend tests
        run: dart test -x integration

      - name: Native compile (production build path)
        run: dart compile exe bin/server.dart -o /tmp/server

      # End-to-end wire-contract smoke against the SQLite single-container
      # backend: boots the server and drives create -> verify -> promote ->
      # signed-URL range download -> rollback with curl.
      # API_KEY/URL_SIGNING_SECRET are set explicitly: the server refuses to
      # boot on the placeholder values committed to this repo, in every mode
      # (not just PRODUCTION=true). Any throwaway value works here.
      - name: Smoke test (SQLite backend)
        env:
          API_KEY: sb_api_ci_ephemeral_0123456789abcdef
          URL_SIGNING_SECRET: ci-ephemeral-url-signing-secret
        run: |
          DATA_DIR=/tmp/cps-ci /tmp/server &
          SV=$!
          for _ in $(seq 1 40); do
            curl -sf http://localhost:8080/readyz | grep -q '"db":true' && break
            sleep 0.5
          done
          BASE=http://localhost:8080 KEY="$API_KEY" ./tool/smoke_test.sh
          kill $SV || true

  # Exercises the scale backend (Postgres metadata + filesystem artifacts) that
  # the SQLite job never touches: the PgDb adapter, unrewritten Postgres SQL,
  # and the Postgres flavor of the analytics date bucketing.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cps
          POSTGRES_PASSWORD: cps_ci_password
          POSTGRES_DB: code_push
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      - name: Native compile
        run: dart compile exe bin/server.dart -o /tmp/server

      # DATABASE_URL selects the Postgres backend; S3_ENDPOINT is left unset so
      # artifacts use the filesystem store under DATA_DIR.
      - name: Smoke test (Postgres backend)
        env:
          DATABASE_URL: postgres://cps:cps_ci_password@localhost:5432/code_push
          # See the SQLite job: placeholder secrets are refused at boot.
          API_KEY: sb_api_ci_ephemeral_0123456789abcdef
          URL_SIGNING_SECRET: ci-ephemeral-url-signing-secret
        run: |
          DATA_DIR=/tmp/cps-pg /tmp/server &
          SV=$!
          for _ in $(seq 1 40); do
            curl -sf http://localhost:8080/readyz | grep -q '"db":true' && break
            sleep 0.5
          done
          BASE=http://localhost:8080 KEY="$API_KEY" ./tool/smoke_test.sh
          # Exercise the Postgres date SQL (date_trunc / dow / hour) that the
          # smoke doesn't: seed one device event, then hit the analytics
          # endpoints that bucket by period, weekday, and hour.
          H="Authorization: Bearer $API_KEY"
          APP=$(curl -s -H "$H" -X POST http://localhost:8080/api/v1/apps \
            -d '{"organization_id":1,"display_name":"pg-analytics"}' \
            | sed -E 's/.*"id":"([^"]+)".*/\1/')
          curl -s -X POST http://localhost:8080/api/v1/patches/events \
            -d "{\"app_id\":\"$APP\",\"client_id\":\"ci-device\",\"type\":\"__patch_install__\",\"release_version\":\"1.0.0+1\",\"patch_number\":1,\"platform\":\"android\",\"arch\":\"aarch64\",\"timestamp\":1700000000}" \
            >/dev/null
          for ep in \
            "analytics/unique-users?granularity=week" \
            "analytics/version-distribution" \
            "analytics/activity-heatmap" \
            "analytics/active-hours" \
            "analytics/patch-adoption?granularity=day"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "$H" \
              "http://localhost:8080/api/v1/apps/$APP/$ep")
            echo "GET /$ep -> $CODE"
            [ "$CODE" = "200" ] || { echo "analytics endpoint failed"; kill $SV; exit 1; }
          done
          kill $SV || true
