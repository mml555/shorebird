# cspell:words clippy rustc
name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PRs only. A push run on main is the only place a commit's macOS and
  # Windows legs run, and Detect Changes diffs only against the previous
  # commit, so a cancelled main run would skip them for good.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Start CI by hand on any branch (Actions -> ci -> Run workflow).
  workflow_dispatch:
  pull_request:
  # Checks run on the queue's own temp branch, not the PR. Without this
  # trigger the required contexts never report there and the queue
  # ejects every PR at the timeout.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # A git fetch over a stalled connection never errors, so actions/checkout's
  # own retry never runs and the job sits until its timeout (seen on ci-build:
  # a 15-25s checkout hanging for 5 minutes). Abort a transfer that moves under
  # 1 KB/s for 30s, so checkout fails fast and retries.
  GIT_HTTP_LOW_SPEED_LIMIT: 1000
  GIT_HTTP_LOW_SPEED_TIME: 30

# The runners are ephemeral, so every checkout downloads the whole tree: about
# 220 MB packed, most of it binary test fixtures and evidence (.aab, .ipa,
# .zip, .bin). On a slow day for the home link that moves too fast for the
# guard above and too slow to finish, and checkout hung for 5 and 15 minutes
# (#239, #240, #243). The jobs marked "Sparse checkout" read only a few named
# files, so they fetch no blobs up front (filter) and check out only those
# paths: 1-11 MB instead of the whole tree.

jobs:
  license_check:
    name: 📄 License Check
    # Self-hosted (ci-build, on the owner's home LAN) only for trusted events:
    # a pull request from a fork keeps the hosted runner, so outside
    # contributors' code never reaches the LAN.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    # A stalled checkout or network fetch (git, npx) fails here instead of
    # holding a runner for GitHub's six-hour default; the job normally takes
    # under two minutes.
    timeout-minutes: 15
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.HOSTED_RUNNERS == 'true') }}
    steps:
      # Sparse checkout: the action, and the pubspec files a workspace pub get reads.
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /pubspec.yaml
            /pubspec.lock
            /packages/*/pubspec.yaml

      - name: 👀 Check Licenses
        uses: ./.github/actions/license_check
        with:
          working_directory: ${{ github.workspace }}

  actionlint:
    name: 🔍 Lint Workflows
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.HOSTED_RUNNERS == 'true') }}
    # The image pull from Docker Hub is the only network step; bound it so a
    # Docker Hub stall fails fast instead of holding the required check.
    timeout-minutes: 5
    steps:
      # Sparse checkout: actionlint reads .github only.
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/

      # Catches a workflow GitHub would refuse to start (it fails such a
      # workflow's runs with no jobs and no error on the PR), plus shellcheck
      # over every run: script. The image bundles shellcheck; config is in
      # .github/actionlint.yaml.
      - name: 🔍 Run actionlint
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12

  # A SECOND, DEDICATED job rather than flipping the one above to
  # modified_files_only: false. Three reasons, and the third is the one that
  # matters most:
  #   * the incremental job stays a known-green, fast regression signal;
  #   * this job carries ONE unambiguous claim -- the declared full-tree scope is
  #     clean -- instead of two claims sharing a name;
  #   * failures stay attributable. Changing the semantics of a job whose history
  #     people already read would make every past green mean something different.
  #
  # SCOPE IS DECLARED, NOT INHERITED. `--dot` is load-bearing: without it cspell
  # does not traverse into dot-named files, and selfhost/engine/.gclient.template
  # went unchecked for the life of the repo. Proven locally in both directions by
  # selfhost/scripts/cspell_scope_control.sh -- an ordinary-file typo and a
  # DOTFILE typo must each fail this exact command.
  cspell_full_tree:
    name: 🔤 Check Spelling (full tree)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    # A stalled checkout or network fetch (git, npx) fails here instead of
    # holding a runner for GitHub's six-hour default; the job normally takes
    # under two minutes.
    timeout-minutes: 15
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.HOSTED_RUNNERS == 'true') }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # npx pulls cspell's dependency tree unpinned on the home runner;
          # leave it no token to find.
          persist-credentials: false
          # Sparse checkout: the scope below, less the binaries in it, which
          # cspell skips anyway (it checks the same 2451 files either way).
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /cspell.config.yaml
            /selfhost/
            /packages/code_push_server/lib/
            !*.aab
            !*.aar
            !*.apk
            !*.bin
            !*.DWARF
            !*.dylib
            !*.gz
            !*.ipa
            !*.jar
            !*.png
            !*.so
            !*.zip
            !/selfhost/evidence/releases/*/App

      - name: 🪄 Spell Check (declared full-tree scope)
        run: npx --yes cspell@10.4.0 --dot --no-progress --no-summary selfhost packages/code_push_server/lib

  # Most scripts here read YAML a line at a time with sed or grep, so a file can
  # stop being YAML without anything failing: selfhost/compatibility.yaml did,
  # from #134 until #187. The home runner has PyYAML; where it is missing the
  # script exits 2 and says so.
  yaml_parses:
    name: 🧾 YAML Loads
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.HOSTED_RUNNERS == 'true') }}
    timeout-minutes: 5
    steps:
      # Sparse checkout: every YAML file, and the script.
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/
            *.yaml
            *.yml

      - name: 🧾 Every tracked YAML file loads
        run: python3 tool/check_yaml_parses.py

  # selfhost/SIGNING.md and UPDATER_CONTRACT.md state the vendored updater's
  # default verification mode and that it verifies a signature before download.
  # This greps for both, and checks compatibility.yaml's updater_revision against
  # vendor/updater/VENDOR.md, so a re-vendor cannot silently make them wrong.
  updater_pin:
    name: 📌 Updater Pin
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.HOSTED_RUNNERS == 'true') }}
    timeout-minutes: 5
    steps:
      # Sparse checkout: the files tool/check_updater_pin.sh names.
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/
            /vendor/updater/
            /selfhost/*.md
            /selfhost/compatibility.yaml

      - name: 📌 Vendored updater matches the docs and the manifest
        run: tool/check_updater_pin.sh

  # selfhost/engine/route_b/SUPPORTED_STATE.yaml names a CLI revision, the
  # Flutter selector it pins and the cell that selector names. This checks that
  # chain against git history and the Flutter fork, so a records PR that names
  # the wrong CLI fails here, not after it merges (cell f2458551's record did).
  supported_state:
    name: 🧭 Supported State Record
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.HOSTED_RUNNERS == 'true') }}
    timeout-minutes: 5
    steps:
      # Sparse checkout with full history (no blobs up front): the ancestry
      # checks need every commit, and git fetches the few blobs read at
      # cli_revision on demand.
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/
            /selfhost/engine/route_b/SUPPORTED_STATE.yaml
            /selfhost/engine/route_b/lib/

      - name: 🧭 The record's CLI, selector and cell agree
        run: tool/check_supported_state_record.sh

  changes:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    # A stalled checkout or network fetch (git, npx) fails here instead of
    # holding a runner for GitHub's six-hour default; the job normally takes
    # under two minutes.
    timeout-minutes: 10
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.HOSTED_RUNNERS == 'true') }}
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's changed files through the API.
      pull-requests: read

    outputs:
      agent_scripts: ${{ steps.agent_scripts.outputs.tool }}
      needs_verify: ${{ steps.needs_verify.outputs.changes }}
      updater_rust: ${{ steps.updater_rust.outputs.updater_rust }}
      protocol_codegen: ${{ steps.protocol_codegen.outputs.protocol }}

    name: 👀 Detect Changes

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Agent Scripts Detection
        id: agent_scripts
        with:
          filters: |
            tool:
              - ./.github/workflows/main.yaml
              - ./tool/**

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Verify Detection
        id: needs_verify
        with:
          # A manual run has no PR or push to diff, so compare with main.
          base: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          filters: |
            shorebird_cli:
              - ./.github/workflows/main.yaml
              - ./.github/actions/verify_version/action.yaml
              - packages/dex/**
              - packages/elf/**
              - packages/macho/**
              - packages/scoped_deps/**
              - packages/shorebird_build_trace/**
              - packages/shorebird_cli/**
              - packages/shorebird_code_push_client/**
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml
              - selfhost/engine/route_b/evidence/sdk_instance_members/profile_2fc41d3f.json.gz
            shorebird_code_push_client:
              - ./.github/workflows/main.yaml
              - ./.github/actions/verify_version/action.yaml
              - packages/shorebird_code_push_client/**
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml

      # Its own step: needs_verify's output is a list of package names that
      # verify_packages turns into a matrix, so this filter cannot join it.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Updater (Rust) Detection
        id: updater_rust
        with:
          base: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          filters: |
            updater_rust:
              - ./.github/workflows/main.yaml
              - vendor/updater/**

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Protocol Codegen Detection
        id: protocol_codegen
        with:
          filters: |
            protocol:
              - ./.github/workflows/main.yaml
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml

  verify_packages:
    needs: changes
    if: ${{ needs.changes.outputs.needs_verify != '[]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.HOSTED_RUNNERS == 'true') }}

    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.needs_verify) }}

    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    # Same stall guard; the slowest recent package takes about three minutes.
    timeout-minutes: 20

    name: 🔎 Verify ${{ matrix.package }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔎 Verify ${{ matrix.package }}
        uses: ./.github/actions/verify_version
        with:
          working_directory: packages/${{ matrix.package }}

  # vendor/updater is a Cargo workspace (library, library_test_hooks, patch).
  # Commands follow vendor/updater/CLAUDE.md; the lint pair is added on top.
  # Cargo covers the Rust workspace only. vendor/updater/shorebird_code_push
  # (the Dart package and its test/ files) is NOT run here or anywhere else:
  # it needs the Flutter SDK (`dart pub get` refuses it), which no runner has,
  # and it is vendored, so its pubspec is not ours to change. Re-vendoring
  # from route-b-ca91f4b3 kept it as-is.
  # cargo comes from rustup on the runner (the self-hosted host and the
  # hosted image both have it with rustfmt and clippy).
  updater_rust:
    needs: changes
    if: ${{ needs.changes.outputs.updater_rust == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.HOSTED_RUNNERS == 'true') }}
    name: 🦀 Updater (cargo)
    timeout-minutes: 45
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: vendor/updater
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🦀 Toolchain
        run: |
          # vendor/updater/rust-toolchain.toml picks the toolchain. Show it, so a
          # runner missing that version or a listed component fails here,
          # legibly, rather than in fmt or clippy.
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: 🎨 Format
        run: cargo fmt --check

      - name: 📎 Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Parallel threads. The route-b-ca91f4b3 tree marks the tests that touch
      # the global updater config #[serial]; 6 of 6 parallel runs and 6 of 6
      # single-threaded runs passed on ci-build. The old vendored tree failed 4
      # of 5 parallel runs, which is why this once ran with --test-threads=1.
      #
      # Proxy: the home runners reach the internet only through an allowlisting proxy
      # (http_proxy in the job env). Build and fetch through it, then run the
      # tests without it: network::tests assert what a device with no network
      # sees (an unresolvable host), and a proxy's CONNECT refusal is a
      # different error. Runner users have no DNS, so the direct attempt fails
      # the way those tests expect. The updater itself doesn't yet count a
      # proxy's refusal (ConnectProxyFailed) as a network error; that is a
      # tracked follow-up, since changing it means a new updater revision.
      - name: 🧪 Test
        run: |
          cargo test --locked --no-run
          env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u ALL_PROXY \
            cargo test --locked --offline

  protocol_codegen:
    name: 🔄 Verify Protocol Codegen
    needs: changes
    if: ${{ needs.changes.outputs.protocol_codegen == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.HOSTED_RUNNERS == 'true') }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: 📦 Install Dependencies
        run: dart pub get --no-example -C packages/shorebird_code_push_protocol

      - name: 🔄 Run Protocol Codegen
        run: dart run packages/shorebird_code_push_protocol/tool/gen.dart

      - name: 🔍 Check for Uncommitted Changes
        run: |
          status=$(git status --porcelain -- packages/shorebird_code_push_protocol)
          if [ -n "$status" ]; then
            echo "::error::packages/shorebird_code_push_protocol is out of date with openapi.yaml. Run: dart run packages/shorebird_code_push_protocol/tool/gen.dart"
            git status --short -- packages/shorebird_code_push_protocol
            git diff -- packages/shorebird_code_push_protocol
            exit 1
          fi

  agent_scripts_test:
    name: 🧪 Test Agent Scripts
    needs: changes
    if: ${{ needs.changes.outputs.agent_scripts == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.HOSTED_RUNNERS == 'true') }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧪 Run tool/agent_scripts_test.sh
        run: ./tool/agent_scripts_test.sh

  ci:
    needs:
      [actionlint, agent_scripts_test, changes, cspell_full_tree, license_check, protocol_codegen, supported_state, updater_pin, updater_rust, verify_packages, yaml_parses]
    # Not always(): that keeps this job alive through a run cancellation,
    # so a superseded push would report ci red on the stale commit. A
    # skipped required check reports success, which is the right answer
    # for a run nothing is waiting on.
    if: ${{ !cancelled() }}

    # Always the home runner, and no checkout: this job only reads needs, so
    # it also runs for a fork pull request, to say that no CI ran.
    runs-on: ${{ fromJSON('["self-hosted","linux","x64","shorebird"]') }}

    steps:
      - name: Refuse an outside pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && vars.HOSTED_RUNNERS != 'true' }}
        run: |
          echo "::error::Outside PR: CI did not run (no hosted runners). A maintainer must review the diff, including .github/, and run CI manually."
          exit 1

      - name: ⛔️ exit(1) on failure or cancellation
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
