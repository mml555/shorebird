# cspell:words clippy rustc
name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PRs only. A push run on main is the only place a commit's macOS and
  # Windows legs run, and Detect Changes diffs only against the previous
  # commit, so a cancelled main run would skip them for good.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Start CI by hand on any branch (Actions -> ci -> Run workflow).
  workflow_dispatch:
  pull_request:
  # Checks run on the queue's own temp branch, not the PR. Without this
  # trigger the required contexts never report there and the queue
  # ejects every PR at the timeout.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  license_check:
    name: 📄 License Check
    # Self-hosted (ci-build, on the owner's home LAN) only for trusted events:
    # a pull request from a fork keeps the hosted runner, so outside
    # contributors' code never reaches the LAN.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 👀 Check Licenses
        uses: ./.github/actions/license_check
        with:
          working_directory: ${{ github.workspace }}

  actionlint:
    name: 🔍 Lint Workflows
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    # The image pull from Docker Hub is the only network step; bound it so a
    # Docker Hub stall fails fast instead of holding the required check.
    timeout-minutes: 5
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Catches a workflow GitHub would refuse to start (it fails such a
      # workflow's runs with no jobs and no error on the PR), plus shellcheck
      # over every run: script. The image bundles shellcheck; config is in
      # .github/actionlint.yaml.
      - name: 🔍 Run actionlint
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12

  # A SECOND, DEDICATED job rather than flipping the one above to
  # modified_files_only: false. Three reasons, and the third is the one that
  # matters most:
  #   * the incremental job stays a known-green, fast regression signal;
  #   * this job carries ONE unambiguous claim -- the declared full-tree scope is
  #     clean -- instead of two claims sharing a name;
  #   * failures stay attributable. Changing the semantics of a job whose history
  #     people already read would make every past green mean something different.
  #
  # SCOPE IS DECLARED, NOT INHERITED. `--dot` is load-bearing: without it cspell
  # does not traverse into dot-named files, and selfhost/engine/.gclient.template
  # went unchecked for the life of the repo. Proven locally in both directions by
  # selfhost/scripts/cspell_scope_control.sh -- an ordinary-file typo and a
  # DOTFILE typo must each fail this exact command.
  cspell_full_tree:
    name: 🔤 Check Spelling (full tree)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🪄 Spell Check (declared full-tree scope)
        run: npx cspell --dot --no-progress --no-summary selfhost packages/code_push_server/lib

  changes:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's changed files through the API.
      pull-requests: read

    outputs:
      needs_verify: ${{ steps.needs_verify.outputs.changes }}
      updater_rust: ${{ steps.updater_rust.outputs.updater_rust }}

    name: 👀 Detect Changes

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Verify Detection
        id: needs_verify
        with:
          # A manual run has no PR or push to diff, so compare with main.
          base: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          filters: |
            shorebird_cli:
              - ./.github/workflows/main.yaml
              - ./.github/actions/verify_version/action.yaml
              - packages/dex/**
              - packages/scoped_deps/**
              - packages/shorebird_build_trace/**
              - packages/shorebird_cli/**
              - packages/shorebird_code_push_client/**
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_code_push_client:
              - ./.github/workflows/main.yaml
              - ./.github/actions/verify_version/action.yaml
              - packages/shorebird_code_push_client/**
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml

      # Its own step: needs_verify's output is a list of package names that
      # verify_packages turns into a matrix, so this filter cannot join it.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Updater (Rust) Detection
        id: updater_rust
        with:
          base: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          filters: |
            updater_rust:
              - ./.github/workflows/main.yaml
              - vendor/updater/**

  verify_packages:
    needs: changes
    if: ${{ needs.changes.outputs.needs_verify != '[]' }}

    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.needs_verify) }}

    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}

    name: 🔎 Verify ${{ matrix.package }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔎 Verify ${{ matrix.package }}
        uses: ./.github/actions/verify_version
        with:
          working_directory: packages/${{ matrix.package }}

  # vendor/updater is a Cargo workspace (library, library_test_hooks, patch).
  # Commands follow vendor/updater/CLAUDE.md; the lint pair is added on top.
  # cargo comes from rustup on the runner (the self-hosted host and the
  # hosted image both have it with rustfmt and clippy).
  updater_rust:
    needs: changes
    if: ${{ needs.changes.outputs.updater_rust == 'true' }}
    name: 🦀 Updater (cargo)
    timeout-minutes: 45
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: vendor/updater
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🦀 Toolchain
        run: |
          rustc --version
          cargo --version

      - name: 🎨 Format
        run: cargo fmt --check

      - name: 📎 Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Tests that call shorebird_init are #[serial] in the crate, so the
      # default parallel runner is safe.
      - name: 🧪 Test
        run: cargo test

  ci:
    needs: [actionlint, changes, license_check, updater_rust, verify_packages]
    # Not always(): that keeps this job alive through a run cancellation,
    # so a superseded push would report ci red on the stale commit. A
    # skipped required check reports success, which is the right answer
    # for a run nothing is waiting on.
    if: ${{ !cancelled() }}

    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}

    steps:
      - name: ⛔️ exit(1) on failure or cancellation
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
