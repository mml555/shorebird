# cspell:words pipefail
name: Publish Dart Package

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string
        description: Path to the package directory (e.g., packages/shorebird_ci).
      tag_prefix:
        required: true
        type: string
        description: |
          Tag prefix expected for this package (e.g., "shorebird_ci-v"). The
          version after the prefix must match the version in pubspec.yaml.
      needs_redis:
        required: false
        default: false
        type: boolean
        description: |
          Start a redis/redis-stack-server container before running tests.
          Required for packages whose test suite connects to Redis.

jobs:
  publish:
    name: 📦 Publish ${{ inputs.working_directory }}
    # The home runner (ci-build). pub.dev's OIDC publishing only checks the
    # repository and tag claims, so it works from a self-hosted runner too.
    runs-on: [self-hosted, linux, x64, shorebird]
    permissions:
      id-token: write

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐳 Run Redis
        if: inputs.needs_redis
        run: |
          docker pull redis/redis-stack-server:latest
          # Docker picks the host port, so jobs on the shared runner host
          # never collide on 6379. The tests read it from REDIS_PORT.
          name="redis-${{ github.run_id }}-${{ github.run_attempt }}-publish"
          docker run --name "$name" -d -p 127.0.0.1::6379 --rm -e REDIS_ARGS="--requirepass password" redis/redis-stack-server:latest
          echo "REDIS_CONTAINER=$name" >> "$GITHUB_ENV"
          echo "REDIS_PORT=$(docker port "$name" 6379/tcp | head -n1 | sed 's/.*://')" >> "$GITHUB_ENV"

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: 🔎 Verify tag matches pubspec version
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          PUBSPEC_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          TAG_VERSION="${GITHUB_REF_NAME#${{ inputs.tag_prefix }}}"
          echo "Tag version:     $TAG_VERSION"
          echo "Pubspec version: $PUBSPEC_VERSION"
          [ -n "$PUBSPEC_VERSION" ] || { echo "::error::no version found in pubspec.yaml"; exit 1; }
          [ -n "$TAG_VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME has no version after prefix ${{ inputs.tag_prefix }}"; exit 1; }
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pubspec version ($PUBSPEC_VERSION)"
            exit 1
          fi

      - name: 📦 Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: dart pub get

      - name: 🔍 Analyze
        working-directory: ${{ inputs.working_directory }}
        run: dart analyze --fatal-warnings lib test

      - name: 🧪 Test
        working-directory: ${{ inputs.working_directory }}
        run: dart test

      - name: 🚀 Publish (dry run)
        working-directory: ${{ inputs.working_directory }}
        run: dart pub publish --dry-run

      - name: 🚀 Publish
        working-directory: ${{ inputs.working_directory }}
        run: dart pub publish --force

      - name: 🐳 Stop Redis
        if: always() && inputs.needs_redis
        run: |
          if [ -n "${REDIS_CONTAINER:-}" ]; then
            docker rm -f "$REDIS_CONTAINER" || true
          fi
