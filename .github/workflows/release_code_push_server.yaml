# Publishes the self-hosted control plane as a multi-arch container image to
# GHCR, so operators can `docker pull` a known-good build instead of compiling
# from source.
#
# ONE INVARIANT: a server version names one source revision, one manifest
# digest, and one permanently retrievable set of bytes.
#
# The previous version of this workflow held none of those, and the damage is
# still visible in the registry. It fired on `selfhost-v*` as well as
# `code_push_server-v*`, took the image's version from whatever `pubspec.yaml`
# said in the ref it happened to build, and re-tagged unconditionally. Measured
# 2026-09-06:
#
#   :code_push_server-v1.3.0 -> sha256:a6e8bde7…  schema 8   (cf74eeda, the release)
#   :1.3.0 = :selfhost-v1.1.1 = :latest
#                            -> sha256:320338b8…  schema 12  (bdb234ab, a distribution tag)
#
# `:1.3.0` does not name the 1.3.0 release, and `:latest` followed the
# distribution tag. That historical tag is left exactly as it is: it is the
# evidence, and moving it again would be the same mistake a third time.
#
# What each trigger may now do (enforced in ops/release/, not here):
#   code_push_server-vX.Y.Z  the only event that may create :X.Y.Z or move
#                            :latest, and only if the tag and pubspec.yaml
#                            agree that this is X.Y.Z
#   selfhost-v*              a traceability tag for the distribution, nothing else
#   workflow_dispatch        neither; it keeps only its retention reference
#
# Every publish also gets `:source-<full commit>`. That is the reference a
# backup's recorded digest depends on: aliases move, and the bytes an operator
# needs to roll back to must outlive them.
#
# amd64 and arm64 are built on their own native runners and stitched into one
# manifest list afterwards. QEMU emulation is avoided deliberately: the build
# runs `dart compile exe`, an AOT compile that takes tens of minutes under
# emulation but ~a minute natively. Public repos get arm64 runners for free.
name: release_code_push_server

on:
  push:
    tags:
      - "selfhost-v*"
      - "code_push_server-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag, branch, or SHA) to build"
        required: true
        default: selfhost-v1.0.0
      latest:
        description: "Also move the :latest tag"
        type: boolean
        default: false

concurrency:
  group: release_code_push_server-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/code-push-server

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      # linux/amd64 -> linux-amd64, for use in artifact names (which can't
      # contain a slash).
      - name: Derive platform slug
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only — no tags here. The merge job below assembles the
      # per-arch digests into a single tagged manifest list. `provenance:
      # false` keeps each push a plain image manifest; the attestation
      # manifests buildx adds by default confuse `imagetools create`.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: packages/code_push_server
          file: packages/code_push_server/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}
          # Provenance the image itself carries, so a pulled image can be
          # traced to source without the registry's help.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ inputs.ref || github.ref_name }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The release resolver reads the tag object and the package manifest
          # at the commit it points to, so the history and tags must be here.
          fetch-depth: 0

      # A version names one source revision. Reading `version:` from whatever
      # ref was built is exactly how :1.3.0 came to name a build that is not
      # the 1.3.0 release, so the tag and the package must agree before
      # anything is published.
      - name: Resolve the release
        id: rel
        run: packages/code_push_server/ops/release/resolve_release.sh "${{ inputs.ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Write-once semantic tags, a retention reference per source commit, and
      # a read-back of every reference from the registry afterwards. See
      # ops/release/publish_release.sh — the logic lives there because it is
      # certified against a throwaway registry in
      # selfhost/scripts/spp1_certify.sh, and YAML cannot be.
      - name: Publish
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          MODE: ${{ steps.rel.outputs.mode }}
          VERSION: ${{ steps.rel.outputs.version }}
          COMMIT: ${{ steps.rel.outputs.commit }}
          GIT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          OUT: /tmp/release-provenance.json
        run: |
          CHILD_DIGESTS="$(cd /tmp/digests && for d in *; do printf 'sha256:%s ' "$d"; done)"
          export CHILD_DIGESTS
          packages/code_push_server/ops/release/publish_release.sh

      # Independent of the publish that produced it: resolve every reference
      # back from the registry and require it to be this release.
      - name: Verify the published release
        run: packages/code_push_server/ops/release/verify_release.sh /tmp/release-provenance.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-provenance
          path: /tmp/release-provenance.json
          if-no-files-found: error
