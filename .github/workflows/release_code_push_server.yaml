# Publishes the self-hosted control plane as a multi-arch container image to
# GHCR, so operators can `docker pull` a known-good build instead of compiling
# from source. Fires on the release tags this fork cuts, and can be re-run by
# hand against any ref.
#
# Image: ghcr.io/<owner>/code-push-server
#   :<pubspec version>   e.g. 1.1.0   — the pinned tag compose references
#   :<git tag>           e.g. selfhost-v1.0.0 — traceability back to the tag
#   :latest              — moved only by tag pushes, never by workflow_dispatch
#
# amd64 and arm64 are built on their own native runners and stitched into one
# manifest list afterwards. QEMU emulation is avoided deliberately: the build
# runs `dart compile exe`, an AOT compile that takes tens of minutes under
# emulation but ~a minute natively. Public repos get arm64 runners for free.
name: release_code_push_server

on:
  push:
    tags:
      - "selfhost-v*"
      - "code_push_server-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag, branch, or SHA) to build"
        required: true
        default: selfhost-v1.0.0
      latest:
        description: "Also move the :latest tag"
        type: boolean
        default: false

concurrency:
  group: release_code_push_server-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/code-push-server

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # linux/amd64 -> linux-amd64, for use in artifact names (which can't
      # contain a slash).
      - name: Derive platform slug
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only — no tags here. The merge job below assembles the
      # per-arch digests into a single tagged manifest list. `provenance:
      # false` keeps each push a plain image manifest; the attestation
      # manifests buildx adds by default confuse `imagetools create`.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: packages/code_push_server
          file: packages/code_push_server/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The image's version tag comes from the package manifest, not the git
      # tag: a `selfhost-v*` tag names the distribution, while the image is the
      # server, and the two version lines are independent.
      - name: Read server version
        id: version
        run: |
          VERSION="$(sed -n 's/^version: *//p' packages/code_push_server/pubspec.yaml | head -1)"
          if [ -z "$VERSION" ]; then
            echo "could not read version from pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Server version: $VERSION"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:latest` moves on a tag push, or on a manual run that opts in. A
      # manual rebuild of an old ref must not silently become `:latest`.
      - name: Assemble manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
          GIT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          MOVE_LATEST: ${{ startsWith(github.ref, 'refs/tags/') || inputs.latest }}
        run: |
          # Arrays, and `if` rather than `[ … ] && …`: these steps run under
          # `bash -e`, where a false test as the last command fails the step.
          args=(--tag "${IMAGE}:${VERSION}")
          if [ -n "$GIT_TAG" ]; then
            args+=(--tag "${IMAGE}:${GIT_TAG}")
          fi
          if [ "$MOVE_LATEST" = "true" ]; then
            args+=(--tag "${IMAGE}:latest")
          fi
          for digest in *; do
            args+=("${IMAGE}@sha256:${digest}")
          done
          echo "docker buildx imagetools create ${args[*]}"
          docker buildx imagetools create "${args[@]}"

      - name: Inspect published manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
