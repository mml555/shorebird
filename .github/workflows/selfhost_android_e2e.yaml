name: self-host android e2e

# Releases and patches an Android app with this checkout's CLI against a
# throwaway self-hosted code_push_server, on a phone from ci-build's device pool,
# and checks the phone boots the patch (selfhost/ci/android_pool_e2e.sh). Runs
# only on the home runners, which reach the pool and the CDN mirror on
# 127.0.0.1 (selfhost/ci-host/bin/gha-egress-apply).

concurrency:
  # One at a time: the pool has three phones, shared with other projects.
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  pull_request:
    paths:
      - .github/workflows/selfhost_android_e2e.yaml
      - selfhost/ci/android_pool_e2e.sh

permissions:
  contents: read

jobs:
  android_pool:
    name: android release and patch on a pool phone
    # Not for PRs from other repositories: the home runners take only this
    # repository's own code.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, shorebird]
    timeout-minutes: 45

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📱 Release and patch on a pool phone
        env:
          E2E_POOL_OWNER: shorebird-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        # The pinned Flutter 5b180d22 (engine cell f85251f3) ships no Linux Dart
        # SDK, so the CLI can't start on a Linux runner. While that is the pin,
        # test the Flutter 3.47 candidate (engine 7806e0fb, device-tested on
        # 2026-11-11), which the mirror serves for Linux. Any other pin is
        # tested as is, so this lapses by itself when the pin moves.
        #
        # Every job starts with an empty home, so Gradle would fetch all its
        # dependencies through the proxy again (25 minutes on 2026-11-12).
        # ci-build keeps oem's Gradle cache, filled by the same build; Gradle
        # reads it as a read-only dependency cache and never writes to it. The
        # runner users aren't in group oem, so a job's build code can't plant
        # jars there either; a cache the job could write is refused.
        run: |
          ro=/srv/ci-cache/home-cache/oem/.gradle/caches
          if [[ -w $ro/modules-2 || -w $ro/modules-2/files-2.1 ]]; then
            echo "::warning::$ro is writable by this job; not using it as a shared cache"
          elif [[ -r $ro/modules-2 && -x $ro/modules-2 ]]; then
            export GRADLE_RO_DEP_CACHE=$ro
            echo "read-only Gradle cache: $ro"
          else
            echo "::warning::no read-only Gradle cache at $ro; Gradle fetches everything through the proxy"
          fi
          if [[ $(cat bin/internal/flutter.version) == 5b180d224df04a267a19888c3f344474e243b382 ]]; then
            export E2E_FLUTTER_REVISION=9056dae9e28761f7508191146ae2469ba014be08
            echo "::warning::main pins Flutter 5b180d22, which has no Linux Dart SDK; testing the 3.47 candidate 9056dae9 instead"
          fi
          selfhost/ci/android_pool_e2e.sh
