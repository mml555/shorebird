# Generated by shorebird_ci --style static. Safe to edit.
# Run `shorebird_ci verify` to check for dep graph drift.
#
# This fork runs it. `shorebird_ci verify` checks that every package in the
# dep graph is covered by a job below; packages that are covered elsewhere, or
# are not CI's to run, are named in `verify --ignore` (see the comment at that
# step). This fork's server package is also covered by code_push_server.yaml,
# and the CLI by ci (main.yaml).
name: Shorebird CI

# A new push to a PR cancels that PR's run still going on the older head.
# Other events (push to main, merge_group) group by run id, so they never
# cancel or queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  # Checks run on the queue's own temp branch, not the PR. Without this
  # trigger the required contexts never report there and the queue
  # ejects every PR at the timeout.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) || vars.HOSTED_RUNNERS == 'true' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's changed files through the API.
      pull-requests: read
    outputs:
      artifact_proxy: ${{ steps.filter.outputs.artifact_proxy }}
      dex: ${{ steps.filter.outputs.dex }}
      elf: ${{ steps.filter.outputs.elf }}
      macho: ${{ steps.filter.outputs.macho }}
      scoped_deps: ${{ steps.filter.outputs.scoped_deps }}
      shorebird_build_trace: ${{ steps.filter.outputs.shorebird_build_trace }}
      shorebird_ci: ${{ steps.filter.outputs.shorebird_ci }}
      shorebird_cli: ${{ steps.filter.outputs.shorebird_cli }}
      shorebird_code_push_client: ${{ steps.filter.outputs.shorebird_code_push_client }}
      shorebird_code_push_protocol: ${{ steps.filter.outputs.shorebird_code_push_protocol }}
      shorebird_redis_client: ${{ steps.filter.outputs.shorebird_redis_client }}
      verify_cache: ${{ steps.filter.outputs.verify_cache }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so dorny/paths-filter can diff on push events.
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub global activate shorebird_ci 0.3.0
      # `verify --ignore` (by package name) is shorebird_ci's only exclusion
      # mechanism. Each group below is covered somewhere else, or not CI's:
      #  - selfhost/fixtures/* apps (airgap_probe, dynamic_modules, and the
      #    *_probe / *_app names): throwaway Flutter apps that the self-host
      #    e2e builds and runs against a real engine. They have no unit tests
      #    of their own.
      #  - shorebird_code_push, shorebird_code_push_example: vendor/updater is
      #    a vendored upstream tree. The updater_rust job in main.yaml runs
      #    its Rust (cargo) only. These two Dart packages, including the
      #    shorebird_code_push tests under vendor/updater, run NOWHERE: they
      #    need the Flutter SDK, which no runner has.
      #  - code_push_server: standalone package with its own workflow,
      #    code_push_server.yaml.
      #  - code_push_runtime: a Flutter package outside the Dart workspace
      #    (own pubspec.lock), tested with `flutter test`, and no runner has
      #    the Flutter SDK. It has tests (test/) that run nowhere for now.
      - name: Verify CI coverage
        run: >-
          shorebird_ci verify --ignore
          airgap_probe,android_signing_app,code_push_runtime,code_push_server,dynamic_modules,first_activation_probe,flavored_probe,injected_define_probe,killswitch_probe,manual_api_app,privatestate_probe,shorebird_code_push,shorebird_code_push_example,sign_probe_app,trackprobe_app,twoengine_probe
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event.merge_group.base_ref || '' }}
          filters: |
            artifact_proxy:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/artifact_proxy/**
              - pubspec.lock
              - pubspec.yaml
            dex:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/dex/**
              - pubspec.lock
              - pubspec.yaml
            elf:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/elf/**
              - pubspec.lock
              - pubspec.yaml
            macho:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/macho/**
              - pubspec.lock
              - pubspec.yaml
            scoped_deps:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/scoped_deps/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_build_trace:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/shorebird_build_trace/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_ci:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/shorebird_ci/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_cli:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/dex/**
              - packages/scoped_deps/**
              - packages/shorebird_build_trace/**
              - packages/shorebird_cli/**
              - packages/shorebird_code_push_client/**
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_code_push_client:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/shorebird_code_push_client/**
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_code_push_protocol:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_redis_client:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/redis_client/**
              - pubspec.lock
              - pubspec.yaml
            verify_cache:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/verify_cache/**
              - pubspec.lock
              - pubspec.yaml

  artifact_proxy:
    needs: changes
    if: needs.changes.outputs.artifact_proxy == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: artifact_proxy
      package_path: packages/artifact_proxy
      has_unit_tests: true
      subpackages: ""

  dex:
    needs: changes
    if: needs.changes.outputs.dex == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: dex
      package_path: packages/dex
      has_unit_tests: true
      subpackages: ""

  elf:
    needs: changes
    if: needs.changes.outputs.elf == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: elf
      package_path: packages/elf
      has_unit_tests: true
      subpackages: ""
      min_coverage: "100"

  macho:
    needs: changes
    if: needs.changes.outputs.macho == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: macho
      package_path: packages/macho
      has_unit_tests: true
      subpackages: ""
      min_coverage: "100"

  scoped_deps:
    needs: changes
    if: needs.changes.outputs.scoped_deps == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: scoped_deps
      package_path: packages/scoped_deps
      has_unit_tests: true
      subpackages: ""
      runners: '["macos-latest", "windows-latest", "ubuntu-latest"]'
      min_coverage: "100"

  shorebird_build_trace:
    needs: changes
    if: needs.changes.outputs.shorebird_build_trace == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: shorebird_build_trace
      package_path: packages/shorebird_build_trace
      has_unit_tests: true
      subpackages: ""

  shorebird_ci:
    needs: changes
    if: needs.changes.outputs.shorebird_ci == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: shorebird_ci
      package_path: packages/shorebird_ci
      has_unit_tests: true
      subpackages: ""
      runners: '["macos-latest", "windows-latest", "ubuntu-latest"]'
      min_coverage: "99.7"

  shorebird_cli:
    needs: changes
    if: needs.changes.outputs.shorebird_cli == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: shorebird_cli
      package_path: packages/shorebird_cli
      has_unit_tests: true
      subpackages: ""
      runners: '["macos-latest", "windows-latest", "ubuntu-latest"]'
      # Coverage is checked on the Linux leg only. These files' tests are
      # testOn: 'mac-os' (upstream too), so on Linux every line counts as
      # missed. The fork grew them by ~436 coverable lines, which pulled the
      # Linux figure to 92.06%. They are measured out here, and the minimum
      # is raised to the fork's figure on this basis (96.14%; upstream
      # 97.17%), so the gate does not loosen for the rest of the package.
      # NOTHING gates these files' coverage: _shorebird_ci_dart.yaml checks
      # coverage on ubuntu-latest only, and pull requests run only that leg,
      # so their mac-os tests run only on push to main with HOSTED_RUNNERS.
      # Fork logic in them with no real macOS dependency belongs in a file
      # whose tests run on Linux.
      coverage_excludes: >-
        **/lib/src/commands/patch/ios_patcher.dart
        **/lib/src/commands/patch/macos_patcher.dart
        **/lib/src/commands/release/ios_releaser.dart
        **/lib/src/commands/release/macos_releaser.dart
        **/lib/src/commands/release/apple_releaser_mixin.dart
      min_coverage: "96.1"

  shorebird_code_push_client:
    needs: changes
    if: needs.changes.outputs.shorebird_code_push_client == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: shorebird_code_push_client
      package_path: packages/shorebird_code_push_client
      has_unit_tests: true
      subpackages: ""
      runners: '["macos-latest", "windows-latest", "ubuntu-latest"]'
      min_coverage: "99.4"

  shorebird_code_push_protocol:
    needs: changes
    if: needs.changes.outputs.shorebird_code_push_protocol == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: shorebird_code_push_protocol
      package_path: packages/shorebird_code_push_protocol
      has_unit_tests: true
      subpackages: ""
      runners: '["macos-latest", "windows-latest", "ubuntu-latest"]'
      min_coverage: "97.6"

  shorebird_redis_client:
    needs: changes
    if: needs.changes.outputs.shorebird_redis_client == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: shorebird_redis_client
      package_path: packages/redis_client
      has_unit_tests: true
      subpackages: ""
      needs_redis: true
      min_coverage: "98.0"

  verify_cache:
    needs: changes
    if: needs.changes.outputs.verify_cache == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: verify_cache
      package_path: packages/verify_cache
      has_unit_tests: true
      subpackages: ""

  cspell:
    name: CSpell
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) || vars.HOSTED_RUNNERS == 'true' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","shorebird"]') || 'ubuntu-latest' }}
    # The cspell version is pinned below, but npx still resolves its
    # transitive dependencies unpinned, so the job gets a read-only token
    # and checkout doesn't leave it in .git/config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes cspell@10.4.0 --config cspell.config.yaml --no-progress "**"

  required:
    name: required
    if: ${{ !cancelled() }}
    needs:
      - changes
      - artifact_proxy
      - dex
      - elf
      - macho
      - scoped_deps
      - shorebird_build_trace
      - shorebird_ci
      - shorebird_cli
      - shorebird_code_push_client
      - shorebird_code_push_protocol
      - shorebird_redis_client
      - verify_cache
      - cspell
    runs-on: ${{ fromJSON('["self-hosted","linux","x64","shorebird"]') }}
    steps:
      - name: Refuse an outside pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && vars.HOSTED_RUNNERS != 'true' }}
        run: |
          echo "::error::Outside PR: CI did not run (no hosted runners). A maintainer must review the diff, including .github/, and run CI manually."
          exit 1
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were skipped because nothing changed)."

