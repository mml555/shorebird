name: Triage automation

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  add-needs-triage:
    if: github.event_name == 'issues'
    runs-on: [self-hosted, linux, x64, shorebird]
    steps:
      # ci-build has no gh. Fetch the release binary, checking it against the
      # release's checksums, unless one is already on PATH.
      - name: 🔧 Install gh
        run: |
          if ! command -v gh >/dev/null; then
            version=2.63.2
            archive="gh_${version}_linux_amd64.tar.gz"
            base="https://github.com/cli/cli/releases/download/v${version}"
            dir="$RUNNER_TEMP/gh"
            mkdir -p "$dir"
            curl -fsSL -o "$dir/$archive" "$base/$archive"
            curl -fsSL -o "$dir/checksums.txt" "$base/gh_${version}_checksums.txt"
            (cd "$dir" && grep " $archive\$" checksums.txt | sha256sum -c -)
            tar -xzf "$dir/$archive" -C "$dir" --strip-components=1
            echo "$dir/bin" >> "$GITHUB_PATH"
          fi

      - name: Add needs-triage label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api -X POST "repos/$REPO/issues/$NUMBER/labels" \
            -f 'labels[]=needs-triage'

  customer-replied:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: [self-hosted, linux, x64, shorebird]
    steps:
      # ci-build has no gh. Fetch the release binary, checking it against the
      # release's checksums, unless one is already on PATH.
      - name: 🔧 Install gh
        run: |
          if ! command -v gh >/dev/null; then
            version=2.63.2
            archive="gh_${version}_linux_amd64.tar.gz"
            base="https://github.com/cli/cli/releases/download/v${version}"
            dir="$RUNNER_TEMP/gh"
            mkdir -p "$dir"
            curl -fsSL -o "$dir/$archive" "$base/$archive"
            curl -fsSL -o "$dir/checksums.txt" "$base/gh_${version}_checksums.txt"
            (cd "$dir" && grep " $archive\$" checksums.txt | sha256sum -c -)
            tar -xzf "$dir/$archive" -C "$dir" --strip-components=1
            echo "$dir/bin" >> "$GITHUB_PATH"
          fi

      - name: Swap waiting-for-response to needs-triage on author reply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          has_waiting=$(gh api "repos/$REPO/issues/$NUMBER/labels" \
            --jq '[.[].name] | any(. == "waiting for response")')
          if [ "$has_waiting" = "true" ]; then
            gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/waiting%20for%20response"
            gh api -X POST "repos/$REPO/issues/$NUMBER/labels" -f 'labels[]=needs-triage'
          fi
