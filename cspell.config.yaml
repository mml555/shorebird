$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
# Tokens quoted in THIS FILE's comments as examples, not project vocabulary.
# Shoul in particular must NEVER become a dictionary word -- it is a genuine
# misspelling in upstream's test name, and the point of quoting it is that it
# stays wrong. File-scoped so it is invisible here and nowhere else.
# cspell:ignore Shoul shutil stdlib gskinner hlcl hlclpqwxzq hlclxeca hlclqjttgm hlclx hldxg wfyg VVFRF WRVJTSU UNRE Volemes Ünïcödé
# Step 1 §3, per evidence/cspell/classification_precommit.md.
#
# STANDARD BRITISH AND AMERICAN VARIANTS ARE BOTH ACCEPTED. This is NOT a house
# dialect. The words already in the list below -- analysed, behaviour,
# synthesised -- prove only that British forms OCCUR here and are not defects;
# they do not make American forms wrong. Choosing one dialect would be a style
# migration, and it should not happen silently inside a spelling cleanup. If the
# project ever wants a single editorial dialect, that is its own decision with
# its own scope.
#
# Acceptance is PER WORD, not per line: "behaviour" being fine does not make a
# typo beside it invisible, which is why this beats a dictionary dump or an
# exclusion. Resolves 237 findings with zero dictionary entries, keeping the
# dictionary what it claims to be -- project vocabulary.
language: "en,en-GB"
ignorePaths:
  [
    "coverage",
    "bin/cache",
    "third_party",
    "build",
    "*.xcscheme",
    "fixtures",
    # Vendored upstream source (pinned Flutter fork + updater). Third-party
    # prose and identifiers we don't author and shouldn't be gating on.
    "vendor",
    # The bare Git mirror of shorebirdtech/flutter. Linting this means linting
    # Git's own internal storage — packed-refs, and the sample hooks Git ships
    # (sendemail-validate, update, pre-receive...). It is not project prose or
    # source, and it accounted for most of the noise that made
    # `npx cspell selfhost` unable to pass.
    "selfhost/cdn/mirrors/**",
    # Generated local overlay state (engine artifacts + provenance records).
    # Gitignored, and the records embed mktemp paths whose random names are
    # not words. Nothing here is authored prose or source.
    "selfhost/cdn/overlay/**",
    # The recorded tree-wide cspell BASELINE. It is a list of unknown words by
    # construction, so checking it is circular -- and it would add ~1,770
    # findings to the very number it exists to measure. See
    # selfhost/evidence/cspell/README.md.
    "selfhost/evidence/cspell/**",
    # --- Step 1 exclusions, admitted under evidence/cspell/classification_precommit.md
    # §1. Each is generated/captured, is not edited here, and carries no authored
    # prose; each was paired-controlled through the promoted command before being
    # added (scripts/cspell_exclusion_control.sh). The counterexample that would
    # make each too broad is named -- if one comes true, the exclusion goes.
    #
    # gen_snapshot output: identifier->identifier, machine written and machine
    # read. TOO BROAD IF: anyone hand-edits one, or a reviewer reads one as docs.
    "selfhost/evidence/releases/*/obfuscation_map.json",
    # Verbatim copies of upstream C++ kept for diffing; edits belong in the
    # source tree. TOO BROAD IF: a snapshot acquires a locally written header.
    "selfhost/engine/route_b/instrumentation/*.snapshot",
    # Device trace output, captured verbatim. TOO BROAD IF: traces start
    # carrying an authored annotation block.
    "selfhost/evidence/**/*.trace",
    # NOT EXCLUDED, deliberately, though it would be worth ~314 findings:
    # selfhost/evidence/** at large. Those verdicts are AUTHORED -- they are the
    # project's reasoning, and their spelling is exactly what the gate is for.
    # Nor *.fulldiff.patch: "regenerated by script" is a generation shape, not an
    # invariant the format enforces, so the narrower override below takes it.
  ]
overrides:
  # Step 1 §4, per evidence/cspell/classification_precommit.md. A .patch file
  # holds BOTH machine content and prose this repo wrote, so the boundary is
  # inside the file rather than around it.
  #
  # WHY NOT THE WHOLE DIFF BODY. The first draft ignored every ^[-+ ] line. That
  # was MEASURED too broad: this repo's own patches add 1,775 authored comment
  # lines inside diff bodies, carrying 46 baseline findings the broad rule would
  # have hidden today, never mind future ones.
  #
  # KNOWN COVERAGE BOUNDARY, and it is a heuristic rather than a proof: diff-body
  # CODE lines are unwatched, and "carries no comment marker" only stands in for
  # "is machine content". If authored prose is ever added inside a diff body
  # OUTSIDE a comment -- a user-facing string, an error message, documentation as
  # code -- this override must be reconsidered before that content is accepted.
  # A green baseline does not upgrade this note into a guarantee.
  - filename: "**/*.patch"
    ignoreRegExpList:
      - "/^[-+ ](?![^\\n]*(?:\\/\\/|\\/\\*|^\\s*\\*\\s|#\\s))[^\\n]*$/gm"
      # Hunk headers. Unlike the line above this needs no heuristic: git writes
      # the whole line, offsets AND the trailing function context it extracts
      # from the file, so no part of it is authored here and no finding on it is
      # ever actionable. Found by READING the residue rather than counting it --
      # `Shoul`, from upstream's own misspelled test name
      # ShoulDiscardLayerTreeIfFrameIsSizedIncorrectly, which this fork cannot
      # fix without breaking the patch and which recurs in every patch touching
      # that file.
      - "/^@@ .*$/gm"

  # Step 1, the obfuscated-symbol class. Release-specific opaque Dart symbols
  # (hlclpqwxzq, hlclxeca3w, …) appear in device receipts pasted into evidence.
  # NEITHER shortcut is acceptable: a dictionary entry would be permanent noise
  # wearing the costume of vocabulary, since the symbols are RANDOM PER RELEASE;
  # and excluding the containing files would blind authored reasoning, because
  # gate2_verdict.txt quotes them inside its own argument.
  #
  # So the instrument is POSITIONAL, matching the ^@@ standard as closely as this
  # content allows: it suppresses the token occupying the SYMBOL FIELD of a
  # captured receipt line -- "dart <token> " -- and nothing else. Not a lexical
  # match on the hlcl prefix, which would be a rule about today's symbols rather
  # than about where machine values live.
  #
  # WHAT IT DELIBERATELY DOES NOT COVER: the same symbols quoted inside authored
  # prose, e.g. "Launch 1 (`hlclpqwxzq`) — full chain through `first-frame`".
  # Those lines are argument, not capture, and they stay visible as residual debt.
  # Suppressing them would need a rule over inline code spans, which is broader
  # than the value it buys.
  - filename: "selfhost/evidence/**"
    ignoreRegExpList:
      - "/^\\s*dart [A-Za-z0-9]+(?= )/gm"

  # --- The final thirteen. Each is a quoted opaque identifier, a literal
  # fragment, deliberately malformed text, or test data. NONE is project
  # vocabulary and none is an actionable spelling defect, so a dictionary entry
  # would be wrong and a structural exclusion would cost coverage nothing here
  # requires. `ignoreWords` scoped to one filename is the smallest instrument
  # cspell offers: exact token, exact file.
  #
  # NOTE ON METHOD: this is done in the CONFIG rather than with in-file
  # `cspell:ignore` directives on purpose. Four of these six files are EVIDENCE
  # RECORDS -- verdicts, a RECORDED file, a device receipt transcript. Adding a
  # linter directive to a record edits the record. Scoping from outside leaves
  # every one of them byte-identical.
  #
  # Each entry below was controlled: the token is reported before, absent after,
  # and a deliberate typo planted in authored text BESIDE it stays reported
  # through the tree-wide command. See evidence/cspell/token_control.txt.

  # Opaque launch ids, quoted inside the argument about which launch did what.
  - filename: "selfhost/evidence/g15/gate2_verdict.txt"
    ignoreWords: [hlclpqwxzq, hlclqjttgm, hlclx, hlclxeca]
  - filename: "selfhost/evidence/g15/gate5_armA_inconclusive.txt"
    ignoreWords: [hldxg, wfyg]

  # Fragments of a base64 literal quoted in a command example.
  - filename: "selfhost/evidence/g41-define-from-file/DECLARES.md"
    ignoreWords: [VVFRF, WRVJTSU]

  # "UNRE-CHECKABLE", authored with a hyphen for emphasis. Preserved exactly as
  # written rather than teaching the dictionary that UNRE is a word.
  - filename: "selfhost/evidence/releases/24/RECORDED"
    ignoreWords: [UNRE]

  # A correction note quoting a path this plan once misspelled. Like `Shoul`, it
  # must stay visibly wrong where it is quoted -- the underlying typo is already
  # fixed and this note is its only surviving trace.
  - filename: "selfhost/plans/H4-gen-snapshot-obfuscation-map.md"
    ignoreWords: [Volemes]

  # Deliberate non-ASCII test input for the lowering matrix.
  - filename: "selfhost/engine/route_b/probes/lowering_matrix.sh"
    ignoreWords: ["Ünïcödé"]

