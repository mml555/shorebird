  # MUTABLE-AOT (#62) program vocabulary. Global rather than inline because it
  # spans the matrix, the contract, the frozen universes, the gate and the
  # evidence -- and every later issue (#64-#77) adds more files using the same
  # terms. The Dart/VM identifiers below are EXTRACTED MECHANICALLY from
  # pkg/kernel and runtime/vm, so they reappear on every universe re-derivation
  # and cannot be reworded.
  - MAOT # the program's issue prefix, and its directory name
  - unmodeled # a matrix axis state: nothing has been designed for it yet
  - unretained # a Function the precompiler did not keep
  - Dmaot # the -D define prefix the MAOT gate passes to gen_kernel
