  # Fixture and artifact names, which are identifiers rather than words:
  - killswitch
  - twoengine
  - trackprobe
  - flavorprobe
  - rbtrace # the .routeb.trace device capture
  # Tooling and platform vocabulary:
  - worktree # git
  - oneline # git log --oneline
  - rmtree # ios-deploy --rmtree, shutil.rmtree
  - noninteractive # the CI/CLI mode
