  - xcconfigs # plural of xcconfig, already present singular
  - interp # Route B's interpreter, as abbreviated throughout
  - ldur # Arm64 instruction, Load Register unscaled (cf. orri below)
  # PROPER NOUN -- DO NOT "CORRECT" THIS. cspell suggests "Wondrous" and that
  # suggestion is wrong: the app is gskinnerTeam/flutter-wonderous-app, and the
  # spelling is the project's own pun. 17 findings sat behind this one word, so
  # a count-driven cleanup would have renamed a real third-party application
  # across the evidence that cites it.
  - Wonderous
