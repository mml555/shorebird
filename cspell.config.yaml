$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
# Tokens quoted in THIS FILE's comments as examples, not project vocabulary.
# Shoul in particular must NEVER become a dictionary word -- it is a genuine
# misspelling in upstream's test name, and the point of quoting it is that it
# stays wrong. File-scoped so it is invisible here and nowhere else.
# cspell:words cand elig ents envx fals getsize logf stdev trav
# The selfhost/ci-host vocabulary listed in the override below:
# cspell:words nftables slirp oifname iifname dport daddr skuid ROOTLESSKIT rootlesskit subuid subgid subuids setpriv jobpath tokfile reuid regid productionresultssa pipelinesghubeus eastus npmjs localnet journalctl esac dstdomain dstdom cgroupv cgroupfs cgroupdriver xdev userns usermod uploadpurging smhd shopt setuid rootdirectory remoteurl oneshot nullglob nsenter newuidmap newgidmap gpasswd getent drunner disableupdate crontabs coredump cmdline clippy alpinelinux NOFILE LOGNAME EUID pgrep
# cspell:ignore delibrate mispelt Shoul shutil stdlib gskinner hlcl hlclpqwxzq hlclxeca hlclqjttgm hlclx hldxg wfyg VVFRF WRVJTSU UNRE Volemes Ünïcödé
# The tokens this file lists as ignoreWords or inline-scoped vocabulary, which
# would otherwise be reported here, in the one place that names them.
# cspell:ignore Adev ARMC awdd backouts backportcheck baselined Closurization closurized coolify corevideo crashreports cstring ctypes dontneed flavoredprobe frontboard gsprobe HEISENBUG hlfr idevicebackup inspectable jarsigner jwtfix kinded libpostal LINKEDIT Metaspace metriclog NCPU nehelper nogncheck nutsdb operationalization parsecd productionized readback rearchive Refena refetched refspec relauncher reminted remoteserver Rssi screentime shidduchcard signprobe simarm Siri staticness subsys systemappservices SYSV twolib unbisected undeployed UNDOTTED unexcluded unflushed unphotographed Unscorable unshallowed usagetracking WWDR XCUI ZEROFILL
# Step 1 §3, per evidence/cspell/classification_precommit.md.
#
# STANDARD BRITISH AND AMERICAN VARIANTS ARE BOTH ACCEPTED. This is NOT a house
# dialect. The words already in the list below -- analysed, behaviour,
# synthesised -- prove only that British forms OCCUR here and are not defects;
# they do not make American forms wrong. Choosing one dialect would be a style
# migration, and it should not happen silently inside a spelling cleanup. If the
# project ever wants a single editorial dialect, that is its own decision with
# its own scope.
#
# Acceptance is PER WORD, not per line: "behaviour" being fine does not make a
# typo beside it invisible, which is why this beats a dictionary dump or an
# exclusion. Resolves 237 findings with zero dictionary entries, keeping the
# dictionary what it claims to be -- project vocabulary.
language: "en,en-GB"
ignorePaths:
  [
    "coverage",
    "bin/cache",
    "third_party",
    "build",
    "*.xcscheme",
    "fixtures",
    # Vendored upstream source (pinned Flutter fork + updater). Third-party
    # prose and identifiers we don't author and shouldn't be gating on.
    "vendor",
    # The bare Git mirror of shorebirdtech/flutter. Linting this means linting
    # Git's own internal storage — packed-refs, and the sample hooks Git ships
    # (sendemail-validate, update, pre-receive...). It is not project prose or
    # source, and it accounted for most of the noise that made
    # `npx cspell selfhost` unable to pass.
    "selfhost/cdn/mirrors/**",
    # Generated local overlay state (engine artifacts + provenance records).
    # Gitignored, and the records embed mktemp paths whose random names are
    # not words. Nothing here is authored prose or source.
    "selfhost/cdn/overlay/**",
    # Mutable-AOT evidence records. Machine-generated by the lane gates, and
    # they embed canonical ABI strings whose fields are variable-length
    # renderings (one letter per argument) plus #65 identity strings. Adding
    # each rendering to the dictionary is a losing game, and the records are
    # data rather than authored prose. The gates that WRITE them are checked.
    "selfhost/engine/mutable_aot/*/evidence/**",
    # The cspell method record. The 1,770-line BASELINE that first justified this
    # exclusion is deleted (debt cleared, gate promoted), but the exclusion stays
    # for a second reason it always also had: these documents QUOTE misspellings
    # as specimens -- Shoul, Volemes, delibrate, mispelt -- and checking them
    # would be circular.
    "selfhost/evidence/cspell/**",
    # --- Step 1 exclusions, admitted under evidence/cspell/classification_precommit.md
    # §1. Each is generated/captured, is not edited here, and carries no authored
    # prose; each was paired-controlled through the promoted command before being
    # added (scripts/cspell_exclusion_control.sh). The counterexample that would
    # make each too broad is named -- if one comes true, the exclusion goes.
    #
    # gen_snapshot output: identifier->identifier, machine written and machine
    # read. TOO BROAD IF: anyone hand-edits one, or a reviewer reads one as docs.
    "selfhost/evidence/releases/*/obfuscation_map.json",
    # Verbatim copies of upstream C++ kept for diffing; edits belong in the
    # source tree. TOO BROAD IF: a snapshot acquires a locally written header.
    "selfhost/engine/route_b/instrumentation/*.snapshot",
    # Device trace output, captured verbatim. TOO BROAD IF: traces start
    # carrying an authored annotation block.
    "selfhost/evidence/**/*.trace",
    # NOT EXCLUDED, deliberately, though it would be worth ~314 findings:
    # selfhost/evidence/** at large. Those verdicts are AUTHORED -- they are the
    # project's reasoning, and their spelling is exactly what the gate is for.
    # Nor *.fulldiff.patch: "regenerated by script" is a generation shape, not an
    # invariant the format enforces, so the narrower override below takes it.
    # Release notes quote upstream commit text verbatim.
    "RELEASE_NOTES.md",
    # --- Machine-generated records, same shape as the mutable_aot evidence entry
    # above: written by capture scripts or by the device/OS, read by gates, not
    # authored. Each glob is narrow by file kind so authored .md/.sh/.py/.dart
    # beside them stay checked. TOO BROAD IF: anyone hand-writes prose into one.
    #
    # iOS crash reports (.ips) and the per-run capture manifests/lists of the
    # first-activation reliability runs. CLASSIFICATION.md, PM_RULING.md and
    # VOID.md in the same directories are authored and stay checked.
    "selfhost/reliability/first_activation_runs/**/*.ips",
    "selfhost/reliability/first_activation_runs/**/manifest.txt",
    "selfhost/reliability/first_activation_runs/**/crashreports_new*.txt",
    # Gate-recorded evidence data (JSON and captured text) of the semantic-map,
    # semantic-linker, Route B DI and Dart-durability lanes. Their evidence
    # directories also hold an authored .md (recorder_completeness.md), which
    # is deliberately not matched.
    "selfhost/engine/{semantic_map,semantic_linker,route_b_di,dart_durability}/**/evidence/**/*.{json,jsonl,txt}",
    # G15 device-run receipts: launch-marker captures and the before/after
    # state dumps the capture script writes (obfuscated symbols and all).
    "selfhost/evidence/g15/**/{g15_receipt*,r_before,r_after}",
    # P6 device syslog excerpts and OS crash reports, captured verbatim.
    "selfhost/evidence/p6-signing/*syslog*.txt",
    "selfhost/evidence/p6-signing/crash_reports/**",
    "selfhost/evidence/p6-tracks/*syslog*.txt",
  ]
overrides:
  # The CI runner host (selfhost/ci-host): nftables, squid, systemd and rootless-Docker
  # vocabulary used across 13 of its files, so scoped here rather than inline.
  - filename: "selfhost/ci-host/**"
    words:
      - nftables
      - slirp
      - oifname
      - iifname
      - dport
      - daddr
      - skuid
      - ROOTLESSKIT
      - rootlesskit
      - subuid
      - subgid
      - subuids
      - setpriv
      - jobpath
      - tokfile
      - reuid
      - regid
      - productionresultssa
      - pipelinesghubeus
      - eastus
      - npmjs
      - localnet
      - journalctl
      - esac
      - dstdomain
      - dstdom
      - cgroupv
      - cgroupfs
      - cgroupdriver
      - xdev
      - userns
      - usermod
      - uploadpurging
      - smhd
      - shopt
      - setuid
      - rootdirectory
      - remoteurl
      - oneshot
      - nullglob
      - nsenter
      - newuidmap
      - newgidmap
      - gpasswd
      - getent
      - drunner
      - disableupdate
      - crontabs
      - coredump
      - cmdline
      - clippy
      - alpinelinux
      - NOFILE
      - LOGNAME
      - EUID
      - pgrep

  # Step 1 §4, per evidence/cspell/classification_precommit.md. A .patch file
  # holds BOTH machine content and prose this repo wrote, so the boundary is
  # inside the file rather than around it.
  #
  # WHY NOT THE WHOLE DIFF BODY. The first draft ignored every ^[-+ ] line. That
  # was MEASURED too broad: this repo's own patches add 1,775 authored comment
  # lines inside diff bodies, carrying 46 baseline findings the broad rule would
  # have hidden today, never mind future ones.
  #
  # KNOWN COVERAGE BOUNDARY, and it is a heuristic rather than a proof: diff-body
  # CODE lines are unwatched, and "carries no comment marker" only stands in for
  # "is machine content". If authored prose is ever added inside a diff body
  # OUTSIDE a comment -- a user-facing string, an error message, documentation as
  # code -- this override must be reconsidered before that content is accepted.
  # A green baseline does not upgrade this note into a guarantee.
  - filename: "**/*.patch"
    ignoreRegExpList:
      - "/^[-+ ](?![^\\n]*(?:\\/\\/|\\/\\*|^\\s*\\*\\s|#\\s))[^\\n]*$/gm"
      # Hunk headers. Unlike the line above this needs no heuristic: git writes
      # the whole line, offsets AND the trailing function context it extracts
      # from the file, so no part of it is authored here and no finding on it is
      # ever actionable. Found by READING the residue rather than counting it --
      # `Shoul`, from upstream's own misspelled test name
      # ShoulDiscardLayerTreeIfFrameIsSizedIncorrectly, which this fork cannot
      # fix without breaking the patch and which recurs in every patch touching
      # that file.
      - "/^@@ .*$/gm"

  # Step 1, the obfuscated-symbol class. Release-specific opaque Dart symbols
  # (hlclpqwxzq, hlclxeca3w, …) appear in device receipts pasted into evidence.
  # NEITHER shortcut is acceptable: a dictionary entry would be permanent noise
  # wearing the costume of vocabulary, since the symbols are RANDOM PER RELEASE;
  # and excluding the containing files would blind authored reasoning, because
  # gate2_verdict.txt quotes them inside its own argument.
  #
  # So the instrument is POSITIONAL, matching the ^@@ standard as closely as this
  # content allows: it suppresses the token occupying the SYMBOL FIELD of a
  # captured receipt line -- "dart <token> " -- and nothing else. Not a lexical
  # match on the hlcl prefix, which would be a rule about today's symbols rather
  # than about where machine values live.
  #
  # WHAT IT DELIBERATELY DOES NOT COVER: the same symbols quoted inside authored
  # prose, e.g. "Launch 1 (`hlclpqwxzq`) — full chain through `first-frame`".
  # Those lines are argument, not capture, and they stay visible as residual debt.
  # Suppressing them would need a rule over inline code spans, which is broader
  # than the value it buys.
  - filename: "selfhost/evidence/**"
    ignoreRegExpList:
      - "/^\\s*dart [A-Za-z0-9]+(?= )/gm"
      # Launch ids: the obfuscated per-launch label a device build prints
      # ("hl" plus eight base-36 characters, e.g. hlfr7vj9g1), quoted in the
      # verdicts that say which launch did what. Random per launch, so they are
      # identifiers and never vocabulary; the shape is exact, so a typo in the
      # prose beside one still stays reported.
      - "/(?<![A-Za-z0-9])hl[a-z0-9]{8}(?![A-Za-z0-9])/g"

  # --- The final thirteen. Each is a quoted opaque identifier, a literal
  # fragment, deliberately malformed text, or test data. NONE is project
  # vocabulary and none is an actionable spelling defect, so a dictionary entry
  # would be wrong and a structural exclusion would cost coverage nothing here
  # requires. `ignoreWords` scoped to one filename is the smallest instrument
  # cspell offers: exact token, exact file.
  #
  # NOTE ON METHOD: this is done in the CONFIG rather than with in-file
  # `cspell:ignore` directives on purpose. Four of these six files are EVIDENCE
  # RECORDS -- verdicts, a RECORDED file, a device receipt transcript. Adding a
  # linter directive to a record edits the record. Scoping from outside leaves
  # every one of them byte-identical.
  #
  # Each entry below was controlled: the token is reported before, absent after,
  # and a deliberate typo planted in authored text BESIDE it stays reported
  # through the tree-wide command. See evidence/cspell/token_control.txt.

  # Opaque launch ids, quoted inside the argument about which launch did what.
  - filename: "selfhost/evidence/g15/gate2_verdict.txt"
    ignoreWords: [hlclpqwxzq, hlclqjttgm, hlclx, hlclxeca]
  - filename: "selfhost/evidence/g15/gate5_armA_inconclusive.txt"
    ignoreWords: [hldxg, wfyg]

  # Fragments of a base64 literal quoted in a command example.
  - filename: "selfhost/evidence/g41-define-from-file/DECLARES.md"
    ignoreWords: [VVFRF, WRVJTSU]

  # "UNRE-CHECKABLE", authored with a hyphen for emphasis. Preserved exactly as
  # written rather than teaching the dictionary that UNRE is a word.
  - filename: "selfhost/evidence/releases/24/RECORDED"
    ignoreWords: [UNRE]

  # A correction note quoting a path this plan once misspelled. Like `Shoul`, it
  # must stay visibly wrong where it is quoted -- the underlying typo is already
  # fixed and this note is its only surviving trace.
  - filename: "selfhost/plans/H4-gen-snapshot-obfuscation-map.md"
    ignoreWords: [Volemes]

  # Deliberate non-ASCII test input for the lowering matrix.
  - filename: "selfhost/engine/route_b/probes/lowering_matrix.sh"
    ignoreWords: ["Ünïcödé"]

  # --- Record-scoped exact tokens (full-tree gate). Same method as the entries
  # above: exact token, exact file, set from OUTSIDE so the evidence record or
  # data file stays byte-identical (JSON and captured text cannot carry a
  # directive). Each token is an identifier, a quoted fragment, or an
  # abbreviation inside the record, not project vocabulary.
  - filename: "selfhost/engine/route_b/0014-atomic-prepare-next-boot.patch"
    ignoreWords: [dontneed, nogncheck]
  - filename: "selfhost/engine/route_b/super0/s2a/localsend.equiv.txt"
    ignoreWords: [Refena]
  - filename: "selfhost/engine/semantic_linker/runtime_feasibility/g0_freeze/banked_source/dart/0002-Route-B-Dart-SDK-support-bytecode-producer-and-the-t.patch"
    ignoreWords: [Closurization, closurized]
  - filename: "selfhost/engine/semantic_map/g1_identity/EXPECTATIONS_EXT.json"
    ignoreWords: [kinded]
  - filename: "selfhost/engine/semantic_map/g2_fingerprints/EXPECTATIONS_G2.json"
    ignoreWords: [twolib]
  - filename: "selfhost/engine/semantic_map/g5_patchability/instrumentation/0002-g5-inlining-relation.patch"
    ignoreWords: [staticness]
  - filename: "selfhost/evidence/cli-backport-1.6.123/cli_integration.sh"
    ignoreWords: [backportcheck]
  - filename: "selfhost/evidence/cli-backport-1.6.123/start_and_seed.sh"
    ignoreWords: [backportcheck]
  - filename: "selfhost/evidence/d-super-2c/SIGN_141.md"
    ignoreWords: [cstring, LINKEDIT, rearchive, Rssi, subsys, WWDR, ZEROFILL]
  - filename: "selfhost/evidence/epoch-b-canary/CANARY_EVIDENCE.md"
    ignoreWords: [signprobe]
  - filename: "selfhost/evidence/epoch-b-canary/crash_baseline/DifferentialPrivacy_2026-08-27-173735.diff_privacy.anon"
    ignoreWords: [screentime, usagetracking]
  - filename: "selfhost/evidence/epoch-b-canary/crash_baseline/SiriSearchFeedback-2026-08-27-155740.000.ips"
    ignoreWords: [parsecd]
  - filename: "selfhost/evidence/epoch-b-canary/crash_baseline/SiriSearchFeedback-2026-08-27-155740.ips"
    ignoreWords: [parsecd]
  - filename: "selfhost/evidence/g15/cycle_0013_prepared_state.md"
    ignoreWords: [refetched]
  - filename: "selfhost/evidence/g15/hybrid_method_control_verdict.txt"
    ignoreWords: [unexcluded]
  - filename: "selfhost/evidence/g15/layer3_verdict.md"
    ignoreWords: [unflushed]
  - filename: "selfhost/evidence/g15/lost_update_precommit.md"
    ignoreWords: [HEISENBUG]
  - filename: "selfhost/evidence/g15/lost_update_verdict.md"
    ignoreWords: [Heisenbug]
  - filename: "selfhost/evidence/g15/manual_launch_control_verdict.txt"
    ignoreWords: [unphotographed]
  - filename: "selfhost/evidence/g15/nonbooting_capture_precommit.md"
    ignoreWords: [idevicebackup]
  - filename: "selfhost/evidence/g15/nonbooting_capture_verdict.md"
    ignoreWords: [relauncher, remoteserver]
  - filename: "selfhost/evidence/g15/patchable_emission_ab.md"
    ignoreWords: [gsprobe]
  - filename: "selfhost/evidence/g15/r91_behavioral_verdict.txt"
    ignoreWords: [unbisected]
  - filename: "selfhost/evidence/g15/routeb_behavioral_evidence_audit.md"
    ignoreWords: [UNDOTTED]
  - filename: "selfhost/evidence/g15/sixlaunch_after_verdict.md"
    ignoreWords: [undeployed]
  - filename: "selfhost/evidence/g15/sixlaunch_before/FREEZE.txt"
    ignoreWords: [afcclient's]
  - filename: "selfhost/evidence/g15/sixlaunch_before/set_mode.sh"
    ignoreWords: [afcclient's, readback]
  - filename: "selfhost/evidence/g15/target_kind_precommit.md"
    ignoreWords: [undotted]
  - filename: "selfhost/evidence/g15/tombstone_lane/FINAL/operator_report.txt"
    ignoreWords: [backouts]
  - filename: "selfhost/evidence/g15/tombstone_lane/S2/syslog_hung_process_3518.txt"
    ignoreWords: [Adev, corevideo, frontboard, systemappservices]
  - filename: "selfhost/evidence/g15/tombstone_lane_FINAL.md"
    ignoreWords: [backouts]
  - filename: "selfhost/evidence/g15/tombstone_lane_PARKED.md"
    ignoreWords: [Unscorable, XCUI]
  - filename: "selfhost/evidence/g15/tombstone_lane_reconciliation.md"
    ignoreWords: [relauncher]
  - filename: "selfhost/evidence/jwt_issuer_repair.md"
    ignoreWords: [jwtfix]
  - filename: "selfhost/evidence/p6-custom-target/ARM_LOG.md"
    ignoreWords: [baselined]
  - filename: "selfhost/evidence/p6-signing/ARMC_CRASH_CLASSIFICATION.md"
    ignoreWords: [awdd, metriclog, Siri]
  - filename: "selfhost/evidence/p6-signing/ARM_B_PACKAGE_SIGNING.md"
    ignoreWords: [jarsigner]
  - filename: "selfhost/evidence/p6-signing/ARM_C_DEVICE_SIGNATURE.md"
    ignoreWords: [ctypes, signprobe]
  - filename: "selfhost/evidence/p6-signing/PRODUCER_GATE_ENGINE_IDENTITY.md"
    ignoreWords: [reminted]
  - filename: "selfhost/evidence/p6-signing/RUNTIME_SOURCE_BANKED.md"
    ignoreWords: [inspectable, unshallowed]
  - filename: "selfhost/evidence/p6-toolchain-pin/STATUS.md"
    ignoreWords: [refspec]
  - filename: "selfhost/evidence/p6-tracks/ARM_LOG.md"
    ignoreWords: [nehelper]
  - filename: "selfhost/evidence/p6-tracks/VERDICT.md"
    ignoreWords: [flavoredprobe]
  - filename: "selfhost/evidence/r12-linux-ci/ARM_B_ATTEMPT1.md"
    ignoreWords: [coolify, libpostal, Metaspace]
  - filename: "selfhost/evidence/r12-linux-ci/BOOTSTRAP_CLOSURE.md"
    ignoreWords: [nutsdb]
  - filename: "selfhost/evidence/r12-linux-ci/CERTIFICATION.md"
    ignoreWords: [operationalization, productionized]
  - filename: "selfhost/evidence/r12-linux-ci/PREFLIGHT.md"
    ignoreWords: [simarm, SYSV]
  # host_memory.txt is captured by the R12 harness (docker stats and the VM's
  # NCPU), so every arm's copy carries the same tokens.
  - filename: "selfhost/evidence/r12-linux-ci/**/host_memory.txt"
    ignoreWords: [libpostal, NCPU, shidduchcard]

  # Short loop-variable-style tokens that are only words in the selfhost Python
  # and shell gate scripts. Scoped here, not in `words:`, so a stray "fals" in
  # authored Dart or docs still fails.
  - filename: "selfhost/**/*.{py,sh}"
    words: [cand, elig, ents, envx, fals, getsize, logf, stdev, trav]
  # The same tokens where they appear in prose or captured output.
  - filename: "selfhost/engine/mutable_aot/m5/STAGE4[36]-*.md"
    words: [elig]
  - filename: "selfhost/engine/semantic_{linker,map}/**/*.{md,json,txt}"
    words: [stdev]

words:
  # --- BACKUP-RESTORE-1. Vocabulary shared by the backup/restore scripts, the
  # certification harness and the ops docs: the quiesce family (the property
  # the backup now enforces), Postgres catalog column names, and the python
  # stdlib names the manifest tooling calls. Per-file identifiers stay inline.
  # UPGRADE-ROLLBACK-1: the standard exit-code name the migration guard uses.
  - DATAERR
  # SERVER-IMAGE-PROVENANCE-1: the OCI label namespace, and the two properties
  # a released image has to have.
  - opencontainers
  - pullable
  - reacquirable
  - quiesce
  - quiesced
  - quiesces
  - quiescing
  - unquiesced
  - psql
  - tablename
  - schemaname
  - hashlib
  - hexdigest
  - relpath
  - isfile
  - isoformat
  - newchannel
  - settrack
  - stdlib
  - cleanroom
  - unpushed
  - seatbelt
  # --- Step 1 §2, admitted by the SEMANTIC test in
  # evidence/cspell/classification_precommit.md: "is this stable project or
  # domain vocabulary that should stay spell-checked in context?" -- never
  # "does adding it lower the count?". Each survived §3 because none is a
  # standard spelling variant. Frequency is why they were reviewed first, not
  # why they were admitted.
  #
  # This project's own methodology and mechanism vocabulary:
  - precommit
  - precommits
  - precommitted
  - precommitting
  - precommitment
  - backout # G15: backing a bad patch out
  - crashbackout # the G15 arm that backs out on a Dart-phase crash
  - unrun # a probe/arm that exists but has not been executed
  - selftest # the negative-control mode a probe runs against itself
  # Fixture and artifact names, which are identifiers rather than words:
  - killswitch
  - privatestate # the P1 device specimen fixture
  - twoengine
  - trackprobe
  - flavorprobe
  - rbtrace # the .routeb.trace device capture
  - APPSTORE # selfhost/APPSTORE_COMPLIANCE.md, referenced from four documents
  # Route B capability vocabulary. Four documents each, so global rather than
  # inline: these name the two axes the private-scope work is measured on.
  - dispatchable # a member the release can still dispatch by name
  - allocatability # whether a retained private class can be CONSTRUCTED
  # Probe arm labels, which are identifiers rather than words. Four documents
  # each once PARITY and ROADMAP cite them:
  - Cctl # the allocatability probe's retention control
  - Cfix # its candidate-fix arms
  # Bind-arm markers, which are identifiers rather than words:
  - FLDF # private FieLD read
  - GETG # private GETter
  - MTHM # private MeTHod
  # Tooling and platform vocabulary:
  - worktree # git
  - oneline # git log --oneline
  - rmtree # ios-deploy --rmtree, shutil.rmtree
  - noninteractive # the CI/CLI mode
  - pathlib # Python stdlib
  - xcconfigs # plural of xcconfig, already present singular
  - interp # Route B's interpreter, as abbreviated throughout
  - ldur # Arm64 instruction, Load Register unscaled (cf. orri below)
  # PROPER NOUN -- DO NOT "CORRECT" THIS. cspell suggests "Wondrous" and that
  # suggestion is wrong: the app is gskinnerTeam/flutter-wonderous-app, and the
  # spelling is the project's own pun. 17 findings sat behind this one word, so
  # a count-driven cleanup would have renamed a real third-party application
  # across the evidence that cites it.
  - Wonderous
  # --- Step 2 of the residue sequence: stable project and tool vocabulary,
  # same semantic test. Lowercase entries, which match every casing, so the
  # SYMSRC/symsrc and CODEPATCH/codepatch pairs need one line each.
  #
  # Route B / this fork's own identifiers:
  - sbrbptch # the Route B container extension, .sbrbptch
  - codepatch # fixture marker string
  - runmain # the _runMain seam
  - handpack # probes/device_handpack.sh, a hand-written replacement body
  - psdk # the platform SDK zip, PSDK_ZIP in the mint
  - appbin # probe variable, the app binary under test
  - evid # probe variable, the evidence directory for a release
  # Apple / Unix / toolchain vocabulary:
  - apfs
  - ioreg
  - idevicedebug # libimobiledevice, beside idevicesyslog above
  - tcgetattr
  - chardev
  - dsym
  - duuid # the dSYM's UUID
  - iuuid # the image UUID it must match
  - stur # Arm64 Store Register unscaled, beside ldur/orri
  - werror # -Werror
  - wunused # -Wunused-function
  - pathspec # git
  - diffstat
  - regen
  - rapidjson
