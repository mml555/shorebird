<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Self-hosted Shorebird code-push control plane — apps, releases, patches, rollouts, analytics, and team management.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐦%3C/text%3E%3C/svg%3E">
<title>Shorebird Console</title>
<style>
/* Monochrome two-tone — ink + paper with a grayscale ramp. There is no hue:
   the "accent" is ink itself, and state is conveyed by FILL/WEIGHT, not color
   (active = solid ink pill, inactive = light chip). */
:root{
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Cascadia Code",Consolas,monospace;
  --bg:#f4f4f5; --panel:#ffffff; --panel-2:#f0f0f1; --border:#dedede;
  --text:#0d0d0d; --muted:#6b6b6e; --faint:#a1a1a5;
  --accent:#141414; --accent-2:#000000; --accent-fg:#ffffff; --accent-soft:#e9e9ea;
  --ok:#141414; --ok-soft:#e6e6e7; --warn:#5a5a5e; --warn-soft:#e6e6e7;
  --danger:#141414; --danger-bg:#e9e9ea;
  --chip:#eeeeef; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
  --radius:12px; --bar1:#141414; --bar2:#9a9a9e;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a0a0b; --panel:#151516; --panel-2:#1d1d1f; --border:#2b2b2e;
    --text:#f2f2f3; --muted:#9a9a9e; --faint:#67676b;
    --accent:#f2f2f3; --accent-2:#ffffff; --accent-fg:#0a0a0b; --accent-soft:#242427;
    --ok:#f2f2f3; --ok-soft:#242427; --warn:#a6a6aa; --warn-soft:#242427;
    --danger:#f2f2f3; --danger-bg:#242427;
    --chip:#202023; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.32);
    --radius:12px; --bar1:#f2f2f3; --bar2:#77777b;
  }
}
:root[data-theme="light"]{
  --bg:#f4f4f5; --panel:#ffffff; --panel-2:#f0f0f1; --border:#dedede;
  --text:#0d0d0d; --muted:#6b6b6e; --faint:#a1a1a5;
  --accent:#141414; --accent-2:#000000; --accent-fg:#ffffff; --accent-soft:#e9e9ea;
  --ok:#141414; --ok-soft:#e6e6e7; --warn:#5a5a5e; --warn-soft:#e6e6e7;
  --danger:#141414; --danger-bg:#e9e9ea;
  --chip:#eeeeef; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
  --bar1:#141414; --bar2:#9a9a9e;
}
:root[data-theme="dark"]{
  --bg:#0a0a0b; --panel:#151516; --panel-2:#1d1d1f; --border:#2b2b2e;
  --text:#f2f2f3; --muted:#9a9a9e; --faint:#67676b;
  --accent:#f2f2f3; --accent-2:#ffffff; --accent-fg:#0a0a0b; --accent-soft:#242427;
  --ok:#f2f2f3; --ok-soft:#242427; --warn:#a6a6aa; --warn-soft:#242427;
  --danger:#f2f2f3; --danger-bg:#242427;
  --chip:#202023; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.32);
  --bar1:#f2f2f3; --bar2:#77777b;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:14.5px/1.55 var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--accent-2)}
code{background:var(--accent-soft);color:var(--accent-2);padding:.1rem .38rem;border-radius:6px;font:12px/1.4 var(--mono)}
button{font:inherit;font-weight:500;cursor:pointer;padding:.44rem .85rem;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);transition:background .12s,border-color .12s,box-shadow .12s}
button:hover{border-color:var(--accent);background:var(--panel-2)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:var(--shadow)}
button.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
button.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--border))}
button.danger:hover{background:var(--danger-bg);border-color:var(--danger)}
button.sm{padding:.26rem .6rem;font-size:12.5px;border-radius:7px}
input,select{font:inherit;padding:.46rem .6rem;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text)}
input::placeholder{color:var(--faint)}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}
label{font:600 10.5px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.28rem}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--border);padding:.5rem .6rem;text-align:left;white-space:nowrap}
th{font:600 10.5px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
tbody tr:hover{background:var(--panel-2)}
.wrap{max-width:1180px;margin:0 auto;padding:1rem}

/* top bar */
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.top{display:flex;flex-wrap:wrap;align-items:end;gap:.7rem;max-width:1180px;margin:0 auto;padding:.7rem 1rem}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:16px;margin-right:.4rem}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
.field{display:flex;flex-direction:column}
.field.grow{flex:1;min-width:150px}
.status{display:flex;align-items:center;gap:.4rem;font-size:12px;color:var(--muted);margin-left:auto}
.status .led{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.ok .led{background:var(--ok)} .status.err .led{background:var(--danger)} .status.busy .led{background:var(--warn)}

/* layout */
.grid{display:grid;grid-template-columns:300px 1fr;gap:1rem;margin-top:1rem;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel .hd{padding:.7rem 1rem;border-bottom:1px solid var(--border);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:.5rem;letter-spacing:-.01em;min-height:44px}
.panel .bd{padding:1rem 1.1rem}
.section{margin-top:1.25rem}
.section h2{font:600 11px/1.4 var(--mono);margin:0 0 .55rem;color:var(--accent);text-transform:uppercase;letter-spacing:.13em}

/* app list */
.applist{list-style:none;margin:0;padding:0}
.applist li{padding:.55rem .9rem;border-bottom:1px solid var(--border);cursor:pointer}
.applist li:last-child{border-bottom:none}
.applist li:hover{background:var(--panel-2)}
.applist li.active{background:var(--accent-soft);border-left:3px solid var(--accent);padding-left:calc(.9rem - 3px)}
.applist .name{font-weight:600}
.applist .meta{font:11px/1.4 var(--mono);color:var(--muted);margin-top:.1rem}

.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .5rem;border-radius:999px;font:600 11px/1.4 var(--mono);letter-spacing:.02em;background:var(--chip);color:var(--muted);border:1px solid var(--border)}
.pill.active{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.pill.draft{background:var(--chip);color:var(--muted);border-color:var(--border)}
.pill.acc{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end}
.card{border:1px solid var(--border);border-radius:10px;padding:.9rem;margin-bottom:.6rem;background:var(--panel-2)}
.card .title{font-weight:600;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.kv{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:.25rem}
.stat{display:inline-flex;flex-direction:column;gap:.15rem;padding:.6rem .85rem;border:1px solid var(--border);border-radius:10px;background:var(--panel-2);min-width:104px}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font:600 10px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.stats{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
details{border:1px solid var(--border);border-radius:9px;margin-bottom:.55rem;background:var(--panel-2);overflow:hidden}
details>summary{padding:.55rem .8rem;cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"\25B8";color:var(--muted);font-size:11px}
details[open]>summary::before{content:"\25BE"}
details .inner{padding:.7rem .8rem;border-top:1px solid var(--border)}
.toast{position:fixed;bottom:1rem;right:1rem;z-index:50;display:flex;flex-direction:column;gap:.5rem}
.toast div{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:.6rem .8rem;box-shadow:var(--shadow);max-width:340px;font-size:13px;animation:in .15s ease}
.toast div.ok{border-left-color:var(--ok)} .toast div.err{border-left-color:var(--danger)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.rollout{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:.5rem}
.rollout input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.rollout .pct{width:3.8rem;text-align:center}
.empty{color:var(--muted);padding:.6rem 0;font-style:italic}
.scroll{overflow-x:auto}
.err-box{color:var(--danger);background:var(--danger-bg);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);border-radius:8px;padding:.6rem .8rem;font-size:13px}
svg text{fill:var(--muted);font-size:11px}
hr{border:none;border-top:1px solid var(--border);margin:.9rem 0}
.legend{display:flex;gap:1rem;font-size:12px;color:var(--muted);margin:.3rem 0}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
.ana-h{font:600 11px/1.4 var(--mono);margin:0 0 .6rem;color:var(--accent);text-transform:uppercase;letter-spacing:.13em}
.ana-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem}
.ana-card{margin:0}
.ana-card .bd{padding:.9rem 1rem}
.stats{margin-bottom:.8rem}

/* ---- app shell + connect gate ---- */
.logo{line-height:1}
.gate{min-height:100vh;display:grid;place-items:center;padding:1.5rem;
  background:radial-gradient(1100px 560px at 50% -12%,var(--accent-soft),transparent 62%),var(--bg)}
.gate-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--shadow);padding:1.7rem 1.5rem;display:flex;flex-direction:column;gap:.85rem}
.gate-brand{display:flex;align-items:center;gap:.75rem;margin-bottom:.4rem}
.gate-brand .logo{font-size:2rem}
.gate-brand .gt{font-weight:700;font-size:1.2rem;letter-spacing:-.015em}
.gate-brand .gs{font:10.5px/1.4 var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:.15rem}
.block{width:100%;justify-content:center;display:inline-flex;align-items:center}
.gate-foot{display:flex;align-items:center;justify-content:space-between;margin-top:.1rem}

.shell{display:grid;grid-template-columns:284px 1fr;min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--border)}
.side-top{padding:.95rem 1rem;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:.55rem}
.side-top .brand{font-weight:700;font-size:1.08rem;display:flex;align-items:center;gap:.5rem}
.side-top .logo{font-size:1.25rem}
.conn{display:flex;align-items:center;gap:.42rem;font:11px/1.4 var(--mono);color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-actions{display:flex;gap:.4rem}
.side-scroll{flex:1;overflow-y:auto;padding:.75rem}
.nav-h{font:600 10.5px/1.4 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent);
  padding:.35rem .55rem .5rem;display:flex;align-items:center;justify-content:space-between}
.nav-team{margin-top:1rem;border-top:1px solid var(--border);padding-top:.85rem}
.side-filter{width:100%;margin:0 0 .55rem;padding:.42rem .55rem;font-size:12.5px}
.side-scroll .applist li{border-bottom:none;border-radius:9px;margin-bottom:.12rem;padding:.5rem .55rem}
.side-scroll .applist li:hover{background:var(--panel-2)}
.side-scroll .applist li.active{padding-left:calc(.55rem - 3px)}
.create{border:1px solid var(--border);border-radius:10px;margin-top:.55rem;background:var(--panel-2)}
.create>summary{padding:.5rem .7rem;cursor:pointer;font:600 12.5px/1.4 var(--font);list-style:none;color:var(--accent-2)}
.create>summary::-webkit-details-marker{display:none}
.create-bd{padding:.65rem .7rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.55rem}
.main{min-width:0;padding:1.5rem clamp(1rem,3vw,2.25rem)}
#detail{max-width:1200px;margin-inline:auto}
.led.ok{background:var(--ok)}

/* overview / welcome */
.hero{text-align:center;padding:2.4rem 1rem 1.6rem;color:var(--muted);max-width:600px;margin-inline:auto}
.hero .logo{font-size:2.4rem;display:block;margin-bottom:.5rem;opacity:.9}
.hero h1{font-size:1.4rem;color:var(--text);margin:.2rem 0 .4rem;letter-spacing:-.015em}
.ovstats{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:1.2rem}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto}
  .side-scroll{max-height:none}
  .main{padding:1rem}
}

/* quick-start / onboarding + copyable code + loading skeletons */
.qs{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:1.15rem 1.25rem;max-width:640px;margin:1.4rem auto 0;text-align:left}
.qs h3{margin:0 0 .2rem;font-size:1.02rem;letter-spacing:-.01em}
.qs p{margin:.15rem 0 .7rem;color:var(--muted);font-size:13px}
.codeblock{position:relative;background:#141414;color:#e8e8e8;border-radius:10px;
  padding:.85rem .95rem;font:12px/1.65 var(--mono);overflow-x:auto;white-space:pre;border:1px solid #2b2b2b}
.copybtn{position:absolute;top:.5rem;right:.5rem;padding:.15rem .5rem;font:600 10px/1.4 var(--mono);
  letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.08);color:#cfe8ea;
  border:1px solid rgba(255,255,255,.15);border-radius:6px;cursor:pointer}
.copybtn:hover{background:rgba(255,255,255,.16);border-color:var(--accent)}
@keyframes shimmer{0%{background-position:-450px 0}100%{background-position:450px 0}}
.skeleton{border-radius:8px;height:14px;margin:.55rem 0;
  background:linear-gradient(90deg,var(--panel-2) 25%,var(--chip) 37%,var(--panel-2) 63%);
  background-size:900px 100%;animation:shimmer 1.3s infinite linear}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}.modal-backdrop,.toast div{animation:none}}

/* patch deployment state + rollout bars */
.deploys{display:flex;flex-direction:column;gap:.4rem;margin:.55rem 0}
.deploy{display:flex;align-items:center;gap:.6rem;font-size:12.5px}
.deploy .dch{font:600 12px/1 var(--mono);min-width:66px;color:var(--text)}
.rbar{position:relative;flex:1;max-width:170px;height:7px;border-radius:999px;background:var(--chip);overflow:hidden}
.rfill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
.rpct{font:600 11px/1 var(--mono);color:var(--muted);min-width:36px;text-align:right}

/* confirm modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,12,15,.55);display:grid;place-items:center;
  z-index:60;animation:in .12s ease}
.modal{width:min(430px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:1.25rem 1.35rem}
.modal h3{margin:0 0 .45rem;font-size:1.08rem;letter-spacing:-.01em}
.modal p{margin:0 0 1.1rem;color:var(--muted);font-size:13.5px;line-height:1.55}
.modal .actions{display:flex;justify-content:flex-end;gap:.6rem}
.applist li:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:9px}
</style>
</head>
<body>

<!-- Connect gate (shown until connected) -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-brand"><span class="logo" aria-hidden="true">🐦</span>
      <div><div class="gt">Shorebird Console</div>
        <div class="gs">Self-hosted code-push control plane</div></div>
    </div>
    <div class="field"><label for="base">Server base URL</label>
      <input id="base" placeholder="(same origin)" autocomplete="off"></div>
    <div class="field"><label for="key">API key</label>
      <input id="key" type="password" placeholder="sb_api_… or bootstrap key" autocomplete="off"></div>
    <button class="primary block" id="connectBtn">Connect</button>
    <div id="connError"></div>
    <div class="gate-foot">
      <div class="status" id="status"><span class="led"></span><span id="statusText">Not connected</span></div>
      <button id="themeBtn" class="sm" title="Toggle theme">Theme</button>
    </div>
  </div>
</div>

<!-- App shell (revealed on connect) -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="side-top">
      <div class="brand"><span class="logo" aria-hidden="true">🐦</span> Shorebird</div>
      <div class="conn"><span class="led ok"></span><span id="connHost">connected</span></div>
      <div class="side-actions">
        <button class="sm" id="themeBtn2" title="Toggle theme">Theme</button>
        <button class="sm" id="disconnectBtn">Disconnect</button>
      </div>
    </div>
    <div class="side-scroll">
      <div class="nav-h">Apps <span class="pill" id="appCount">0</span></div>
      <input id="appFilter" class="side-filter" placeholder="Filter apps… (/)" autocomplete="off" aria-label="Filter apps" hidden>
      <ul class="applist" id="appList" role="list"></ul>
      <div class="empty" id="appsEmpty">No apps yet — create one below.</div>
      <details class="create">
        <summary>+ New app</summary>
        <div class="create-bd">
          <div class="field"><label for="orgSelect">Organization</label><select id="orgSelect"></select></div>
          <div class="field"><label for="newAppName">Display name</label><input id="newAppName" placeholder="My App"></div>
          <button class="primary sm block" id="createAppBtn" disabled>Create app</button>
        </div>
      </details>
      <div class="nav-h nav-team">Team</div>
      <ul class="applist" id="orgList"></ul>
      <div class="empty" id="orgsEmpty">—</div>
    </div>
  </aside>
  <main class="main"><div id="detail"></div></main>
</div>

<div class="toast" id="toast" aria-live="polite" aria-atomic="false"></div>

<script>
"use strict";
(function(){
  const $ = (id)=>document.getElementById(id);
  const LS = {base:"sb_console_base", key:"sb_console_key", theme:"sb_console_theme"};

  const state = {
    base: localStorage.getItem(LS.base) || "",
    key: localStorage.getItem(LS.key) || "",
    orgs: [],
    apps: [],
    selected: null,    // app object
    selectedOrg: null, // org id (team view)
    selectedOrgRole: null,
    me: null,          // current user {user_id,email}
    appFilter: "",     // sidebar app filter text
  };

  const ROLES = ["owner","admin","appManager","developer","viewer"];

  // ---------- utils ----------
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,c=>(
      {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }
  function num(n){ return (n==null||n==="")?"—":Number(n).toLocaleString(); }
  function relTime(iso){
    if(!iso) return "";
    const t=Date.parse(String(iso));
    if(isNaN(t)) return String(iso).slice(0,19).replace("T"," ");
    const s=Math.floor((Date.now()-t)/1000);
    if(s<0) return "just now";
    if(s<60) return "just now";
    const m=Math.floor(s/60); if(m<60) return m+"m ago";
    const h=Math.floor(m/60); if(h<24) return h+"h ago";
    const d=Math.floor(h/24); if(d<30) return d+"d ago";
    return new Date(t).toISOString().slice(0,10);
  }
  function toast(msg, kind){
    const el=document.createElement("div");
    el.className=kind||"";
    el.textContent=msg;
    $("toast").appendChild(el);
    setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .3s";setTimeout(()=>el.remove(),300);}, 3800);
  }
  function setStatus(cls, text){
    const s=$("status"); s.className="status "+(cls||"");
    $("statusText").textContent=text;
  }

  // ---------- API ----------
  function apiUrl(path){
    let base=(state.base||"").replace(/\/+$/,"");
    return base + path;
  }
  async function api(method, path, opts){
    opts=opts||{};
    const headers={};
    if(state.key) headers["Authorization"]="Bearer "+state.key;
    let body;
    if(opts.json!==undefined){ headers["Content-Type"]="application/json"; body=JSON.stringify(opts.json); }
    const res=await fetch(apiUrl(path), {method, headers, body});
    const ct=res.headers.get("content-type")||"";
    let data=null, text=null;
    if(ct.includes("application/json")){ try{ data=await res.json(); }catch(e){ data=null; } }
    else { try{ text=await res.text(); }catch(e){} }
    if(!res.ok){
      const err=new Error((data&&(data.message||data.code))||text||("HTTP "+res.status));
      err.status=res.status; err.data=data;
      throw err;
    }
    return data!==null?data:text;
  }
  // Returns {ok, data, status} instead of throwing — for optional endpoints.
  async function tryApi(method, path, opts){
    try{ return {ok:true, data:await api(method,path,opts)}; }
    catch(e){ return {ok:false, status:e.status, error:e}; }
  }

  // ---------- inline SVG bar chart ----------
  // series: [{key,label,color}], rows: [{label, [key]:value}]
  function barChart(rows, series){
    if(!rows||!rows.length) return '<div class="empty">No data.</div>';
    const W=Math.max(320, rows.length*Math.max(60, series.length*26)+60);
    const H=200, padL=42, padB=34, padT=12, padR=8;
    const plotW=W-padL-padR, plotH=H-padT-padB;
    let max=0;
    rows.forEach(r=>series.forEach(s=>{max=Math.max(max, Number(r[s.key])||0);}));
    if(max<=0) max=1;
    const groupW=plotW/rows.length;
    const barW=Math.min(28,(groupW-8)/series.length);
    let bars="", axis="", labels="";
    // y gridlines (4)
    for(let i=0;i<=4;i++){
      const v=Math.round(max*i/4);
      const y=padT+plotH-(plotH*i/4);
      axis+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
      axis+=`<text x="${padL-6}" y="${y+3}" text-anchor="end">${v}</text>`;
    }
    rows.forEach((r,ri)=>{
      const gx=padL+ri*groupW;
      series.forEach((s,si)=>{
        const val=Number(r[s.key])||0;
        const h=plotH*(val/max);
        const x=gx+(groupW-barW*series.length)/2+si*barW;
        const y=padT+plotH-h;
        bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(barW-3).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${s.color}"><title>${esc(r.label)} · ${esc(s.label)}: ${val}</title></rect>`;
      });
      labels+=`<text x="${(gx+groupW/2).toFixed(1)}" y="${H-padB+16}" text-anchor="middle">${esc(String(r.label).slice(0,10))}</text>`;
    });
    const leg=series.map(s=>`<span><i class="swatch" style="background:${s.color}"></i>${esc(s.label)}</span>`).join("");
    return `<div class="legend">${leg}</div><div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto" role="img">${axis}${bars}${labels}</svg></div>`;
  }

  // ---------- render: app list ----------
  // Shared keyboard handler for sidebar lists: Enter/Space activates,
  // ArrowUp/Down moves focus between items.
  function listKeydown(e, onActivate){
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onActivate(); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); const n=e.currentTarget.nextElementSibling; if(n&&n.matches("li")) n.focus(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); const p=e.currentTarget.previousElementSibling; if(p&&p.matches("li")) p.focus(); }
  }

  // ---------- connect ----------
  async function connect(){

  // Promise-based confirm modal (replaces window.confirm). body may contain HTML.
  function confirmModal(opts){
    return new Promise(resolve=>{
      const bd=document.createElement("div");
      bd.className="modal-backdrop";
      bd.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(opts.title||"Confirm")}">`+
        `<h3>${esc(opts.title||"Confirm")}</h3><p>${opts.body||""}</p>`+
        `<div class="actions"><button class="cancel">Cancel</button>`+
        `<button class="${opts.danger?"danger":"primary"} ok">${esc(opts.confirm||"Confirm")}</button></div></div>`;
      document.body.appendChild(bd);
      const prevFocus=document.activeElement;
      const cancel=bd.querySelector(".cancel"), ok=bd.querySelector(".ok");
      const done=(v)=>{
        bd.remove(); document.removeEventListener("keydown",onKey);
        try{ if(prevFocus&&prevFocus.focus) prevFocus.focus(); }catch(e){}
        resolve(v);
      };
      const onKey=(e)=>{
        if(e.key==="Escape"){ e.preventDefault(); done(false); }
        else if(e.key==="Enter"){ e.preventDefault(); done(true); }
        else if(e.key==="Tab"){ e.preventDefault(); (document.activeElement===ok?cancel:ok).focus(); } // trap
      };
      document.addEventListener("keydown",onKey);
      cancel.onclick=()=>done(false);
      ok.onclick=()=>done(true);
      bd.addEventListener("click",e=>{ if(e.target===bd) done(false); });
      ok.focus();
    });
  }

  function renderDetail(app, releases, channels, metrics, relRes, mRes){
    let h="";
    // header panel
    h+=`<div class="panel"><div class="hd"><span>${esc(app.display_name||app.app_id)}</span>`+
       `<button class="pill copy-id" data-copytext="${esc(app.app_id)}" title="Copy app id">${esc(app.app_id)} ⧉</button></div><div class="bd">`;
    h+=`<div class="kv"><span>Latest release: <b>${esc(app.latest_release_version||"—")}</b></span>`+
       `<span>Latest patch: <b>${app.latest_patch_number==null?"—":esc(app.latest_patch_number)}</b></span>`+
       `<span>Channels: <b>${channels.length?channels.map(c=>esc(c.name)).join(", "):"—"}</b></span></div>`;
    h+=`</div></div>`;

    // metrics
    h+=`<div class="section"><div class="panel"><div class="hd">Metrics</div><div class="bd">`;
    if(!mRes.ok){
      h+=`<div class="empty">Metrics unavailable (HTTP ${mRes.status||"?"}).</div>`;
    } else {
      const patches=(metrics&&metrics.patches)||[];
      h+=`<div class="stats">`+
         `<div class="stat"><span class="n">${num(metrics&&metrics.total_events)}</span><span class="l">Total events</span></div>`+
         `<div class="stat"><span class="n">${num(metrics&&metrics.unique_clients)}</span><span class="l">Unique clients</span></div>`+
         `<div class="stat"><span class="n">${patches.length}</span><span class="l">Patches w/ data</span></div>`+
         `</div>`;
      const ebt=(metrics&&metrics.events_by_type)||{};
      const ebtKeys=Object.keys(ebt);
      if(ebtKeys.length){
        h+=`<div class="chips" style="margin-bottom:.6rem">`+
           ebtKeys.map(k=>`<span class="pill">${esc(k)}: ${num(ebt[k])}</span>`).join("")+`</div>`;
      }
      if(patches.length){
        const rows=patches.map(p=>({label:"#"+p.patch_number, downloads:p.downloads, installs:p.installs, unique_clients:p.unique_clients}));
        h+=barChart(rows,[
          {key:"downloads",label:"Downloads",color:"var(--bar1)"},
          {key:"installs",label:"Installs",color:"var(--bar2)"},
        ]);
        h+=`<div class="scroll"><table><thead><tr><th>Patch</th><th>Downloads</th><th>Installs</th><th>Unique clients</th></tr></thead><tbody>`;
        patches.forEach(p=>{ h+=`<tr><td>#${esc(p.patch_number)}</td><td>${num(p.downloads)}</td><td>${num(p.installs)}</td><td>${num(p.unique_clients)}</td></tr>`; });
        h+=`</tbody></table></div>`;
      } else {
        h+=`<div class="empty">No patch events yet.</div>`;
      }
    }
    h+=`</div></div></div>`;

    // analytics placeholder (filled async)
    h+=`<div class="section" id="analyticsWrap"></div>`;

    // releases + patches
    h+=`<div class="section"><div class="panel"><div class="hd">Releases <span class="pill">${releases.length}</span></div><div class="bd">`;
    if(!relRes.ok){
      h+=`<div class="empty">Releases unavailable (HTTP ${relRes.status||"?"}).</div>`;
    } else if(!releases.length){
      h+=`<div class="empty" style="margin-bottom:.5rem">No releases yet — publish one from your app directory:</div>`+
         codeBlock("shorebird release android");
    } else {
      // newest first
      const rs=[...releases].reverse();
      rs.forEach(r=>{
        const ps=r.platform_statuses||{};
        const pchips=Object.keys(ps).length
          ? Object.keys(ps).map(pl=>`<span class="chips" style="display:inline-flex">${esc(pl)}&nbsp;${statusPill(ps[pl])}</span>`).join("&nbsp;&nbsp;")
          : '<span class="muted">no platform status</span>';
        h+=`<details data-release="${esc(r.id)}"><summary>`+
           `<b>${esc(r.version)}</b>`+
           (r.flutter_version?` <span class="pill">Flutter ${esc(r.flutter_version)}</span>`:"")+
           ` &nbsp; ${pchips}</summary>`+
           `<div class="inner">`+
           (r.flutter_revision?`<div class="kv"><span>Flutter rev: <code>${esc(String(r.flutter_revision).slice(0,12))}</code></span>`+
             (r.created_at?`<span title="${esc(String(r.created_at))}">Created ${esc(relTime(r.created_at))}</span>`:"")+`</div>`:"")+
           `<div class="patches" data-release="${esc(r.id)}"><div class="empty">Expand to load patches…</div></div>`+
           `</div></details>`;
      });
    }
    h+=`</div></div></div>`;

    // channels + collaborators admin
    h+=`<div class="section"><div class="panel"><div class="hd">Channels</div><div class="bd">`;
    if(channels.length){
      h+=`<div class="chips">`+channels.map(c=>`<span class="pill">${esc(c.name)} <span class="muted">#${esc(c.id)}</span></span>`).join("")+`</div>`;
    } else {
      h+=`<div class="empty">No channels (rollout defaults to <code>stable</code>).</div>`;
    }
    h+=`</div></div></div>`;

    // Collaborators panel is appended by loadCollaborators() (list + add + remove).
    return h;
  }

  function wireDetail(appId, channels){
    // lazy-load patches when a release <details> opens
    document.querySelectorAll('details[data-release]').forEach(det=>{
      det.addEventListener("toggle", ()=>{
        if(det.open && !det.dataset.loaded){
          det.dataset.loaded="1";
          loadPatches(appId, det.dataset.release, channels);
        }
      });
    });
  }

  async function loadPatches(appId, releaseId, channels){
    const box=document.querySelector('.patches[data-release="'+CSS.escape(releaseId)+'"]');
    if(!box) return;
    box.innerHTML='<div class="empty">Loading patches…</div>';
    const res=await tryApi("GET","/api/v1/apps/"+encodeURIComponent(appId)+"/releases/"+encodeURIComponent(releaseId)+"/patches");
    if(!res.ok){
      if(res.status===404){ box.innerHTML='<div class="empty">No patches for this release.</div>'; }
      else { box.innerHTML='<div class="err-box">Patches unavailable (HTTP '+(res.status||"?")+').</div>'; }
      return;
    }
    const patches=(res.data&&res.data.patches)||[];
    if(!patches.length){ box.innerHTML='<div class="empty">No patches for this release.</div>'; return; }
    const opts=channelOptions(channels);
    let h="";
    // newest patch first — a timeline of deployment state
    patches.slice().reverse().forEach(p=>{
      const pid=p.id;
      const deploys=p.deployments||[];
      const active=deploys.find(d=>d.status==="active" && !d.rolled_back);
      const rolledBack=p.is_rolled_back || deploys.some(d=>d.rolled_back);
      const curPct=active?active.rollout:100;
      // headline state pill
      let state;
      if(rolledBack) state=`<span class="pill draft">rolled back</span>`;
      else if(active) state=`<span class="pill active">live · ${esc(active.channel)} · ${active.rollout}%</span>`;
      else if(deploys.length) state=`<span class="pill">withdrawn</span>`;
      else state=statusPill(p.status||"ready");
      h+=`<div class="card"><div class="title">Patch #${esc(p.number)} ${state}</div>`;
      // per-channel deployment rows with rollout bars
      if(deploys.length){
        h+=`<div class="deploys">`;
        deploys.forEach(d=>{
          const label=d.rolled_back?"rolled back":d.status;
          const cls=d.rolled_back?"draft":(d.status==="active"?"active":"");
          h+=`<div class="deploy"><span class="dch">${esc(d.channel)}</span>`+
             `<span class="pill ${cls}">${esc(label)}</span>`+rolloutBar(d.rollout)+`</div>`;
        });
        h+=`</div>`;
      }
      // rollout control (slider pre-set to the current active rollout)
      h+=`<div class="rollout" data-patch="${esc(pid)}">`+
         `<label style="margin:0">Channel</label><select class="ch">${opts}</select>`+
         `<input type="range" class="rg" min="0" max="100" value="${curPct}">`+
         `<input type="number" class="pct" min="0" max="100" value="${curPct}"> %`+
         `<button class="sm primary act-rollout">Set rollout</button>`+
         `</div>`;
      h+=`<div class="row" style="margin-top:.5rem">`+
         `<button class="sm danger act-withdraw" data-rollback="false">Withdraw</button>`+
         `<button class="sm danger act-withdraw" data-rollback="true">Withdraw + rollback</button>`+
         `</div>`;
      h+=`</div>`;
    });
    box.innerHTML=h;
    // reload this release's patches after a state change (inline refresh)
    const reload=()=>loadPatches(appId, releaseId, channels);
    // wire per-patch controls
    box.querySelectorAll('.rollout').forEach(rc=>{
      const pid=rc.dataset.patch;
      const rg=rc.querySelector('.rg'), pct=rc.querySelector('.pct');
      rg.addEventListener('input',()=>{pct.value=rg.value;});
      pct.addEventListener('input',()=>{let v=Math.max(0,Math.min(100,Number(pct.value)||0));rg.value=v;});
      rc.querySelector('.act-rollout').onclick=()=>{
        const ch=rc.querySelector('.ch').value;
        const percent=Math.max(0,Math.min(100,Number(pct.value)||0));
        doRollout(appId, pid, ch, percent, reload);
      };
    });
    box.querySelectorAll('.card').forEach(card=>{
      const rc=card.querySelector('.rollout');
      const pid=rc?rc.dataset.patch:null;
      card.querySelectorAll('.act-withdraw').forEach(btn=>{
        btn.onclick=()=>{
          const rollback=btn.dataset.rollback==="true";
          const ch=rc.querySelector('.ch').value;
          doWithdraw(appId, pid, ch, rollback, reload);
        };
      });
    });
  }

  async function doRollout(appId, patchId, channel, percent, reload){
    const q="?channel="+encodeURIComponent(channel)+"&percent="+encodeURIComponent(percent);
    const res=await tryApi("POST","/admin/apps/"+encodeURIComponent(appId)+"/patches/"+encodeURIComponent(patchId)+"/rollout"+q);
    if(res.ok){ toast("Rollout set to "+percent+"% on "+channel+".","ok"); if(reload) reload(); }
    else toast("Rollout failed: "+(res.error?res.error.message:res.status),"err");
  }

  async function doWithdraw(appId, patchId, channel, rollback, reload){
    const ok=await confirmModal({
      title: rollback?"Withdraw + roll back?":"Withdraw patch?",
      body: rollback
        ? `Withdraws the patch <b>and rolls back live devices</b> on <b>${esc(channel)}</b>. Installed apps revert to the release code on next launch.`
        : `Stops serving this patch to new checks on <b>${esc(channel)}</b>. Devices that already installed it keep running it.`,
      confirm: rollback?"Withdraw + rollback":"Withdraw",
      danger:true,
    });
    if(!ok) return;
    const q="?channel="+encodeURIComponent(channel)+"&rollback="+(rollback?"true":"false");
    const res=await tryApi("POST","/admin/apps/"+encodeURIComponent(appId)+"/patches/"+encodeURIComponent(patchId)+"/withdraw"+q);
    if(res.ok){ toast("Patch withdrawn"+(rollback?" with rollback":"")+" on "+channel+".","ok"); if(reload) reload(); }
    else toast("Withdraw failed: "+(res.error?res.error.message:res.status),"err");
  }

  // ---------- analytics helpers ----------
  function pad2(n){ return String(n).padStart(2,"0"); }
  // Categorical hue order for multi-series charts (fixed order, never cycled
  // beyond the list — extra series are dropped rather than repainted).
  const CAT=["var(--accent)","var(--ok)","var(--warn)","var(--danger)","var(--bar2)"];

  // Trims an ISO-ish period string to just the calendar date for axis labels.
  function shortPeriod(v){ return String(v==null?"":v).slice(0,10); }

  // Inline SVG multi-series line/area chart.
  //   datasets: [{label, color, values:[{label, value}]}]  (x shared by index)
  //   opts: {area, max, fmtY, unit}
  function lineChart(datasets, opts){
    opts=opts||{};
    const clean=(datasets||[]).filter(d=>d.values && d.values.length);
    if(!clean.length) return '<div class="empty">No data.</div>';
    const n=Math.max.apply(null, clean.map(d=>d.values.length));
    const W=Math.max(320, n*40+64), H=200, padL=46, padR=12, padT=12, padB=32;
    const plotW=W-padL-padR, plotH=H-padT-padB;
    let max=opts.max!=null?opts.max:0;
    if(opts.max==null){ clean.forEach(d=>d.values.forEach(p=>{max=Math.max(max, Number(p.value)||0);})); }
    if(max<=0) max=1;
    const fmtY=opts.fmtY||(v=>num(Math.round(v)));
    const xLabels=clean[0].values.map(p=>p.label);
    const X=i=> n<=1 ? padL+plotW/2 : padL + plotW*i/(n-1);
    const Y=v=> padT+plotH - plotH*(Math.min(Number(v)||0,max)/max);
    let axis="";
    for(let i=0;i<=4;i++){
      const val=max*i/4, y=padT+plotH-plotH*i/4;
      axis+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
      axis+=`<text x="${padL-6}" y="${y+3}" text-anchor="end">${esc(fmtY(val))}</text>`;
    }
    let xax="";
    const step=Math.max(1, Math.ceil(n/6));
    xLabels.forEach((lb,i)=>{ if(i%step===0 || i===n-1){
      xax+=`<text x="${X(i).toFixed(1)}" y="${H-padB+16}" text-anchor="middle">${esc(shortPeriod(lb))}</text>`;
    }});
    let paths="";
    clean.forEach(d=>{
      const line=d.values.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.value).toFixed(1)).join(" ");
      if(opts.area && clean.length===1){
        const base=(padT+plotH).toFixed(1);
        const area="M"+X(0).toFixed(1)+" "+base+" "+
          d.values.map((p,i)=>"L"+X(i).toFixed(1)+" "+Y(p.value).toFixed(1)).join(" ")+
          " L"+X(d.values.length-1).toFixed(1)+" "+base+" Z";
        paths+=`<path d="${area}" fill="${d.color}" opacity="0.14"/>`;
      }
      paths+=`<path d="${line}" fill="none" stroke="${d.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      d.values.forEach((p,i)=>{
        paths+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="2.6" fill="${d.color}"><title>${esc(shortPeriod(p.label))}: ${esc(fmtY(p.value))}</title></circle>`;
      });
    });
    const leg=clean.length>1
      ? `<div class="legend">`+clean.map(d=>`<span><i class="swatch" style="background:${d.color}"></i>${esc(d.label)}</span>`).join("")+`</div>`
      : "";
    return leg+`<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto" role="img">${axis}${xax}${paths}</svg></div>`;
  }

  // Horizontal bar chart. rows: [{label, value, pct}] (pct 0..1 optional).
  function hbarChart(rows, opts){
    opts=opts||{};
    if(!rows||!rows.length) return '<div class="empty">No data.</div>';
    const rowH=26, padT=6, padB=6, labelW=118, W=560;
    const H=padT+padB+rows.length*rowH;
    const barMax=W-labelW-72;
    let max=0; rows.forEach(r=>max=Math.max(max, Number(r.value)||0)); if(max<=0) max=1;
    const color=opts.color||"var(--bar1)";
    let h="";
    rows.forEach((r,i)=>{
      const y=padT+i*rowH, val=Number(r.value)||0, bw=barMax*(val/max);
      const rt=r.pct!=null ? (r.pct*100).toFixed(1)+"%" : num(val);
      h+=`<text x="0" y="${y+rowH/2+4}">${esc(String(r.label).slice(0,18))}</text>`;
      h+=`<rect x="${labelW}" y="${y+4}" width="${Math.max(2,bw).toFixed(1)}" height="${rowH-10}" rx="3" fill="${color}"><title>${esc(r.label)}: ${num(val)}${r.pct!=null?" ("+(r.pct*100).toFixed(1)+"%)":""}</title></rect>`;
      h+=`<text x="${W-2}" y="${y+rowH/2+4}" text-anchor="end" style="fill:var(--text)">${esc(rt)}</text>`;
    });
    return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto" role="img">${h}</svg></div>`;
  }

  // 7x24 sequential heatmap. cells: [{day_of_week_utc(1-7,1=Sun),hour_utc,average_active_devices}].
  function heatmapGrid(cells, busiestDow, busiestHour){
    if(!cells||!cells.length) return '<div class="empty">No data.</div>';
    const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    let max=0; cells.forEach(c=>max=Math.max(max, Number(c.average_active_devices)||0));
    if(max<=0) return '<div class="empty">No activity data.</div>';
    const grid={};
    cells.forEach(c=>{ (grid[c.day_of_week_utc]=grid[c.day_of_week_utc]||{})[c.hour_utc]=Number(c.average_active_devices)||0; });
    const cell=16, gap=2, labelW=34, topH=16;
    const W=labelW+24*(cell+gap), H=topH+7*(cell+gap)+4;
    let h="";
    for(let hr=0;hr<24;hr+=3){
      h+=`<text x="${labelW+hr*(cell+gap)+cell/2}" y="${topH-4}" text-anchor="middle" style="font-size:9px">${hr}</text>`;
    }
    for(let d=1;d<=7;d++){
      const y=topH+(d-1)*(cell+gap);
      h+=`<text x="${labelW-6}" y="${y+cell/2+3}" text-anchor="end" style="font-size:9px">${days[d-1]}</text>`;
      for(let hr=0;hr<24;hr++){
        const v=(grid[d]&&grid[d][hr])||0;
        const x=labelW+hr*(cell+gap);
        const op=0.06+0.94*(v/max);
        const busy=(busiestDow===d && busiestHour===hr);
        h+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2" fill="var(--accent)" fill-opacity="${op.toFixed(3)}" stroke="${busy?'var(--text)':'var(--border)'}" stroke-width="${busy?1.5:0.5}"><title>${days[d-1]} ${pad2(hr)}:00 UTC — ${v.toFixed(2)} avg devices</title></rect>`;
      }
    }
    return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto" role="img">${h}</svg></div>`;
  }

  // 24-bar hour-of-day chart with recommended-window / busiest-hour highlights.
  function activeHoursChart(hourly, recStart, recLen, busiest){
    if(!hourly||!hourly.length) return '<div class="empty">No data.</div>';
    const W=Math.max(360, 24*22+50), H=200, padL=44, padR=10, padT=12, padB=28;
    const plotW=W-padL-padR, plotH=H-padT-padB;
    let max=0; hourly.forEach(x=>max=Math.max(max, Number(x.average_active_devices)||0)); if(max<=0) max=1;
    const bw=plotW/24;
    let axis="";
    for(let i=0;i<=4;i++){
      const val=max*i/4, y=padT+plotH-plotH*i/4;
      axis+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
      axis+=`<text x="${padL-6}" y="${y+3}" text-anchor="end">${(val).toFixed(max<4?1:0)}</text>`;
    }
    const recSet={};
    if(recStart!=null){ for(let o=0;o<(recLen||0);o++) recSet[(recStart+o)%24]=1; }
    let bars="", labels="";
    for(let hr=0;hr<24;hr++){
      const v=Number((hourly[hr]||{}).average_active_devices)||0;
      const hh=plotH*(v/max), x=padL+hr*bw, y=padT+plotH-hh;
      const isRec=recSet[hr]===1, isBusy=(busiest===hr);
      const color=isBusy?"var(--warn)":(isRec?"var(--ok)":"var(--bar2)");
      bars+=`<rect x="${(x+2).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="${color}"><title>${pad2(hr)}:00 UTC — ${v.toFixed(2)} avg${isRec?" · recommended release window":""}${isBusy?" · busiest hour":""}</title></rect>`;
      if(hr%3===0) labels+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-padB+15}" text-anchor="middle">${hr}</text>`;
    }
    const leg=`<div class="legend"><span><i class="swatch" style="background:var(--ok)"></i>Recommended window</span><span><i class="swatch" style="background:var(--warn)"></i>Busiest hour</span></div>`;
    return leg+`<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto" role="img">${axis}${bars}${labels}</svg></div>`;
  }

  // current vs previous stat comparison (previous may be null).
  function statCompare(cur, prev, curLabel, prevLabel){
    let h=`<div class="stats">`;
    h+=`<div class="stat"><span class="n">${num(cur)}</span><span class="l">${esc(curLabel||"Current")}</span></div>`;
    if(prev==null){
      h+=`<div class="stat"><span class="n">—</span><span class="l">${esc(prevLabel||"Previous")}</span></div>`;
    } else {
      h+=`<div class="stat"><span class="n">${num(prev)}</span><span class="l">${esc(prevLabel||"Previous")}</span></div>`;
      const c=Number(cur)||0, p=Number(prev)||0;
      let txt, col;
      if(p===0){ txt=c>0?("+"+num(c)):"—"; col=c>0?"var(--ok)":"var(--muted)"; }
      else { const dd=(c-p)/p*100; txt=(dd>=0?"+":"")+dd.toFixed(1)+"%"; col=dd>=0?"var(--ok)":"var(--danger)"; }
      h+=`<div class="stat"><span class="n" style="color:${col}">${esc(txt)}</span><span class="l">Change</span></div>`;
    }
    h+=`</div>`;
    return h;
  }

  // ---------- analytics (app-scoped, Bearer-authed) ----------
  function anaCard(title, body){
    return `<div class="panel ana-card"><div class="hd">${esc(title)}</div><div class="bd">${body}</div></div>`;
  }
  function anaNoData(res){
    if(res && !res.ok){
      if(res.status===404) return '<div class="empty">Not available.</div>';
      return '<div class="empty">Unavailable (HTTP '+((res&&res.status)||"?")+').</div>';
    }
    return '<div class="empty">No data.</div>';
  }

  async function loadAnalytics(appId){
    const wrap=$("analyticsWrap");
    if(!wrap) return;
    wrap.innerHTML=`<h2 class="ana-h">Analytics</h2><div class="empty">Loading analytics…</div>`;
    const base="/api/v1/apps/"+encodeURIComponent(appId)+"/analytics/";
    const [adopt,uu,vd,heat,ah,nd,inst,dl]=await Promise.all([
      tryApi("GET",base+"patch-adoption?granularity=day"),
      tryApi("GET",base+"unique-users?window_days=30&granularity=day"),
      tryApi("GET",base+"version-distribution?active_window_days=30"),
      tryApi("GET",base+"activity-heatmap?lookback_days=28"),
      tryApi("GET",base+"active-hours?lookback_days=28"),
      tryApi("GET",base+"new-devices?window_days=30"),
      tryApi("GET",base+"patch-installs?window_days=30&granularity=day"),
      tryApi("GET",base+"patch-downloads?window_days=30&granularity=day"),
    ]);
    // App may have changed while awaiting (user clicked another app).
    if(!state.selected || state.selected.app_id!==appId) return;
    let h="";
    h+=anaCard("Patch adoption", renderAdoption(adopt));
    h+=anaCard("Unique users (30d)", renderUniqueUsers(uu));
    h+=anaCard("Version distribution (30d active)", renderVersionDist(vd));
    h+=anaCard("Activity heatmap (28d, UTC)", renderHeatmap(heat));
    h+=anaCard("Active hours (28d, UTC)", renderActiveHours(ah));
    h+=anaCard("New devices (30d)", renderNewDevices(nd));
    h+=anaCard("Patch installs (30d)", renderPatchMetric(inst,"installs"));
    h+=anaCard("Patch downloads (30d)", renderPatchMetric(dl,"downloads"));
    wrap.innerHTML=`<h2 class="ana-h">Analytics</h2><div class="ana-grid">`+h+`</div>`;
  }

  // GetPatchAdoptionResponse: {release_version,is_latest,granularity,range,as_of,
  //   patches:[{patch_number,target_platforms,is_rolled_back,series:[{period,devices,target,adoption_pct}]}]}
  function renderAdoption(res){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    const patches=(d.patches||[]).slice(0, CAT.length); // cap series to the fixed hue set
    const datasets=[];
    patches.forEach((p,i)=>{
      const series=(p.series||[]).filter(s=>s.period!=null);
      if(!series.length) return;
      datasets.push({
        label:"Patch #"+p.patch_number,
        color:CAT[i%CAT.length],
        values:series.map(s=>({label:s.period, value:(Number(s.adoption_pct)||0)*100})),
      });
    });
    if(!datasets.length) return '<div class="empty">No adoption data.</div>';
    const head=`<div class="kv" style="margin-bottom:.5rem"><span>Release: <b>${esc(d.release_version||"—")}</b></span>`+
      (d.is_latest?`<span class="pill active">latest</span>`:"")+`</div>`;
    return head+lineChart(datasets,{area:datasets.length===1, max:100, fmtY:v=>Math.round(v)+"%"});
  }

  // GetUniqueUsersResponse: {as_of,granularity,current:{unique_users,range,time_series:[{period,unique_users}]},previous:{unique_users,range}|null}
  function renderUniqueUsers(res){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    const cur=d.current||{};
    const prev=d.previous; // may be null
    const ts=cur.time_series||[];
    if(!ts.length && !(cur.unique_users) && prev==null) return anaNoData(res);
    let h=statCompare(cur.unique_users, prev?prev.unique_users:null, "This window", "Prev window");
    if(ts.length){
      h+=lineChart([{label:"Unique users", color:"var(--bar1)",
        values:ts.map(p=>({label:p.period, value:p.unique_users}))}], {area:true});
    }
    return h;
  }

  // GetVersionDistributionResponse: {entries:[{release_version,device_count,percentage}],total_devices,active_window_days,as_of}
  function renderVersionDist(res){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    const entries=d.entries||[];
    if(!entries.length) return '<div class="empty">No active devices in window.</div>';
    const rows=entries.map(e=>({label:e.release_version||"(unknown)", value:e.device_count, pct:e.percentage}));
    const stats=`<div class="stats"><div class="stat"><span class="n">${num(d.total_devices)}</span><span class="l">Total devices</span></div>`+
      `<div class="stat"><span class="n">${entries.length}</span><span class="l">Versions</span></div></div>`;
    return stats+hbarChart(rows, {color:"var(--bar1)"});
  }

  // GetActivityHeatmapResponse: {cells:[{day_of_week_utc,hour_utc,average_active_devices}],busiest_day_of_week_utc,busiest_hour_utc,...}
  function renderHeatmap(res){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    const cells=d.cells||[];
    if(!cells.length) return '<div class="empty">No data.</div>';
    return heatmapGrid(cells, d.busiest_day_of_week_utc, d.busiest_hour_utc);
  }

  // GetActiveHoursResponse: {hourly:[{hour_utc,average_active_devices}],recommended_window_start_utc,recommended_window_length_hours,busiest_hour_utc,...}
  function renderActiveHours(res){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    const hourly=d.hourly||[];
    if(!hourly.length || !hourly.some(x=>(Number(x.average_active_devices)||0)>0)) return '<div class="empty">No activity data.</div>';
    let note="";
    if(d.recommended_window_start_utc!=null){
      const s=d.recommended_window_start_utc, len=d.recommended_window_length_hours||2, e=(s+len)%24;
      note=`<div class="kv" style="margin-bottom:.4rem"><span>Recommended release window: <b>${pad2(s)}:00–${pad2(e)}:00 UTC</b></span>`+
        (d.busiest_hour_utc!=null?`<span>Busiest hour: <b>${pad2(d.busiest_hour_utc)}:00 UTC</b></span>`:"")+`</div>`;
    }
    return note+activeHoursChart(hourly, d.recommended_window_start_utc, d.recommended_window_length_hours, d.busiest_hour_utc);
  }

  // GetNewDevicesResponse: {current,previous|null,window_days,as_of} — totals only, no series.
  function renderNewDevices(res){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    if(d.current==null && d.previous==null) return anaNoData(res);
    return statCompare(d.current, d.previous==null?null:d.previous, "New (30d)", "Prev 30d")+
      `<div class="muted" style="font-size:12px;margin-top:.4rem">Devices first seen in the window (totals only — no time series provided by this endpoint).</div>`;
  }

  // GetPatchMetricResponse: {as_of,granularity,current:{count,range,time_series:[{period,count}]},previous:{count,range}|null}
  function renderPatchMetric(res, kind){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    const cur=d.current||{};
    const prev=d.previous;
    const ts=cur.time_series||[];
    const hasData=(cur.count||0)>0 || ts.some(p=>(p.count||0)>0) || (prev && prev.count);
    if(!hasData) return anaNoData(res);
    let h=statCompare(cur.count, prev?prev.count:null, "This window", "Prev window");
    if(ts.length){
      h+=lineChart([{label:kind, color:kind==="downloads"?"var(--bar2)":"var(--bar1)",
        values:ts.map(p=>({label:p.period, value:p.count}))}], {area:true});
    }
    return h;
  }

  // ---------- shell ----------
  function showApp(){
    $("gate").hidden=true; $("app").hidden=false;
    const host=(state.base||location.origin).replace(/^https?:\/\//,"");
    const el=$("connHost"); el.textContent=host; el.title=state.base||location.origin;
  }
  function showGate(){ $("gate").hidden=false; $("app").hidden=true; }
  function disconnect(){
    state.key=""; localStorage.removeItem(LS.key); $("key").value="";
    state.apps=[]; state.orgs=[]; state.selected=null; state.selectedOrg=null; state.me=null;
    setStatus("","Not connected"); showGate();
  }
  function copyText(t){
    try{ if(navigator.clipboard) navigator.clipboard.writeText(t); toast("Copied to clipboard.","ok"); }
    catch(e){ toast("Copy failed.","err"); }
  }
  function codeBlock(text){
    return `<div class="codeblock"><button class="copybtn" data-copytext="${esc(text)}">Copy</button>${esc(text)}</div>`;
  }
  function skeletonDetail(){
    const bar=(w)=>`<div class="skeleton" style="width:${w}"></div>`;
    return `<div class="panel"><div class="bd">${bar("38%")}${bar("72%")}${bar("55%")}</div></div>`+
      `<div class="section"><div class="panel"><div class="bd">${bar("28%")}${bar("86%")}${bar("64%")}${bar("74%")}</div></div></div>`;
  }
  function renderOverview(){
    const d=$("detail");
    const url=state.base||location.origin;
    const noApps=state.apps.length===0;
    const cmds=`export SHOREBIRD_HOSTED_URL=${url}\n`+
      `export SHOREBIRD_TOKEN=<your api key>\n`+
      `shorebird init\n`+
      `# then set  base_url: ${url}  in shorebird.yaml\n`+
      `shorebird release android\n`+
      `shorebird patch android`;
    d.innerHTML=`<div class="hero"><span class="logo" aria-hidden="true">🐦</span>`+
      `<h1>${noApps?"Let’s ship your first patch":("Welcome"+(state.me&&state.me.email?", "+esc(state.me.email):""))}</h1>`+
      `<div>${noApps
        ?"No apps yet. Point the Shorebird CLI at this server and release — your app appears here automatically."
        :"Select an app for releases, patches, rollouts, and analytics — or manage your team from the sidebar."}</div>`+
      `<div class="ovstats">`+
      `<div class="stat"><span class="n">${state.apps.length}</span><span class="l">Apps</span></div>`+
      `<div class="stat"><span class="n">${state.orgs.length}</span><span class="l">Organizations</span></div>`+
      `</div></div>`+
      `<div class="qs"><h3>Quick start</h3>`+
      `<p>From your Flutter app directory. Use a <b>device-reachable</b> URL (your LAN IP or domain) for `+
      `<code>base_url</code> so devices can reach this server.</p>`+
      codeBlock(cmds)+`</div>`;
  }

  // ---------- theme ----------
  function applyTheme(t){
    if(t==="light"||t==="dark"){ document.documentElement.setAttribute("data-theme",t); }
    else { document.documentElement.removeAttribute("data-theme"); }
  }
  function toggleTheme(){
    const cur=localStorage.getItem(LS.theme)||"auto";
    const next=cur==="auto"?"light":(cur==="light"?"dark":"auto");
    localStorage.setItem(LS.theme,next);
    applyTheme(next);
    toast("Theme: "+next,"");
  }

  // ---------- init ----------
  function init(){
    applyTheme(localStorage.getItem(LS.theme)||"auto");
    $("base").value=state.base;
    $("key").value=state.key;
    $("connectBtn").onclick=connect;
    $("themeBtn").onclick=toggleTheme;
    $("themeBtn2").onclick=toggleTheme;
    $("disconnectBtn").onclick=disconnect;
    $("createAppBtn").onclick=createApp;
    // delegated copy for code blocks / snippets
    document.addEventListener("click",e=>{
      const b=e.target.closest&&e.target.closest("[data-copytext]");
      if(b) copyText(b.getAttribute("data-copytext"));
    });
    // app filter + "/" to focus it
    $("appFilter").addEventListener("input",e=>{ state.appFilter=e.target.value; renderApps(); });
    document.addEventListener("keydown",e=>{
      const typing=/^(INPUT|SELECT|TEXTAREA)$/.test((e.target&&e.target.tagName)||"");
      if(e.key==="/" && !typing && !$("app").hidden){ e.preventDefault(); $("appFilter").focus(); }
    });
    $("key").addEventListener("keydown",e=>{ if(e.key==="Enter") connect(); });
    $("base").addEventListener("keydown",e=>{ if(e.key==="Enter") connect(); });
    if(state.key) connect();
  }
  init();
})();
</script>
</body>
</html>
