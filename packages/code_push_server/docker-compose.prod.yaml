# Production stack for the self-hosted code_push_server control plane.
#
#   1. cp .env.example .env   # then edit .env — set real secrets/domain
#   2. docker compose -f docker-compose.prod.yaml up -d --build
#
# Topology:
#   caddy  ──TLS──▶ server ──▶ postgres  (metadata)
#                         └──▶ s3        (artifact object storage: SeaweedFS)
#
# The Dart server is stateless: all durable state lives in Postgres + the S3
# store, so `server` can be scaled horizontally (see PRODUCTION.md). Only Caddy
# publishes ports to the host; postgres/s3/server stay on the internal network.
#
# The object store used to be MinIO, which is no longer maintained. It is now
# SeaweedFS, and any S3-compatible store works in its place (set S3_ENDPOINT,
# S3_REGION, S3_PATH_STYLE). An existing install keeps its data in the old
# `cps_minio` volume: copy it across once with ops/migrate-minio-to-s3.sh
# (PRODUCTION.md, "Migrating from MinIO"). Until then `docker compose up` starts
# an EMPTY store, so run the migration in the same maintenance window.
#
# Values come from .env (see .env.example). Never commit .env.

services:
  server:
    # See docker-compose.yaml — pinned prebuilt image; uncomment build: to
    # compile from source instead.
    #   build:
    #     context: .
    #     dockerfile: Dockerfile
    image: ${CPS_IMAGE:-ghcr.io/mml555/code-push-server:1.3.0}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Caddy proxies to the server from the compose bridge network, so its
      # container address — not loopback — is what the server sees as the peer.
      # Without naming that range the server ignores Caddy's X-Forwarded-For
      # and keys every request in the deployment on Caddy's IP, collapsing the
      # whole device fleet into one rate-limit bucket.
      #
      # Defaulted here, not just in .env: setup.sh writes TRUSTED_PROXIES only
      # when it *generates* a .env, so a stack that predates that line keeps
      # its existing .env on upgrade and would otherwise silently fall back to
      # the server's {127.0.0.1, ::1} default. An explicit value in .env still
      # wins. Safe because no host port is published — nothing but Caddy can
      # reach the server to forge the header. See PRODUCTION.md §9.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.16.0.0/12}"
    # No host port published — only Caddy (same network) reaches it.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    networks:
      - cps

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # persisted TLS certs — do NOT lose this
      - caddy_config:/config
    networks:
      - cps

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cps_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cps

  # Object store: SeaweedFS (Apache-2.0), one container running master, volume
  # server, filer and the S3 gateway. The image is pinned by version AND digest;
  # bump both together after testing (test/integration/s3_store_test.dart). The gateway listens
  # on 9000 and answers to the network alias `minio` as well as `s3`, so an
  # existing .env with S3_ENDPOINT=http://minio:9000 keeps working unchanged.
  # The server creates the bucket itself on first boot.
  #
  # The root credentials are S3_ACCESS_KEY / S3_SECRET_KEY (the same values the
  # server uses). MINIO_ROOT_USER / MINIO_ROOT_PASSWORD still work as deprecated
  # fallbacks for an .env that only has those.
  s3:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    restart: unless-stopped
    # -volume.max=0 sizes the volume count to the free disk; 1 GiB volumes keep
    # a small host from reserving the default 30 GB per volume.
    #
    # -ip / -ip.bind put the master, volume server and filer on 127.0.0.1
    # inside the container, and -s3.ip.bind alone listens on all interfaces.
    # Those other listeners have no authentication and the filer would let
    # anything on the network read and rewrite the bucket without the S3 key,
    # so only port 9000 may be reachable from the other containers.
    command: >-
      server -s3 -s3.port=9000 -dir=/data
      -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3.ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      # SeaweedFS turns these two into its admin identity. With them empty it
      # starts with no identity at all and accepts anonymous requests, so the
      # secret is required (`:?` stops compose before anything starts).
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-cps}}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?set S3_SECRET_KEY in .env}}
    volumes:
      - cps_s3:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 && wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      cps:
        aliases:
          - minio

  # Only for migrating an existing install (ops/migrate-minio-to-s3.sh starts
  # it with `--profile migrate`): the old MinIO, read-only in effect, on the old
  # `cps_minio` volume. Docker Hub no longer serves minio/minio, so this uses
  # the image already on your host (MINIO_LEGACY_IMAGE overrides it) and never
  # pulls. Delete this service, and the volume, once the migration is verified.
  minio-legacy:
    image: ${MINIO_LEGACY_IMAGE:-minio/minio:latest}
    pull_policy: never
    profiles: ["migrate"]
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${S3_ACCESS_KEY:-cps}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${S3_SECRET_KEY}}
    volumes:
      - cps_minio:/data
    networks:
      - cps

  # rclone, for backups (ops/backup.sh, ops/restore.sh) and the one-off MinIO
  # migration (ops/migrate-minio-to-s3.sh). Never started by `up`; the scripts
  # run it with `docker compose --profile tools run --rm rclone ...`. Pinned by
  # version and digest. Remote `store` is the current object store (the same
  # S3_* settings the server uses); remote `legacy` is the old MinIO.
  rclone:
    image: rclone/rclone:1.73.0@sha256:9f59fda717a48aced38d7f27e9ec8fd9992b5651e7a03897bebf204d3a9197d6
    profiles: ["tools"]
    entrypoint: ["rclone"]
    environment:
      RCLONE_CONFIG: /dev/null  # all remotes below come from the environment
      RCLONE_CONFIG_STORE_TYPE: s3
      RCLONE_CONFIG_STORE_PROVIDER: Other
      RCLONE_CONFIG_STORE_ENDPOINT: ${S3_ENDPOINT:-http://s3:9000}
      RCLONE_CONFIG_STORE_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-cps}}
      RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?set S3_SECRET_KEY in .env}}
      RCLONE_CONFIG_STORE_REGION: ${S3_REGION:-us-east-1}
      RCLONE_CONFIG_STORE_FORCE_PATH_STYLE: ${S3_PATH_STYLE:-true}
      RCLONE_CONFIG_LEGACY_TYPE: s3
      RCLONE_CONFIG_LEGACY_PROVIDER: Minio
      RCLONE_CONFIG_LEGACY_ENDPOINT: ${LEGACY_ENDPOINT:-http://minio-legacy:9000}
      RCLONE_CONFIG_LEGACY_ACCESS_KEY_ID: ${LEGACY_ACCESS_KEY:-${MINIO_ROOT_USER:-${S3_ACCESS_KEY:-cps}}}
      RCLONE_CONFIG_LEGACY_SECRET_ACCESS_KEY: ${LEGACY_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-${S3_SECRET_KEY}}}
      RCLONE_CONFIG_LEGACY_FORCE_PATH_STYLE: "true"
    networks:
      - cps

networks:
  cps:
    driver: bridge

volumes:
  cps_pg:
  cps_s3:
  # The old MinIO data. Kept (not deleted) so the migration can be re-run and
  # rolled back; see PRODUCTION.md.
  cps_minio:
  caddy_data:
  caddy_config:
