# TLS overlay for the SINGLE-CONTAINER stack: puts Caddy in front of the server
# for automatic HTTPS, without adding Postgres/MinIO. Layer it on the default:
#
#   docker compose -f docker-compose.yaml -f docker-compose.tls.yaml up -d
#
# (./setup.sh --domain <host> does this for you.) Needs DNS for $DOMAIN and
# ports 80/443 reachable. Still one data volume (cps_data / SQLite + files).
services:
  server:
    # Caddy reaches the server in-network; don't publish 8080 to the host.
    ports: !reset []
    expose:
      - "8080"
    environment:
      # This overlay IS the "behind a proxy" topology, so override the base
      # file's loopback default: Caddy connects from the compose bridge
      # network, and without naming that range the server ignores Caddy's
      # X-Forwarded-For and rate-limits the whole fleet as one client.
      # Safe here because nothing else can reach the server — no host ports.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.16.0.0/12}"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # persisted TLS certs — do NOT lose this
      - caddy_config:/config
    networks:
      - default

volumes:
  caddy_data:
  caddy_config:
