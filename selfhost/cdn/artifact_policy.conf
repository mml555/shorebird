# cspell:words bidiff
# artifact_policy.conf — what we OWN per custom engine hash, and why.
#
# The ownership rule this file encodes (decided 2026-08-06):
#
#   Own every artifact whose correctness depends on our Dart/Flutter tree, or
#   whose URL is under one of our custom engine hashes. Mirror stock only when
#   the artifact is demonstrably tree-independent, or belongs to a platform we
#   deliberately do not build.
#
# The point is to stop a future session from equating "present in our mirror"
# with "produced by our toolchain". Those are different claims and only one of
# them is independence.
#
# Audited by selfhost/cdn/audit_overlay.sh, which compares this file against
# (a) what is actually on disk in the overlay and (b) what the Caddyfile's
# @must_be_local matcher route-protects. All three must agree.
#
# ---------------------------------------------------------------------------
# FORMAT:  <cell> <provenance> <requirement> <path> [note...]
#
#   %H in <path> expands to the engine hash being audited. Paths are relative
#   to the overlay root and therefore identical to the request URI minus its
#   leading slash.
#
# <cell> — the build cell that consumes it. `both` applies to every hash.
#   macos-ios       arm64 macOS host building iOS   (currently 70974f81)
#   linux-android   x64 Linux host building Android (currently 760e3fab)
#
# <provenance> — where the bytes come from. THREE states, not two:
#   owned-built      Produced from our tree and validated. Required for every
#                    Dart/VM-coupled artifact in a flow we actually verify.
#   owned-mirrored   Copied into our overlay but intentionally sourced from
#                    upstream, because the artifact is tree-INDEPENDENT. It is
#                    ours in the sense that we serve it and a miss is loud; it
#                    is not ours in the sense that we compiled it.
#   compat-mirrored  Stock, retained only for a platform/cell we do not build
#                    or verify. MUST NEVER satisfy a claim that the platform is
#                    self-built. Falls through to the pinned hash.
#   none             Nothing should be served. See requirement `denied`.
#
# <requirement> — what the audit demands.
#   required   Consumed by the verified build path. Absent => missing-required,
#              which fails the audit.
#   deferred   Intended to be owned-built, not built yet, and something else
#              currently compensates. The note must say what.
#   optional   May be absent; nothing in a verified flow asks for it.
#   denied     Route-protected and DELIBERATELY absent: a 404 is the correct
#              answer. Used where falling through to stock would silently mix
#              toolchains, which is worse than a loud failure.
#
# ---------------------------------------------------------------------------
# WHY `denied` exists, and why it is not the same as compat-mirrored.
#
# A stock Dart SDK or const_finder served alongside our engine is the exact
# failure that cost a full warm run on 2026-08-06: stock font-subset.zip
# extracts into the same cache dir as artifacts.zip, so the stock
# const_finder overwrote the fork one and every release died with
# "ConstFinder failure: Can't load Kernel binary: Invalid SDK hash". Silent
# cross-toolchain mixing is the worst outcome available; a 404 is strictly
# better. So host toolchains we do NOT build are denied, not mirrored.
#
# ===========================================================================

# --- Shared: engine metadata and the Dart-facing package archives -----------
# sky_engine and flutter_gpu are `getPackageDirs()` in flutter_tools'
# FlutterSdk cache class (flutter_cache.dart:264), fetched as
# <base>/flutter_infra_release/flutter/<hash>/<name>.zip. They are namespaced
# by engine revision and carry Dart-facing engine API source, so "stock happens
# to be byte-identical today" is not a property to depend on — it is the same
# shape as the frontend/backend metadata trap in TFA_ROOT_CAUSE.md. Generate
# from our pinned Flutter tree, diff against stock, RECORD that they match, and
# still publish our own copy. That removes fallback from the correctness path.
both owned-built required flutter_infra_release/flutter/%H/sky_engine.zip Dart source of dart:ui; publish ours even when byte-identical to stock
both owned-built required flutter_infra_release/flutter/%H/flutter_gpu.zip second getPackageDirs() entry; same class as sky_engine
both owned-built required flutter_infra_release/flutter/%H/engine_stamp.json Flutter 3.44 fetches it and a 404 is fatal
both owned-built required flutter_infra_release/flutter/%H/flutter_patched_sdk.zip platform dill, welded to our tree
both owned-built required flutter_infra_release/flutter/%H/flutter_patched_sdk_product.zip platform dill (product), welded to our tree

# --- Shared: Flow B, the control-plane-side artifacts -----------------------
both owned-built required download.shorebird.dev/shorebird/%H/artifacts_manifest.yaml must describe OUR hash; see audit_overlay.sh --emit-manifest
both owned-built required download.shorebird.dev/shorebird/%H/patch-darwin-arm64.zip bidiff, built by engine/publish_patch_tool.sh
both owned-built required download.shorebird.dev/shorebird/%H/patch-darwin-x64.zip cross-compiled, Rosetta-verified
both owned-built required download.shorebird.dev/shorebird/%H/patch-linux-x64.zip built on the Linux box
both compat-mirrored optional download.shorebird.dev/shorebird/%H/patch-windows-x64.zip no Windows builder; recorded gap
both none denied download.shorebird.dev/shorebird/%H/aot-tools.dill their private linker; 404 loudly so we never serve a linker our engine cannot use

# --- macos-ios cell ---------------------------------------------------------
macos-ios owned-built required flutter_infra_release/flutter/%H/ios-release/artifacts.zip the iOS engine we build
macos-ios owned-built required flutter_infra_release/flutter/%H/dart-sdk-darwin-arm64.zip our Dart SDK; frontend_server + gen_snapshot must match it
macos-ios owned-built required flutter_infra_release/flutter/%H/darwin-arm64/artifacts.zip host toolchain: frontend_server_aot, gen_snapshot, const_finder
macos-ios owned-built required flutter_infra_release/flutter/%H/darwin-arm64/font-subset.zip carries OUR const_finder; extracts over artifacts.zip's dir
macos-ios none denied flutter_infra_release/flutter/%H/dart-sdk-linux-x64.zip not this cell's host; stock here would mix toolchains
macos-ios none denied flutter_infra_release/flutter/%H/dart-sdk-darwin-x64.zip Intel Mac host not built or tested; deny rather than mix
macos-ios none denied flutter_infra_release/flutter/%H/dart-sdk-windows-x64.zip no Windows builder; deny rather than mix

# --- linux-android cell -----------------------------------------------------
linux-android owned-built required flutter_infra_release/flutter/%H/android-arm64-release/artifacts.zip the Android engine we build
linux-android owned-built required flutter_infra_release/flutter/%H/android-arm64-release/symbols.zip symbols for the above
linux-android owned-built required flutter_infra_release/flutter/%H/android-arm64-release/linux-x64.zip host gen_snapshot for this cell
linux-android owned-built required flutter_infra_release/flutter/%H/dart-sdk-linux-x64.zip our Dart SDK for the Linux host
linux-android owned-built required flutter_infra_release/flutter/%H/linux-x64/artifacts.zip host toolchain (frontend_server, const_finder)
linux-android owned-built deferred flutter_infra_release/flutter/%H/linux-x64/font-subset.zip fork linux-x64 const_finder not built; compensated by --no-tree-shake-icons. Building it re-enables Android icon tree-shaking and flips this to required
linux-android owned-mirrored required flutter_infra_release/flutter/%H/darwin-arm64/font-subset.zip verbatim copy of the pinned one: this cell's host toolchain is not ours, so stock is CORRECT here. Published anyway so ownership never has to guess
linux-android none denied flutter_infra_release/flutter/%H/dart-sdk-darwin-arm64.zip not this cell's host
linux-android none denied flutter_infra_release/flutter/%H/dart-sdk-darwin-x64.zip Intel Mac host not built or tested
linux-android none denied flutter_infra_release/flutter/%H/dart-sdk-windows-x64.zip no Windows builder
# DEVIATION, stated so it can be overruled: the ownership rule would make these
# two compat-mirrored ("a platform we deliberately do not build"), and an
# earlier draft of this policy did. They are `denied` instead, for one reason:
# a HOST GEN_SNAPSHOT is the highest-risk mixing artifact there is. Serving a
# stock darwin-x64 gen_snapshot against our engine is precisely the fork mix
# that shorebird_cli's dart_sdk_compatibility.dart now refuses to build through,
# and it compiles cleanly before failing on the device — so "it built" would
# prove nothing. Deny is also what the Caddyfile already does today.
#
# Nothing in a supported rig requests either path (the Android leg builds on
# Linux and asks for linux-x64.zip), so both settings are inert in practice.
# Flip these two lines to `compat-mirrored optional` if you want fallthrough.
linux-android none denied flutter_infra_release/flutter/%H/android-arm64-release/darwin-x64.zip host gen_snapshot for a cell we do not build; deny rather than risk a silent toolchain mix
linux-android none denied flutter_infra_release/flutter/%H/android-arm64-release/windows-x64.zip host gen_snapshot for a cell we do not build; deny rather than risk a silent toolchain mix

# --- linux-android cell: Maven ----------------------------------------------
# Gradle validates the version inside the .pom BODY, so every module must be
# materialized locally under the experimental hash even when we did not build
# it — a proxy rewrite cannot work. Only arm64_v8a carries our engine; the rest
# are stock re-tagged to our hash by overlay_publish.sh's pom_retag.
#
# This is why "the self-built APK is arm64-only in practice": the armeabi_v7a
# and x86_64 jars hold STOCK libflutter.so.
linux-android owned-built required download.flutter.io/io/flutter/arm64_v8a_release/1.0.0-%H/arm64_v8a_release-1.0.0-%H.jar our engine
linux-android owned-built required download.flutter.io/io/flutter/arm64_v8a_release/1.0.0-%H/arm64_v8a_release-1.0.0-%H.pom our engine
linux-android owned-built required download.flutter.io/io/flutter/arm64_v8a_release/1.0.0-%H/arm64_v8a_release-1.0.0-%H.maven-metadata.xml overlay_publish.sh omits this; add by hand
linux-android owned-mirrored required download.flutter.io/io/flutter/armeabi_v7a_release/1.0.0-%H/armeabi_v7a_release-1.0.0-%H.jar STOCK engine re-tagged; this ABI is not self-built
linux-android owned-mirrored required download.flutter.io/io/flutter/armeabi_v7a_release/1.0.0-%H/armeabi_v7a_release-1.0.0-%H.pom re-tagged stock
linux-android owned-mirrored required download.flutter.io/io/flutter/x86_64_release/1.0.0-%H/x86_64_release-1.0.0-%H.jar STOCK engine re-tagged; this ABI is not self-built
linux-android owned-mirrored required download.flutter.io/io/flutter/x86_64_release/1.0.0-%H/x86_64_release-1.0.0-%H.pom re-tagged stock
linux-android owned-mirrored required download.flutter.io/io/flutter/flutter_embedding_release/1.0.0-%H/flutter_embedding_release-1.0.0-%H.jar re-tagged stock. Our engine changes are native-only so far, so this is currently safe — revisit the moment we patch the Java embedding
linux-android owned-mirrored required download.flutter.io/io/flutter/flutter_embedding_release/1.0.0-%H/flutter_embedding_release-1.0.0-%H.pom re-tagged stock
