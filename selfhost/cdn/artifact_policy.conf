# artifact_policy.conf — what we OWN per custom engine hash, and why.
# cspell:words armv
#
# The ownership rule this file encodes (decided 2026-08-06):
#
#   Own every artifact whose correctness depends on our Dart/Flutter tree, or
#   whose URL is under one of our custom engine hashes. Mirror stock only when
#   the artifact is demonstrably tree-independent, or belongs to a platform we
#   deliberately do not build.
#
# The point is to stop a future session from equating "present in our mirror"
# with "produced by our toolchain". Those are different claims and only one of
# them is independence.
#
# Audited by selfhost/cdn/audit_overlay.sh, which compares this file against
# (a) what is actually on disk in the overlay and (b) what the Caddyfile's
# @must_be_local matcher route-protects. All three must agree.
#
# ---------------------------------------------------------------------------
# FORMAT:  <cell> <provenance> <requirement> <path> [note...]
#
#   %H in <path> expands to the engine hash being audited. Paths are relative
#   to the overlay root and therefore identical to the request URI minus its
#   leading slash.
#
# <cell> — the build cell that consumes it. `both` applies to every hash.
#   macos-ios         arm64 macOS host building iOS   (currently 70974f81)
#   linux-android     x64 Linux host building Android (currently 760e3fab)
#   macos-ios-android arm64 macOS host building iOS and Android
#   macos-x64         Intel macOS HOST toolchain only (dart-sdk-darwin-x64,
#                     darwin-x64/*). Its iOS/Android target artifacts are the
#                     macos-ios-android cell's; audit both.
#
# Each cell is a HOST (which toolchain runs the build) plus targets. One overlay
# serves every host, so a hash that carries a Linux and a Mac toolchain holds
# files that are another cell's. See `foreign:<cell>` below.
#
# <provenance> — where the bytes come from. THREE states, not two:
#   owned-built      Produced from our tree and validated. Required for every
#                    Dart/VM-coupled artifact in a flow we actually verify.
#   owned-mirrored   Copied into our overlay but intentionally sourced from
#                    upstream, because the artifact is tree-INDEPENDENT. It is
#                    ours in the sense that we serve it and a miss is loud; it
#                    is not ours in the sense that we compiled it.
#   compat-mirrored  Stock, retained only for a platform/cell we do not build
#                    or verify. MUST NEVER satisfy a claim that the platform is
#                    self-built. Falls through to the pinned hash.
#   none             Nothing should be served. See requirement `denied`.
#
# <requirement> — what the audit demands.
#   required   Consumed by the verified build path. Absent => missing-required,
#              which fails the audit.
#   deferred   Intended to be owned-built, not built yet, and something else
#              currently compensates. The note must say what.
#   optional   May be absent; nothing in a verified flow asks for it.
#   denied     Not part of the supported build matrix: custom-engine requests
#              must FAIL rather than fall through to stock. Route-protected and
#              deliberately absent, so a 404 is the correct answer. Used where
#              falling through would silently mix toolchains, which is worse
#              than a loud failure.
#   foreign:<cell>
#              Owned by ANOTHER cell, typically the host toolchain of a
#              different host. For this cell the path is not a requirement, and
#              its presence is not a leak: another cell's audit judges it. It
#              stays route-protected (the owner's bytes must never fall through
#              to stock either). audit_overlay.sh and check_protection_matchers.py
#              both refuse a `foreign:X` line unless cell X has a line for the
#              same path that is neither denied nor foreign, so the owner named
#              here is a fact rather than a comment.
#
# ---------------------------------------------------------------------------
# WHY `denied` exists, and why it is not the same as compat-mirrored.
#
# A stock Dart SDK or const_finder served alongside our engine is the exact
# failure that cost a full warm run on 2026-08-06: stock font-subset.zip
# extracts into the same cache dir as artifacts.zip, so the stock
# const_finder overwrote the fork one and every release died with
# "ConstFinder failure: Can't load Kernel binary: Invalid SDK hash". Silent
# cross-toolchain mixing is the worst outcome available; a 404 is strictly
# better. So host toolchains we do NOT build are denied, not mirrored.
#
# ===========================================================================

# --- Shared: engine metadata and the Dart-facing package archives -----------
# sky_engine and flutter_gpu are `getPackageDirs()` in flutter_tools'
# FlutterSdk cache class (flutter_cache.dart:264), fetched as
# <base>/flutter_infra_release/flutter/<hash>/<name>.zip. They are namespaced
# by engine revision and carry Dart-facing engine API source, so "stock happens
# to be byte-identical today" is not a property to depend on — it is the same
# shape as the frontend/backend metadata trap in TFA_ROOT_CAUSE.md. Generate
# from our pinned Flutter tree, diff against stock, RECORD that they match, and
# still publish our own copy. That removes fallback from the correctness path.
both owned-built required flutter_infra_release/flutter/%H/sky_engine.zip Dart source of dart:ui; publish ours even when byte-identical to stock
both owned-built required flutter_infra_release/flutter/%H/flutter_gpu.zip second getPackageDirs() entry; same class as sky_engine
both owned-built required flutter_infra_release/flutter/%H/engine_stamp.json Flutter 3.44 fetches it and a 404 is fatal
both owned-built required flutter_infra_release/flutter/%H/flutter_patched_sdk.zip platform dill, welded to our tree
both owned-built required flutter_infra_release/flutter/%H/flutter_patched_sdk_product.zip platform dill (product), welded to our tree

# --- Shared: Flow B, the control-plane-side artifacts -----------------------
both owned-built required download.shorebird.dev/shorebird/%H/artifacts_manifest.yaml must describe OUR hash; see audit_overlay.sh --emit-manifest
both owned-built required download.shorebird.dev/shorebird/%H/patch-darwin-arm64.zip bidiff, built by engine/publish_patch_tool.sh
both owned-built required download.shorebird.dev/shorebird/%H/patch-darwin-x64.zip cross-compiled, Rosetta-verified
both owned-built required download.shorebird.dev/shorebird/%H/patch-linux-x64.zip built on the Linux box
# These three are `both` on purpose, not per host: cell membership (the Route B
# cell address) is derived from the required owned lines, and every hash is
# expected to carry every differ. A Linux-only publish therefore reports the two
# Mac differs missing; that is the rule working, not a host-ownership gap.
both compat-mirrored optional download.shorebird.dev/shorebird/%H/patch-windows-x64.zip no Windows builder; recorded gap
both none denied download.shorebird.dev/shorebird/%H/aot-tools.dill their private linker; 404 loudly so we never serve a linker our engine cannot use
# Route B bytecode compiler. ONE artifact holding dartaotruntime +
# dart2bytecode.aot + vm_platform.dill, because those three are version-locked
# and a mismatched set fails at load time ON DEVICE, long after the CLI reports
# success. Optional because only Route B engines have one; when present it must
# be ours, and audit_route_b_compiler.sh proves the contents rather than the
# filename.
macos-ios owned-built optional download.shorebird.dev/shorebird/%H/route-b-compiler-darwin-arm64.zip built by engine/route_b/publish_route_b_compiler.sh; audited by audit_route_b_compiler.sh

# --- macos-ios cell ---------------------------------------------------------
macos-ios owned-built required flutter_infra_release/flutter/%H/ios-release/artifacts.zip the iOS engine we build
macos-ios owned-built required flutter_infra_release/flutter/%H/ios/artifacts.zip the iOS DEBUG engine. flutter_cache.dart's _iosBinaryDirs requires ios, ios-profile AND ios-release before ANY iOS build proceeds, including a release; measured 2026-09-01, a release against a cell owning only ios-release cannot resolve from an empty cache. Fallback is not a substitute: the unowned path goes upstream and the mirror's ~10s deadline 504s a large artifact every time
macos-ios owned-built required flutter_infra_release/flutter/%H/ios-profile/artifacts.zip the iOS PROFILE engine; same _iosBinaryDirs requirement as ios above
macos-ios owned-built required flutter_infra_release/flutter/%H/dart-sdk-darwin-arm64.zip our Dart SDK; frontend_server + gen_snapshot must match it
macos-ios owned-built required flutter_infra_release/flutter/%H/darwin-arm64/artifacts.zip host toolchain: frontend_server_aot, gen_snapshot, const_finder
macos-ios owned-built required flutter_infra_release/flutter/%H/darwin-arm64/font-subset.zip carries OUR const_finder; extracts over artifacts.zip's dir
macos-ios none foreign:linux-android flutter_infra_release/flutter/%H/dart-sdk-linux-x64.zip the Linux host's SDK; stock here would mix toolchains
macos-ios none foreign:macos-x64 flutter_infra_release/flutter/%H/dart-sdk-darwin-x64.zip the Intel Mac host's SDK
macos-ios none denied flutter_infra_release/flutter/%H/dart-sdk-windows-x64.zip no Windows builder; deny rather than mix

# --- linux-android cell -----------------------------------------------------
linux-android owned-built required flutter_infra_release/flutter/%H/android-arm64-release/artifacts.zip the Android engine we build
linux-android owned-built required flutter_infra_release/flutter/%H/android-arm64-release/symbols.zip symbols for the above
linux-android owned-built required flutter_infra_release/flutter/%H/android-arm64-release/linux-x64.zip host gen_snapshot for this cell
linux-android owned-built required flutter_infra_release/flutter/%H/dart-sdk-linux-x64.zip our Dart SDK for the Linux host
linux-android owned-built required flutter_infra_release/flutter/%H/linux-x64/artifacts.zip host toolchain (frontend_server, const_finder)
linux-android owned-built required flutter_infra_release/flutter/%H/linux-x64/font-subset.zip carries OUR const_finder, built 2026-08-07 with the fork dart. Proven: fork SDK loads it, fork SDK REJECTS stock with "Invalid SDK hash". This is what lets Android icon tree-shaking run
linux-android owned-mirrored required flutter_infra_release/flutter/%H/darwin-arm64/font-subset.zip verbatim copy of the pinned one: this cell's host toolchain is not ours, so stock is CORRECT here. Published anyway so ownership never has to guess
linux-android none foreign:macos-ios flutter_infra_release/flutter/%H/dart-sdk-darwin-arm64.zip the arm64 Mac host's SDK
linux-android none foreign:macos-x64 flutter_infra_release/flutter/%H/dart-sdk-darwin-x64.zip the Intel Mac host's SDK
linux-android none denied flutter_infra_release/flutter/%H/dart-sdk-windows-x64.zip no Windows builder
# These two were `denied` here until 255fd850, because nothing built the Mac
# gen_snapshot. The macos-ios-android cell now owns the darwin-x64 gen_snapshot
# of every release ABI, so the overlay legitimately holds android-arm64-release/
# darwin-x64.zip. It is another cell's file, not a leak, and stays protected.
# The windows one is still nobody's: a stock windows gen_snapshot against our
# engine is the silent mix the policy exists to stop, so it stays denied.
linux-android none foreign:macos-ios-android flutter_infra_release/flutter/%H/android-arm64-release/darwin-x64.zip Mac host gen_snapshot; the Android leg of this cell builds on Linux and asks for linux-x64.zip
linux-android none denied flutter_infra_release/flutter/%H/android-arm64-release/windows-x64.zip host gen_snapshot for a cell we do not build; deny rather than risk a silent toolchain mix

# --- linux-android cell: Maven ----------------------------------------------
# Gradle validates the version inside the .pom BODY, so every module must be
# materialized locally under the experimental hash even when we did not build
# it — a proxy rewrite cannot work. Only arm64_v8a carries our engine; the rest
# are stock re-tagged to our hash by overlay_publish.sh's pom_retag.
#
# This is why "the self-built APK is arm64-only in practice": the armeabi_v7a
# and x86_64 jars hold STOCK libflutter.so.
linux-android owned-built required download.flutter.io/io/flutter/arm64_v8a_release/1.0.0-%H/arm64_v8a_release-1.0.0-%H.jar our engine
linux-android owned-built required download.flutter.io/io/flutter/arm64_v8a_release/1.0.0-%H/arm64_v8a_release-1.0.0-%H.pom our engine
linux-android owned-built required download.flutter.io/io/flutter/arm64_v8a_release/1.0.0-%H/arm64_v8a_release-1.0.0-%H.maven-metadata.xml written by overlay_publish.sh from the build's own <module>.maven-metadata.xml
linux-android owned-mirrored required download.flutter.io/io/flutter/armeabi_v7a_release/1.0.0-%H/armeabi_v7a_release-1.0.0-%H.jar STOCK engine re-tagged; this ABI is not self-built
linux-android owned-mirrored required download.flutter.io/io/flutter/armeabi_v7a_release/1.0.0-%H/armeabi_v7a_release-1.0.0-%H.pom re-tagged stock
linux-android owned-mirrored required download.flutter.io/io/flutter/x86_64_release/1.0.0-%H/x86_64_release-1.0.0-%H.jar STOCK engine re-tagged; this ABI is not self-built
linux-android owned-mirrored required download.flutter.io/io/flutter/x86_64_release/1.0.0-%H/x86_64_release-1.0.0-%H.pom re-tagged stock
linux-android owned-mirrored required download.flutter.io/io/flutter/flutter_embedding_release/1.0.0-%H/flutter_embedding_release-1.0.0-%H.jar re-tagged stock. Our engine changes are native-only so far, so this is currently safe — revisit the moment we patch the Java embedding
linux-android owned-mirrored required download.flutter.io/io/flutter/flutter_embedding_release/1.0.0-%H/flutter_embedding_release-1.0.0-%H.pom re-tagged stock

# --- macos-x64 cell (Intel Mac host) ----------------------------------------
# Host toolchain only. 255fd850 is the first hash that publishes it: the Dart SDK
# and host artifacts built for darwin-x64. (Before that the policy said "Intel
# Mac host not built or tested; deny"; it is built, and published, so it is
# owned.) The iOS and Android TARGET artifacts an Intel Mac consumes are the
# same objects as the macos-ios-android cell's, so they are not repeated here:
# audit macos-ios-android as well. The Android darwin-x64 gen_snapshots are
# already that cell's, because an arm64 Mac runs the x64 one too.
macos-x64 owned-built required flutter_infra_release/flutter/%H/dart-sdk-darwin-x64.zip our Dart SDK for the Intel Mac host; frontend_server + gen_snapshot must match it
macos-x64 owned-built required flutter_infra_release/flutter/%H/darwin-x64/artifacts.zip host toolchain: frontend_server_aot, gen_snapshot, const_finder
macos-x64 owned-built required flutter_infra_release/flutter/%H/darwin-x64/font-subset.zip carries OUR const_finder; extracts over artifacts.zip's dir. Route-protected per hash, like linux-x64's
macos-x64 none foreign:linux-android flutter_infra_release/flutter/%H/dart-sdk-linux-x64.zip the Linux host's SDK
macos-x64 none foreign:macos-ios flutter_infra_release/flutter/%H/dart-sdk-darwin-arm64.zip the arm64 Mac host's SDK
macos-x64 none denied flutter_infra_release/flutter/%H/dart-sdk-windows-x64.zip no Windows builder; deny rather than mix

# --- macos-ios-android cell -------------------------------------------------
# The Darwin-host cell that builds iOS *and* Android from one tree. It exists
# because the `linux-android` block above describes a rig that is not the
# product target: it builds on Linux, owns only arm64_v8a, and re-tags STOCK
# bytes for armeabi_v7a and x86_64. ANDROID-CELL-SUPPLY-1 measured the closure
# an ordinary `shorebird release android` actually forces on a Mac, and it does
# not overlap that list — it asks for `darwin-x64.zip` host gen_snapshot per
# ABI, which `linux-android` treats as this cell's (foreign), not its own.
#
# The iOS/macOS half is a deliberate duplicate of the `macos-ios` lines above:
# same paths, same provenance, same requirement. Duplicated rather than
# inherited because membership is derived from an exact `$1 == cell` match and
# an inheritance rule would be a second mechanism to get wrong. The twin
# agreement is CHECKED, not hoped for — qualify_android_cell.sh fails if the
# two cells' shared paths ever diverge.
#
# PROVENANCE IS PER-PLATFORM AND THE RECORD SAYS SO. The iOS/macOS members are
# the byte-identical bytes produced by engine dfa2b24a…; the Android members
# were produced by f1a59b8a… (whose parent is exactly dfa2b24a…). One global
# "producer_engine_revision" would assert that all 30 came from one revision,
# which is false for 16 of them.
macos-ios-android owned-built required flutter_infra_release/flutter/%H/ios-release/artifacts.zip byte-identical to the macos-ios cell's
macos-ios-android owned-built required flutter_infra_release/flutter/%H/ios/artifacts.zip byte-identical to the macos-ios cell's
macos-ios-android owned-built required flutter_infra_release/flutter/%H/ios-profile/artifacts.zip byte-identical to the macos-ios cell's
macos-ios-android owned-built required flutter_infra_release/flutter/%H/dart-sdk-darwin-arm64.zip byte-identical to the macos-ios cell's
macos-ios-android owned-built required flutter_infra_release/flutter/%H/darwin-arm64/artifacts.zip byte-identical to the macos-ios cell's
macos-ios-android owned-built required flutter_infra_release/flutter/%H/darwin-arm64/font-subset.zip byte-identical to the macos-ios cell's
macos-ios-android owned-built optional download.shorebird.dev/shorebird/%H/route-b-compiler-darwin-arm64.zip byte-identical to the macos-ios cell's; Route B is iOS-only and Android patches are bidiff
macos-ios-android none foreign:linux-android flutter_infra_release/flutter/%H/dart-sdk-linux-x64.zip the Linux host's SDK
macos-ios-android none foreign:macos-x64 flutter_infra_release/flutter/%H/dart-sdk-darwin-x64.zip the Intel Mac host's SDK
macos-ios-android none denied flutter_infra_release/flutter/%H/dart-sdk-windows-x64.zip no Windows builder

# The Android release engines. All three ABIs are OURS — that is the whole point
# of this cell. `darwin-x64.zip` is the host gen_snapshot that compiles the
# libapp.so which ships, so it is identity-bearing in the strongest sense.
# `artifacts.zip` is classified conservatively: ANDROID-CELL-SUPPLY-1 could not
# prove a release build never consumes it, and the cheap side of that error is
# to address it.
macos-ios-android owned-built required flutter_infra_release/flutter/%H/android-arm-release/darwin-x64.zip host gen_snapshot; compiles the armv7 libapp.so that ships
macos-ios-android owned-built required flutter_infra_release/flutter/%H/android-arm-release/artifacts.zip release-mode engine jar
macos-ios-android owned-built required flutter_infra_release/flutter/%H/android-arm64-release/darwin-x64.zip host gen_snapshot; compiles the arm64 libapp.so that ships
macos-ios-android owned-built required flutter_infra_release/flutter/%H/android-arm64-release/artifacts.zip release-mode engine jar
macos-ios-android owned-built required flutter_infra_release/flutter/%H/android-x64-release/darwin-x64.zip host gen_snapshot; compiles the x86_64 libapp.so that ships
macos-ios-android owned-built required flutter_infra_release/flutter/%H/android-x64-release/artifacts.zip release-mode engine jar
# symbols.zip is built and available but is NOT a member: no request for it
# appeared in the measured closure (29 observed objects), and a member the
# workflow never fetches would be identity the address cannot be falsified
# against. Publish it if a symbolication flow ever asks.

# --- macos-ios-android cell: Maven ------------------------------------------
# THE ENGINE THAT SHIPS IN THE APK COMES FROM HERE, not from artifacts.zip.
# Gradle adds io.flutter:<abi>_release:1.0.0-<engineVersion> and resolves it
# from $FLUTTER_STORAGE_BASE_URL/download.flutter.io, and it VALIDATES the
# version inside the .pom body against the coordinate it asked for:
#
#   inconsistent module metadata found.
#   Errors: bad version: expected='1.0.0-<cell>' found='1.0.0-<fallback>'
#
# So these cannot fall back and cannot be proxied — measured, not assumed. They
# must be genuinely published under the cell hash with POMs declaring it, which
# is why lib/v2_canonicalize.py has a permitted hash-bearing field for the POM's
# own <version> element and refuses the hash anywhere else in the file.
#
# Unlike `linux-android` above, NONE of these is a re-tagged stock jar.
macos-ios-android owned-built required download.flutter.io/io/flutter/arm64_v8a_release/1.0.0-%H/arm64_v8a_release-1.0.0-%H.jar our engine, arm64
macos-ios-android owned-built required download.flutter.io/io/flutter/arm64_v8a_release/1.0.0-%H/arm64_v8a_release-1.0.0-%H.pom our engine, arm64
macos-ios-android owned-built required download.flutter.io/io/flutter/armeabi_v7a_release/1.0.0-%H/armeabi_v7a_release-1.0.0-%H.jar our engine, armv7 — NOT re-tagged stock
macos-ios-android owned-built required download.flutter.io/io/flutter/armeabi_v7a_release/1.0.0-%H/armeabi_v7a_release-1.0.0-%H.pom our engine, armv7
macos-ios-android owned-built required download.flutter.io/io/flutter/x86_64_release/1.0.0-%H/x86_64_release-1.0.0-%H.jar our engine, x86_64 — NOT re-tagged stock
macos-ios-android owned-built required download.flutter.io/io/flutter/x86_64_release/1.0.0-%H/x86_64_release-1.0.0-%H.pom our engine, x86_64
macos-ios-android owned-built required download.flutter.io/io/flutter/flutter_embedding_release/1.0.0-%H/flutter_embedding_release-1.0.0-%H.jar our tree's Java embedding
macos-ios-android owned-built required download.flutter.io/io/flutter/flutter_embedding_release/1.0.0-%H/flutter_embedding_release-1.0.0-%H.pom our tree's Java embedding
# maven-metadata.xml is NOT a member for the same reason as symbols.zip: no
# request for it appeared in the measured closure. The `linux-android` block
# lists it as required from an era before the closure was measured.
