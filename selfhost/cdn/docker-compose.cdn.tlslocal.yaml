# Self-hosted Shorebird build-time CDN (local HTTPS).
#
# Same as docker-compose.cdn.yaml but mounts tls/listen-enabled.caddy so the
# mirror also serves https://:8443. Run tls/generate.sh (+ trust.sh on build
# hosts) first. Needed because Gradle 8+ refuses insecure Maven repositories.
#
# Usage:
#   selfhost/cdn/tls/generate.sh
#   docker compose -f selfhost/cdn/docker-compose.cdn.tlslocal.yaml up --build

name: shorebird-cdn

services:
  artifact-proxy:
    build:
      context: ../../packages/artifact_proxy
      dockerfile: Dockerfile
    environment:
      - PORT=8080
    expose:
      - "8080"
    restart: unless-stopped

  cdn-cache:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - artifact-proxy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./overlay:/overlay:ro
      - ./experimental_hashes.map:/etc/caddy/experimental_hashes.map:ro
      - ./tls/listen-enabled.caddy:/etc/caddy/tls_listen.caddy:ro
      - ./tls:/etc/caddy/tls:ro
      - cdn-cache-data:/var/cache/caddy/cdn
    ports:
      - "8085:8080"
      - "8443:8443"
    restart: unless-stopped

volumes:
  cdn-cache-data:
