# Self-hosted Shorebird build-time CDN.
#
# Two services:
#   artifact-proxy : the first-party packages/artifact_proxy service. Given a
#                    Flutter engine artifact path it decides stock-vs-shorebird
#                    and 302-redirects to storage.googleapis.com. This is exactly
#                    what download.shorebird.dev runs.
#   cdn-cache      : a Caddy caching reverse proxy in front of artifact-proxy
#                    AND storage.googleapis.com. It rewrites the proxy's 302s
#                    back through itself and caches the final artifact bytes, so
#                    after one warm build everything is served from local disk.
#
# See selfhost/CDN_INDEPENDENCE.md for the full design and the cache.dart /
# shorebird_process.dart source patches needed to point the CLI here.
#
# Usage:
#   docker compose -f selfhost/cdn/docker-compose.cdn.yaml up --build
# Then (with the CDN_INDEPENDENCE.md source patches applied) build once to warm
# the cache:
#   export FLUTTER_STORAGE_BASE_URL=http://localhost:8085
#   export SHOREBIRD_STORAGE_BASE_URL=http://localhost:8085
#   export SHOREBIRD_STORAGE_BUCKET=download.shorebird.dev
#   shorebird release android   # first run pulls through, later runs hit cache

name: shorebird-cdn

services:
  artifact-proxy:
    build:
      # Build context is the artifact_proxy package (unmodified).
      context: ../../packages/artifact_proxy
      dockerfile: Dockerfile
    environment:
      - PORT=8080
    expose:
      - "8080"
    restart: unless-stopped

  cdn-cache:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - artifact-proxy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Locally built experimental engines, served before anything upstream.
      # Populated by selfhost/engine/overlay_publish.sh.
      - ./overlay:/overlay:ro
      # <expHash> -> <pinnedHash> fallback table, also written by that script.
      # Caddy reads it at startup, so recreate cdn-cache after publishing.
      - ./experimental_hashes.map:/etc/caddy/experimental_hashes.map:ro
      # TLS listener, off by default. Point this at tls/listen-enabled.caddy and
      # run tls/generate.sh to serve https as well as http. Needed because
      # Gradle 8+ refuses insecure Maven repositories, which is what
      # FLUTTER_STORAGE_BASE_URL becomes during an Android release build.
      - ./tls/listen-disabled.caddy:/etc/caddy/tls_listen.caddy:ro
      - ./tls:/etc/caddy/tls:ro
      - cdn-cache-data:/var/cache/caddy/cdn
    ports:
      # Host 8085 -> this is what you point FLUTTER_STORAGE_BASE_URL /
      # SHOREBIRD_STORAGE_BASE_URL at. (8080 is left free for code_push_server.)
      - "8085:8080"
      # https, serving the same content. Only listening when the TLS listener is
      # enabled; harmless to publish either way.
      - "8443:8443"
    restart: unless-stopped

volumes:
  cdn-cache-data:
