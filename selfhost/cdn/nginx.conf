# cspell:words sendfile epath mabi mfile mext sbucket sfile
#
# Self-hosted Shorebird CDN cache.
#
# Purpose: mirror the build-time artifacts that the Shorebird CLI + the vended
# Flutter tool would otherwise fetch from download.shorebird.dev / GCS, so that
# after one warm-up build every artifact is served from local disk. It also
# serves LOCALLY BUILT experimental engines from an overlay (see below).
#
# Topology (see selfhost/CDN_INDEPENDENCE.md):
#   client -> [this nginx] -> /overlay (local experimental build) if present
#                          -> artifact_proxy -> 302 to storage.googleapis.com
#                          -> (rewritten) /gcs/... back through this nginx -> GCS (cached)
#
# Flow A (Flutter engine): FLUTTER_STORAGE_BASE_URL -> this nginx.
# Flow B (CLI cache: patch/aot-tools): SHOREBIRD_STORAGE_BASE_URL -> this nginx,
#   SHOREBIRD_STORAGE_BUCKET=download.shorebird.dev (requires the cache.dart
#   patch documented in CDN_INDEPENDENCE.md §6).
#
# ---------------------------------------------------------------------------
# EXPERIMENTAL ENGINE OVERLAY
#
# An engine we build ourselves gets its own 40-hex engine hash so it can never
# be confused with, or overwrite, the supported pin in
# selfhost/compatibility.yaml. But only a handful of artifacts actually differ:
# the Android arm64 engine binaries. The rest of the set is identical to the
# pinned revision, and some of it (the macOS/Windows host gen_snapshot) cannot
# even be produced on a Linux build host.
#
# So for an experimental hash:
#   1. serve the file from /overlay if it is there (that is our build), else
#   2. if the path is one the overlay OWNS -> 404, loudly. Never substitute
#      stock bytes for an artifact we were supposed to have rebuilt.
#   3. otherwise rewrite the hash to the pinned revision and serve it the normal
#      way — from the already-warm cache.
#
# `experimental_hashes.map` (written by selfhost/engine/overlay_publish.sh) is
# what makes a hash "experimental": it maps <expHash> -> <pinnedHash>. A hash
# not in that file behaves exactly as it did before this overlay existed.
# ---------------------------------------------------------------------------

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;

  # Immutable, revision-scoped artifacts: safe to cache long-term. 20g holds a
  # couple of engine revisions; bump max_size for more.
  proxy_cache_path /var/cache/nginx/cdn
    levels=1:2 keys_zone=cdn:100m max_size=20g inactive=365d use_temp_path=off;

  # Needed to resolve storage.googleapis.com / the artifact-proxy service name
  # at request time.
  resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

  # Follow the artifact-proxy 302 internally would require the client to
  # re-request; we instead rewrite Location to a relative /gcs/ path (below) so
  # the client comes back through us and we cache the final bytes.
  proxy_cache_key "$scheme$request_method$host$uri";
  proxy_http_version 1.1;

  log_format cdn '$remote_addr "$request" $status '
                 'cache=$upstream_cache_status must_be_local=$must_be_local '
                 'stock=$stock_engine_hash ->$upstream_addr';

  # The engine hash carried by the request path, whatever flow it belongs to.
  map $uri $engine_hash {
    default "";
    "~^/flutter_infra_release/flutter/([0-9a-f]{40})/"                      $1;
    "~^/download\.flutter\.io/io/flutter/[^/]+/1\.0\.0-([0-9a-f]{40})/"     $1;
    "~^/[^/]+/shorebird/([0-9a-f]{40})/"                                    $1;
  }

  # Experimental hash -> the pinned hash its non-rebuilt artifacts come from.
  # Empty for every ordinary revision, which is what keeps the pre-existing
  # behavior byte-identical.
  map $engine_hash $stock_engine_hash {
    default "";
    include /etc/nginx/experimental_hashes.map;
  }

  # Artifacts an experimental build is REQUIRED to provide itself. A miss on
  # these is a 404, never a silent fall back to stock bytes. Keep in sync with
  # what selfhost/engine/overlay_publish.sh copies.
  #
  # Deliberately NOT owned, and therefore stock by design:
  #   android-arm64-release/{darwin-x64,windows-x64}.zip — host gen_snapshot for
  #   macOS/Windows, which a Linux build host cannot produce.
  # NOTE the scope: this is NOT just "the files we rebuilt". Dart version-locks
  # snapshots against an MD5 over runtime/vm sources (tools/make_version.py's
  # VM_SNAPSHOT_FILES), so ANY artifact carrying VM-generated code or a VM-coupled
  # tool must come from the same tree as our libflutter.so. Letting one of these
  # fall back to the pinned revision produces an app that installs fine and then
  # dies at launch with "Wrong full snapshot version" — a far worse failure than a
  # 404 during the build. Learned the hard way, on device.
  map $uri $overlay_owned {
    default 0;

    # our engine + the host gen_snapshot that must match it
    "~^/flutter_infra_release/flutter/[0-9a-f]{40}/android-arm64-release/"  1;

    # The HOST toolchain archive: frontend_server_aot, gen_snapshot, isolate
    # snapshots. This is the one that bit hardest — falling back to the pinned
    # copy meant THEIR frontend_server produced kernel that OUR gen_snapshot
    # rejected ("Unexpected tag 4 (Field)"). Comes from out/host_debug.
    "~^/flutter_infra_release/flutter/[0-9a-f]{40}/(linux|darwin|windows)-(x64|arm64)/artifacts\.zip$"  1;

    # VM-coupled host toolchain: kernel platform dill, Dart SDK, AOT linker
    # Only the _product variant: that is the platform dill AOT release builds
    # consume, and it comes from out/host_release. The plain flutter_patched_sdk.zip
    # is the debug/JIT dill produced only by a host_debug build, which we do not
    # do — and it is safe to serve the pinned one, because kernel is versioned by
    # Dart's KERNEL FORMAT (identical at 3.12.2), not by the VM snapshot hash, and
    # its dart:ui comes from the same engine source we build.
    "~^/flutter_infra_release/flutter/[0-9a-f]{40}/flutter_patched_sdk_product\.zip$"  1;
    "~^/flutter_infra_release/flutter/[0-9a-f]{40}/dart-sdk-[a-z0-9-]+\.zip$"            1;
    # NOT aot-tools.dill: we cannot build it. It lives in pkg/aot_tools inside
    # Shorebird's private Dart fork, which vanilla does not have. It is the AOT
    # linker, used only by the Apple patchers, so Android never invokes it and
    # serving the pinned copy is harmless. This is the concrete artifact that
    # blocks iOS on a self-built engine.

    # Maven modules: a proxy CANNOT hash-rewrite these, because Gradle validates
    # the version inside the .pom body ("inconsistent module metadata found").
    # Every module must be materialized locally under our hash, including the ABIs
    # we did not build ourselves.
    "~^/download\.flutter\.io/io/flutter/"                                              1;
  }

  # Ownership only bites for an EXPERIMENTAL hash. Without this, an ordinary
  # pinned-revision request for an arm64 artifact would 404 instead of passing
  # through to the mirror — i.e. the overlay would break the plain cache.
  map "$overlay_owned:$stock_engine_hash" $must_be_local {
    default 0;
    "~^1:[0-9a-f]{40}$" 1;
  }

  upstream artifact_proxy_up {
    server artifact-proxy:8080;
  }

  server {
    listen 8080;
    access_log /dev/stdout cdn;

    # Keep rewritten Locations relative. `proxy_redirect` below turns
    # artifact_proxy's `https://storage.googleapis.com/...` 302 into `/gcs/...`,
    # but nginx turns a relative Location back into an absolute one using its own listen port —
    # emitting `http://<host>:8080/gcs/...` even when the caller reached us on
    # the published host port (8085 here). Clients on the host then followed the
    # redirect to the wrong port and Flow A never cached anything. Leaving the
    # Location relative lets it resolve against whatever host:port the client
    # actually used, so the same config works published on 8085, in-network on
    # 8080, or behind TLS on 443.
    absolute_redirect off;

    # Serve experimental builds straight off disk. `root /overlay` + try_files
    # means the lookup is /overlay$uri, so the overlay mirrors the store's key
    # layout exactly.
    root /overlay;

    # ---- Cached mirror of Google Cloud Storage --------------------------
    # `^~` so no regex location below can steal these: this is where the
    # redirected engine bytes land and it must stay a plain passthrough.
    location ^~ /gcs/ {
      # Host in a VARIABLE on purpose. With a literal hostname nginx resolves it
      # once at startup using the system resolver, which includes AAAA records —
      # and if the container has no IPv6 egress every request burns retries on
      # unreachable v6 addresses and intermittently 502s (Gradle's parallel HEADs
      # hit this hard). A variable defers resolution to the `resolver` directive
      # above, where ipv6=off actually takes effect.
      set $gcs_host storage.googleapis.com;
      rewrite ^/gcs/(.*)$ /$1 break;
      proxy_pass https://$gcs_host;
      # Key on the ORIGINAL uri so the rewrite above does not invalidate
      # everything cached before this change.
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_set_header Host storage.googleapis.com;
      proxy_ssl_server_name on;
      proxy_cache cdn;
      proxy_cache_valid 200 206 365d;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # ---- Flow A: Flutter engine artifacts -------------------------------
    # Overlay first; otherwise route through artifact_proxy (which decides stock
    # vs shorebird-modified and 302s to storage.googleapis.com), rewriting an
    # experimental hash to the pinned one on the way.
    location ~ "^/flutter_infra_release/flutter/(?<eh>[0-9a-f]{40})/(?<epath>.*)$" {
      try_files $uri @engine_stock;
      add_header X-Overlay hit always;
      add_header X-Engine-Hash $eh always;
    }

    location @engine_stock {
      if ($must_be_local) { return 404; }
      set $target_hash $eh;
      if ($stock_engine_hash != "") { set $target_hash $stock_engine_hash; }
      proxy_pass http://artifact_proxy_up/flutter_infra_release/flutter/$target_hash/$epath$is_args$args;
      proxy_set_header Host $host;
      proxy_redirect https://storage.googleapis.com/ /gcs/;
      proxy_redirect http://storage.googleapis.com/  /gcs/;
      # Do not cache the 302 itself; the bytes are cached at /gcs/.
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # ---- Flow A (Maven): the arm64_v8a_release jar Gradle resolves -------
    # The hash appears twice here — in the version directory AND in the file
    # name — so both are rebuilt from captures rather than string-substituted.
    location ~ "^/download\.flutter\.io/io/flutter/(?<mabi>[^/]+)/1\.0\.0-(?<meh>[0-9a-f]{40})/(?<mfile>[^/]+)-1\.0\.0-[0-9a-f]{40}\.(?<mext>[A-Za-z0-9.\-]+)$" {
      try_files $uri @maven_stock;
      add_header X-Overlay hit always;
      add_header X-Engine-Hash $meh always;
    }

    location @maven_stock {
      if ($must_be_local) { return 404; }
      set $target_hash $meh;
      if ($stock_engine_hash != "") { set $target_hash $stock_engine_hash; }
      proxy_pass http://artifact_proxy_up/download.flutter.io/io/flutter/$mabi/1.0.0-$target_hash/$mfile-1.0.0-$target_hash.$mext$is_args$args;
      proxy_set_header Host $host;
      proxy_redirect https://storage.googleapis.com/ /gcs/;
      proxy_redirect http://storage.googleapis.com/  /gcs/;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # ---- Flow A fallback: engine paths without a recognizable hash -------
    location ~ ^/(flutter_infra_release|download\.flutter\.io)/ {
      proxy_pass http://artifact_proxy_up;
      proxy_set_header Host $host;
      proxy_redirect https://storage.googleapis.com/ /gcs/;
      proxy_redirect http://storage.googleapis.com/  /gcs/;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # ---- Flow B: CLI cache artifacts ------------------------------------
    # cache.dart (patched) hits us as:
    #   http://<host>/download.shorebird.dev/shorebird/<rev>/patch-*.zip
    # and the manifest as:
    #   .../shorebird/<rev>/artifacts_manifest.yaml
    # Overlay first (an experimental prefix carries its own manifest and
    # provenance), else straight to GCS under the pinned hash.
    location ~ "^/(?<sbucket>[^/]+)/shorebird/(?<seh>[0-9a-f]{40})/(?<sfile>.*)$" {
      try_files $uri @shorebird_stock;
      add_header X-Overlay hit always;
      add_header X-Engine-Hash $seh always;
    }

    location @shorebird_stock {
      set $target_hash $seh;
      if ($stock_engine_hash != "") { set $target_hash $stock_engine_hash; }
      proxy_pass https://storage.googleapis.com/$sbucket/shorebird/$target_hash/$sfile$is_args$args;
      proxy_set_header Host storage.googleapis.com;
      proxy_ssl_server_name on;
      proxy_cache cdn;
      proxy_cache_valid 200 206 365d;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # ---- Raw GCS passthrough --------------------------------------------
    location / {
      set $gcs_host storage.googleapis.com;   # variable => resolver + ipv6=off apply
      proxy_pass https://$gcs_host;
      proxy_set_header Host storage.googleapis.com;
      proxy_ssl_server_name on;
      proxy_cache cdn;
      proxy_cache_valid 200 206 365d;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
