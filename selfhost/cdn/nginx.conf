# Self-hosted Shorebird CDN cache.
#
# Purpose: mirror the build-time artifacts that the Shorebird CLI + the vended
# Flutter tool would otherwise fetch from download.shorebird.dev / GCS, so that
# after one warm-up build every artifact is served from local disk.
#
# Topology (see selfhost/CDN_INDEPENDENCE.md):
#   client -> [this nginx] -> artifact_proxy -> 302 to storage.googleapis.com
#                          -> (rewritten) /gcs/... back through this nginx -> GCS (cached)
#
# Flow A (Flutter engine): FLUTTER_STORAGE_BASE_URL -> this nginx.
# Flow B (CLI cache: patch/aot-tools): SHOREBIRD_STORAGE_BASE_URL -> this nginx,
#   SHOREBIRD_STORAGE_BUCKET=download.shorebird.dev (requires the cache.dart
#   patch documented in CDN_INDEPENDENCE.md §6).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Immutable, revision-scoped artifacts: safe to cache long-term. 20g holds a
  # couple of engine revisions; bump max_size for more.
  proxy_cache_path /var/cache/nginx/cdn
    levels=1:2 keys_zone=cdn:100m max_size=20g inactive=365d use_temp_path=off;

  # Needed to resolve storage.googleapis.com / the artifact-proxy service name
  # at request time.
  resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

  # Follow the artifact-proxy 302 internally would require the client to
  # re-request; we instead rewrite Location to a relative /gcs/ path (below) so
  # the client comes back through us and we cache the final bytes.
  proxy_cache_key "$scheme$request_method$host$uri";
  proxy_http_version 1.1;

  log_format cdn '$remote_addr "$request" $status '
                 'cache=$upstream_cache_status ->$upstream_addr';

  upstream artifact_proxy_up {
    server artifact-proxy:8080;
  }

  server {
    listen 8080;
    access_log /dev/stdout cdn;

    # Keep rewritten Locations relative. `proxy_redirect` below turns
    # artifact_proxy's `https://storage.googleapis.com/...` 302 into `/gcs/...`,
    # but nginx turns a relative Location back into an absolute one using its own listen port —
    # emitting `http://<host>:8080/gcs/...` even when the caller reached us on
    # the published host port (8085 here). Clients on the host then followed the
    # redirect to the wrong port and Flow A never cached anything. Leaving the
    # Location relative lets it resolve against whatever host:port the client
    # actually used, so the same config works published on 8085, in-network on
    # 8080, or behind TLS on 443.
    absolute_redirect off;

    # ---- Flow A: Flutter engine artifacts -------------------------------
    # Route engine paths through artifact_proxy (which decides stock vs
    # shorebird-modified and 302s to storage.googleapis.com). Rewrite that
    # upstream Location to a relative /gcs/ path so the client re-enters here
    # and we cache the real bytes on the next hop.
    location ~ ^/(flutter_infra_release|download\.flutter\.io)/ {
      proxy_pass http://artifact_proxy_up;
      proxy_set_header Host $host;
      proxy_redirect https://storage.googleapis.com/ /gcs/;
      proxy_redirect http://storage.googleapis.com/  /gcs/;
      # Do not cache the 302 itself; the bytes are cached at /gcs/.
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # ---- Cached mirror of Google Cloud Storage --------------------------
    # Serves the redirected Flutter engine bytes AND (via the / fallback
    # below) the Shorebird CLI-cache artifacts. Both are immutable GCS objects.
    location /gcs/ {
      proxy_pass https://storage.googleapis.com/;
      proxy_set_header Host storage.googleapis.com;
      proxy_ssl_server_name on;
      proxy_cache cdn;
      proxy_cache_valid 200 206 365d;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # ---- Flow B fallback + raw GCS passthrough --------------------------
    # cache.dart (patched) hits us as:
    #   http://<host>/download.shorebird.dev/shorebird/<rev>/patch-*.zip
    # and the manifest as:
    #   http://<host>/download.shorebird.dev/shorebird/<rev>/artifacts_manifest.yaml
    # Proxy straight to GCS and cache the bytes.
    location / {
      proxy_pass https://storage.googleapis.com;
      proxy_set_header Host storage.googleapis.com;
      proxy_ssl_server_name on;
      proxy_cache cdn;
      proxy_cache_valid 200 206 365d;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
