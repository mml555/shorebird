# Default: no TLS listener. The mirror serves plain http only, exactly as before.
#
# Mounted at /etc/nginx/tls_listen.conf by docker-compose.cdn.yaml. Switch to
# listen-enabled.conf (and generate certs) to add https. Kept as two files rather
# than one conditional because nginx has no `if` at the server level, and an
# ssl_certificate pointing at a missing file makes nginx refuse to start.
