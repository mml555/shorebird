# TLS listener for the mirror. Mount this as /etc/nginx/tls_listen.conf and mount
# the certs from selfhost/cdn/tls/ to enable https.
#
# Requires selfhost/cdn/tls/generate.sh to have been run: nginx will refuse to
# start if these files are absent.
listen 8443 ssl;
http2 on;

ssl_certificate     /etc/nginx/tls/fullchain.crt;
ssl_certificate_key /etc/nginx/tls/server.key;

# TLS 1.2 is kept because the JVM Gradle runs on may negotiate it; 1.3 alone is
# fine for Dart but has caused handshake failures on older JDKs.
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:cdn_tls:1m;
ssl_session_timeout 10m;
