# Runners start only after the egress table and the proxy are up. Wants=, not
# Requires=: re-applying the table or restarting squid must not restart a runner
# that is running a job. gha-prep refuses to start a runner while the table is missing.
[Unit]
Wants=gha-egress.service squid.service
After=gha-egress.service squid.service
