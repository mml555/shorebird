# cspell:words productionization localsend
# ROUTE-B-PRODUCTIONIZATION-1 — the supported Route B iOS stack.
#
# One record. Future upgrades diff against this file rather than against a
# conversation. Every identity below was verified in place, not transcribed:
# the selector chain was read out of the artifacts, and the cell was audited.
#
# Regenerate the checks with:
#   selfhost/engine/route_b/verify_supported_state.sh

schema: route-b-supported-state/1
qualified: 2026-09-03

lineage:
  # The revision this stack was QUALIFIED at. It cannot name the commit that
  # writes it, so the verifier requires it to be an ancestor of (or equal to)
  # HEAD rather than equal to it. Commits after it must not change product code
  # without re-qualification; the repair commit that follows adds verification
  # only.
  # Re-qualified 2026-09-03 (FLUTTER-STORAGE-AUTHORITY-1). The previous
  # identity was cba35016 / tree e3ebed51…, and it is superseded rather than
  # deleted so a reader can tell WHICH product tree an older evidence document
  # was measured against:
  #   superseded: cli_revision cba3501615f80aa2c0f0c631366639899b0a7241
  #               packages_shorebird_cli e3ebed51cabcc05423b85b4ea4b146fc734a5413
  # What moved: `ArtifactOrigin` became the single artifact-storage authority,
  # and the one call that downloads engine artifacts stopped escaping it. The
  # SELECTORS did not move — same Flutter revision, same cell, same compiler
  # archive, same analyzer, same updater — so this re-qualifies the producer
  # tree, not the toolchain.
  cli_revision: 5920a8bf0a992618bfe7d1680c5439abd7a4f55f
  cli_contains: 6b4f6c422bab55143ef04c8f43f92015ee3b3feb   # private-name resolution for constructions
  flutter_selector: e64eb0af52e1c43c3b21a39556d789538d0df9b3   # F4
  # MOVED 2026-09-04 by ANDROID-FINAL-STACK-2, from
  # cd848320d605ff8af5060cabf9a8d1b35853f752. The predecessor is NOT deleted --
  # it is the cell every iOS qualification in this record was measured against,
  # and it is retained under `cells:` below with that role stated. What changed
  # is that the supported cell now also carries Android, and the Android
  # release -> patch -> physical activation sequence was qualified against it.
  #
  # The 16 macOS/iOS members are the BYTE-IDENTICAL bytes cd848320 published, so
  # this move does not disturb any iOS claim in this file; it widens the cell.
  cell_address: f85251f344600ae08196925a174e9cff8f0ff18e
  compiler_archive_sha256: 7975b27c724240e720f77d338c80fcace5296148bd78c17588cee1b089e3fb22
  compiler_archive_bytes: 19256864
  analyzer_sha256: 67741a082fcde5a9e2067fdfad1deb7ad69cb89b8d23aba78ed31b5afb6c2f5d
  updater_revision: af6e842ccf87

  # THE QUALIFIED CLI PRODUCT TREE, as git tree objects at cli_revision.
  #
  # Ancestry is not enough. A descendant can change route_b_producer.dart, leave
  # flutter.version alone, keep a clean checkout, and still satisfy "cli_revision
  # is an ancestor of HEAD" -- while the patch producer in use is no longer the
  # qualified one. That is precisely the drift this record exists to catch, so it
  # is the BYTES that answer, not a judgement about whether a commit was
  # "verification-only".
  #
  # Deliberately whole-package, tests included: a change to the producer's tests
  # is a change to what "qualified" was established against. Re-qualifying is a
  # matter of re-running the verifier and updating two lines here.
  cli_product_tree:
    packages_shorebird_cli: 6c76e79a3ad1c86658a41b144dececb07ff5d3ca
    bin_internal: 67bb0a85a83177ad8afcf1765403e42a913e0377
  producer_engine_revision: dfa2b24ac38477f3705ff0357530f33fe09474b8   # built in; NOT the address
  fallback_engine_revision: 69f9831c360d9152862ec3897c67fb09ae843f3b
  dart_revision: 9e8c898a4d2a3b4d0f9c76b973a199859bb1b40c

# CELLS PUBLISHED BY THIS PROGRAMME, and what each one's identity actually
# covers. `lineage.cell_address` above names the SUPPORTED cell and is
# unchanged; this block exists because a second cell now exists and a reader
# must be able to tell them apart without reading a conversation.
cells:
  cd848320d605ff8af5060cabf9a8d1b35853f752:
    scope: macos-ios
    members: 16
    status: >-
      SUPERSEDED 2026-09-04 — the PREVIOUS iOS-qualified cell. Retained, not
      deleted: every iOS qualification recorded in this file was measured
      against it, so an older evidence document naming this address is still
      readable. Its 16 members are byte-identical to 14 of the successor's plus
      engine_stamp.json in canonical form, so nothing in the iOS record is
      invalidated by the move.
    producer_lineage: dfa2b24ac38477f3705ff0357530f33fe09474b8
    android: none published; a release-mode Android request 404s by design

  f85251f344600ae08196925a174e9cff8f0ff18e:
    scope: macos-ios-android
    members: 30
    minted: 2026-09-04 (ANDROID-CELL-SUPPLY-2)
    status: SUPPORTED — this is lineage.cell_address (moved here 2026-09-04)
    # `proven` below is the RELEASE-side evidence from the mint
    # (ANDROID-CELL-SUPPLY-2); `physically_qualified` is the device evidence
    # that licensed the selector move (ANDROID-FINAL-STACK-2). Both are current.
    #
    # This comment previously said an Android PATCH had not been qualified and
    # that the cell was therefore not the supported stack. That was true when
    # the cell was minted and stopped being true on 2026-09-04; it is replaced
    # rather than annotated, because a status line that contradicts the
    # authoritative fields below is worse than no comment at all.
    proven: >-
      `shorebird release android --artifact apk` exit 0 from an empty engine
      cache and an empty Gradle home; the 24-object measured workflow closure
      resolved as 14 identity-bearing from this cell and 10 cache/transport via
      fallback; zero identity requests answered by a redirect; all three ABIs in
      the APK carry OUR engine revision and none carries the fallback's.
    physically_qualified: >-
      2026-09-04 (ANDROID-FINAL-STACK-2) on a wired CPH2551. Fresh release ->
      ordinary bidiff patch -> self-hosted discovery/download -> STAGED BUT NOT
      EXECUTING -> restart -> patched code executing. Markers read mechanically
      from the accessibility tree and corroborated by screenshots; the updater
      reported installs=1, install_failures=0, update_failures=0 for a single
      client. See evidence/android-final-stack-2/RESULT.md.
    # PROVENANCE IS PER-PLATFORM. There is deliberately NO single
    # producer_engine_revision here: 16 of the 30 members are the byte-identical
    # bytes cd848320 published, produced by dfa2b24a, and relabelling them with
    # the Android producer would be a false claim about 16 artifacts.
    producer_lineage:
      macos_ios_members: dfa2b24ac38477f3705ff0357530f33fe09474b8
      android_members: f1a59b8a1609c51397601c36d586ad7763d57153
      android_parent: dfa2b24ac38477f3705ff0357530f33fe09474b8
      android_delta: >-
        one file, engine/src/flutter/lib/snapshot/BUILD.gn — an applicability
        gate so analyze_snapshot is not demanded for a 32-bit target Dart
        declines to build it for. 76 changed lines. Reviewable at
        selfhost/engine/route_b/patches/0001-gate-macos-analyze-snapshot-applicability.patch
      # SOURCE DURABILITY. A cell whose executable members were produced by a
      # commit that exists on one machine is authenticated but not
      # repository-closed: nobody can rebuild or review the bytes. Both
      # producers are on the durable engine fork, and each is advertised at a
      # ref that points AT the commit -- reachability is not enough, because a
      # force-push takes reachability away and a ref pointing at the commit does
      # not. Checked by verify_engine_producer_durable.sh, which
      # verify_supported_state.sh now runs.
      durable_remote: https://github.com/mml555/shorebird-flutter.git
      durable_refs:
        android_members:
          - refs/heads/route-b-2c-android
          - refs/tags/acs2-android-producer      # annotated; immutable intent
        macos_ios_members:
          - refs/heads/route-b-2c-candidate
          - refs/tags/acs2-macos-ios-producer    # annotated; immutable intent
      durability_strength: >-
        the Android producer is checked at FULL strength — the published diff
        must equal the banked patch, so a rebuilt or amended commit with the
        same message fails. The macOS/iOS producer is upstream-derived and this
        repo banks no patch for it, so the honest claim there is reachability.
    member_provenance:
      byte_identical_to_cd848320: 14
      identical_in_canonical_form: 1     # engine_stamp.json, template vs rendered
      regenerated: 1                     # artifacts_manifest.yaml, target ios -> ios+android
      newly_built_by_us: 14
    fallback_engine_revision: 69f9831c360d9152862ec3897c67fb09ae843f3b
    evidence: evidence/android-cell-supply-2/

# The chain a build actually walks. Each link was read from the artifact itself.
selector_chain:
  links:
    - "CLI bin/internal/flutter.version        -> e64eb0af52e1c43c3b21a39556d789538d0df9b3"
    - "F4  bin/internal/engine.version         -> f85251f344600ae08196925a174e9cff8f0ff18e"
    - "cell f85251f3 route-b-compiler-darwin-arm64.zip -> 7975b27c…fb22"
  # The compiler archive digest is UNCHANGED across the move, and that is the
  # point: it is one of the 14 members carried over byte-for-byte, so the Route
  # B compiler the iOS qualification was performed with is the same file.
  #   superseded: F4 engine.version -> cd848320d605ff8af5060cabf9a8d1b35853f752
  # F4's engine.version is a COMMITTED blob at F4's HEAD and its tree is clean.
  # No uncommitted engine.version is part of this lineage.
  engine_version_committed: true

analysis_versions:
  known: [11, 12, 13]
  # A document declaring anything else is REFUSED. A missing v11 field is never
  # read as an empty list -- absent, empty and populated are three states.
  unknown_version_behaviour: refuse
  v12_adds: privateConstructions
  v13_adds: releasePrivateConstructions

retention_policy:
  policy: p2
  # Private classes are retained so their members are patch-targetable;
  # construction is withheld separately and granted per constructor.
  constructor_grants: derived automatically from the release's own census
  blanket_constructor_grants: rejected   # measured +8.35% AOT at 200 classes

supported:
  - instance method body replacement, lowered to a top-level function
  - exact narrow-v1 `super.method()`
  - private member access where the release manifest retained that exact member
  - private construction, EXACT constructor, where the RELEASE version of that
    same method already constructed it and the manifest retained it

unsupported:
  # Refused clearly, not silently. Each was measured, not assumed.
  - candidate-introduced private construction (a constructor the released
    version of that same method never used, even if globally retained)
  - method tear-offs
  - named / optional-positional parameter shape changes
  - private non-construction references (private methods, private top-levels)
    that the manifest did not retain
  - blanket private-constructor access
  - receiver rewrites the lowering cannot express

product_surfaces:
  # WHICH INTEGRATION SHAPES this stack supports, as distinct from which Dart
  # constructs. Recorded because "unsupported construct" and "unsupported
  # surface" have different remediations and collapsing them hides the second.
  standalone_flutter_app:
    ios: SUPPORTED — physically qualified, see physical_device_qualification
    android:
      status: SUPPORTED — physically qualified 2026-09-04 against cell f85251f3…
      qualified: 2026-09-04 (ANDROID-FINAL-STACK-2)
      cell: f85251f344600ae08196925a174e9cff8f0ff18e
      # WHAT WAS PROVEN, in one line each, because "SUPPORTED" is the strongest
      # word in this file and it should be readable without opening the lane
      # document:
      #   release  — `shorebird release android --artifact apk` exit 0 from an
      #              empty engine cache and an empty Gradle home; all 14 Android
      #              identity members served from the cell, none via fallback;
      #              all three packaged libflutter.so carry OUR producer
      #              revision and not the fallback's
      #   patch    — ordinary bidiff producer, patch 1, three artifacts each
      #              ~0.2% of the release artifact they patch; the AOT linker
      #              artifact 404'd throughout and no Route B compiler was
      #              fetched
      #   device   — CPH2551: release marker, then STILL the release marker
      #              after download/install, then the patched marker only after
      #              a restart; installs=1, install_failures=0,
      #              update_failures=0, one client
      # The middle observation is the load-bearing one: without it a changed
      # marker is equally consistent with a rebuilt install.
      what_is_not_covered: >-
        iOS Add-to-App (separately UNSUPPORTED, below), Android app-bundle
        distribution through the Play Store, and any Android ABI beyond the
        three shipped (armeabi-v7a, arm64-v8a, x86_64).
      evidence: evidence/android-final-stack-2/RESULT.md
      supporting_evidence: evidence/android-cell-supply-2/RESULT.md

      # HISTORY, nested so it cannot be read as current and cannot collide with
      # the keys above.
      #
      # A DEFECT THIS RESTRUCTURE FIXES, recorded because it is the more serious
      # of the two problems here. The 2026-09-04 wording pass added a current
      # `evidence:` key while leaving the older `evidence:` line at the SAME
      # level, so the mapping had a duplicate key and the last one won -- the
      # authoritative `evidence` for a SUPPORTED surface silently resolved to
      # the document of the lane that had measured it UNSUPPORTED. A YAML
      # duplicate key does not error, it just quietly takes the wrong value,
      # which is exactly why the record's own machine-readability check exists.
      # Two forward-looking keys (`to_support`, `remaining_for_support`) were
      # also left at the authoritative level, where they contradicted the status
      # line above them.
      superseded_assessment:
        status: UNSUPPORTED ON THIS CELL
        assessed: 2026-09-03 (ANDROID-FINAL-STACK-1)
        cell: cd848320d605ff8af5060cabf9a8d1b35853f752
        evidence: evidence/android-final-stack-1/RESULT.md
        # Still true OF THAT CELL, and that is why the move took a new cell
        # rather than a fix: `shorebird release android` cannot build against
        # cd848320 because the cell publishes NO Android engine artifacts, the
        # pinned Flutter's engine.version IS the cell, and
        # `android-arm64-release/` is in the CDN's @must_be_local matcher — so
        # the 404 is a deliberate protection, not a gap to route around.
        finding: >-
          the Android release → patch → discovery → download → physical
          activation path was already sound on that day's CLI, producer and
          control plane, proven end to end on a STOCK engine (309dd657…) with an
          on-screen marker change on a physical CPH2551. What was missing was a
          cell that served Android engine artifacts. Android patching is bidiff;
          it needs neither Route B nor the AOT linker.
        what_it_asked_for: >-
          publish and qualify Android engine artifacts for the cell (at minimum
          android-arm64-release, which @must_be_local requires be genuinely
          ours). DONE 2026-09-04 on cell f85251f3…, for all three release ABIs
          and the four Maven modules.
        # An earlier version of this row read "SUPPORTED — see ANDROID rows in
        # WORKFLOW_CERTIFICATION.md", written during the ADD-TO-APP-1 wording
        # pass. That was an over-claim: the re-certification against the final
        # stack is entirely iOS (rows 1 and 7 via 6F/6G, the rest carried
        # forward), and ANDROID-FINAL-STACK-1 then measured the opposite.

  ios_add_to_app:
    status: UNSUPPORTED
    assessed: 2026-09-03 (ADD-TO-APP-1)
    # Assessed, not implemented. Four independent blockers, measured:
    #  1 the cell publishes a device-only Flutter.xcframework, so
    #    `flutter build ios-framework` cannot assemble the module's
    #    App.xcframework (its simulator slice builds against the debug engine)
    #  2 the control plane refuses to ACTIVATE a release whose only arch is
    #    `xcframework` (Api._requiredArchs is the full-app set)
    #  3 Route B is not implemented for ios-framework at all
    #  4 an ios-framework CODE patch needs Shorebird's AOT linker, which this
    #    stack does not have
    note: assets-only behaviour does NOT qualify as Route B code push — it
      carries no code. Implementing this is a SECOND Route B product surface
      for embedded Flutter, not a simulator slice plus a small API fix.
    evidence: evidence/addtoapp1/RESULT.md
  android_add_to_app_aar:
    status: UNSUPPORTED
    assessed: 2026-09-03 (ADD-TO-APP-1, control-plane half only)
    note: an `aar` release is refused activation for the same reason as
      `xcframework` (Api._requiredArchs gates android on {aab}). The build and
      patch halves were NOT assessed.
    evidence: evidence/addtoapp1/RESULT.md

operational_requirements:
  # Product handles it, refuses clearly, or it is named here. No tribal knowledge.
  local_network_permission:
    applies_to: iOS with a LAN HTTP base_url
    symptom_if_missing: updater fetches nothing; no request reaches the server;
      app stays on the release build with no error
    status: DOCUMENTED (WORKFLOW_CERTIFICATION.md §0); observed again in 6G
  published_ios_engine_dir:
    var: SHOREBIRD_PUBLISHED_IOS_ENGINE_DIR
    role: coherence authority for the iOS engine a release is built against
    status: DOCUMENTED
  selfhost_endpoint_authority:
    role: bundled flutter_assets/shorebird.yaml base_url is what the device uses
    status: DOCUMENTED; fail-closed on mismatch
  older_cells:
    note: cells minted before the constructor census carry no grants, so they are
      strictly narrower. Not retrofitted; they remain historical evidence.
    status: DOCUMENTED
  control_plane_jwt_issuer:
    status: KNOWN DEBT — pre-existing control-plane configuration, not a Route B defect
  control_plane_request_logging:
    status: KNOWN GAP — cps-ios emits no HTTP request log, so "absent from the log"
      is not evidence of anything. Do not build checks on it.

