      2026-09-04 (ANDROID-FINAL-STACK-2) on a wired CPH2551. Fresh release ->
      ordinary bidiff patch -> self-hosted discovery/download -> STAGED BUT NOT
      EXECUTING -> restart -> patched code executing. Markers read mechanically
