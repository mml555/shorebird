# The chain a build actually walks. Each link was read from the artifact itself.
selector_chain:
  links:
    - "CLI bin/internal/flutter.version        -> e64eb0af52e1c43c3b21a39556d789538d0df9b3"
    - "F4  bin/internal/engine.version         -> f85251f344600ae08196925a174e9cff8f0ff18e"
    - "cell f85251f3 route-b-compiler-darwin-arm64.zip -> 7975b27c…fb22"
  # The compiler archive digest is UNCHANGED across the move, and that is the
  # point: it is one of the 14 members carried over byte-for-byte, so the Route
  # B compiler the iOS qualification was performed with is the same file.
  #   superseded: F4 engine.version -> cd848320d605ff8af5060cabf9a8d1b35853f752
  # F4's engine.version is a COMMITTED blob at F4's HEAD and its tree is clean.
  # No uncommitted engine.version is part of this lineage.
  engine_version_committed: true

analysis_versions:
  known: [11, 12, 13]
  # A document declaring anything else is REFUSED. A missing v11 field is never
  # read as an empty list -- absent, empty and populated are three states.
  unknown_version_behaviour: refuse
  v12_adds: privateConstructions
  v13_adds: releasePrivateConstructions

retention_policy:
  policy: p2
  # Private classes are retained so their members are patch-targetable;
  # construction is withheld separately and granted per constructor.
  constructor_grants: derived automatically from the release's own census
  blanket_constructor_grants: rejected   # measured +8.35% AOT at 200 classes

supported:
  - instance method body replacement, lowered to a top-level function
  - exact narrow-v1 `super.method()`
  - private member access where the release manifest retained that exact member
  - private construction, EXACT constructor, where the RELEASE version of that
    same method already constructed it and the manifest retained it

unsupported:
  # Refused clearly, not silently. Each was measured, not assumed.
  - candidate-introduced private construction (a constructor the released
    version of that same method never used, even if globally retained)
  - method tear-offs
  - named / optional-positional parameter shape changes
  - private non-construction references (private methods, private top-levels)
    that the manifest did not retain
  - blanket private-constructor access
  - receiver rewrites the lowering cannot express

# WHERE THE CELL BYTES COME FROM. The descriptor below authenticates 30 member
# digests, but a digest is not a byte source: SELFHOST-CLEANROOM-1 found all 30
# absent from a fresh clone, with no release asset and no recorded location, and
# established that rebuilding is not an alternative because the address is a
# digest over exact bytes and the compiler archive is non-byte-reproducible.
#
# So the cell is DISTRIBUTION-ONLY, and this is the distribution. The bytes are
# the ones already published and qualified -- not a rebuild, which would be a
# different cell.
cell_distribution:
  cell_address: f85251f344600ae08196925a174e9cff8f0ff18e
  members: 30
  bundle: cell-f85251f344600ae08196925a174e9cff8f0ff18e.tar
  bundle_sha256: 63f3104d6c45a0d1a937ae0814a32361a07bd920067a8c105c35fff93898d333
  bundle_bytes: 550801920
  layout_sha256: 476982bed83ae4206d3352209faa288bb1612dc5c5a3bf4eb2e25a581cba7f77
  descriptor_sha256: f85251f344600ae08196925a174e9cff8f0ff18e62de25fd8c03db748be1f84b
  # NOT "immutable" -- GitHub reports this release as `immutable: false`, and
  # that was checked rather than assumed. The guarantee is the one that matters
  # and it is stronger in the way that matters: DURABLY DISTRIBUTED,
  # CONTENT-ADDRESSED, AND FAIL-CLOSED AGAINST REPLACEMENT. The bundle digest is
  # committed here and the cell address authenticates its members, so a replaced
  # asset stops matching bundle_sha256, stops reconstructing the address, and
  # fails verification instead of silently becoming the supported cell.
  location:
    kind: github-release-asset
    repo: https://github.com/mml555/shorebird
    tag: cell-f85251f3
    assets:
      - cell-f85251f344600ae08196925a174e9cff8f0ff18e.tar
      - cell_manifest.v2
      - LAYOUT.txt
      - MANIFEST.sha256
      - CELL.txt
  # LAYOUT.txt gives each member's overlay-relative path, RAW sha256 and size,
  # so a consumer reconstructs the CDN hierarchy without knowing anything about
  # our tree. cell_manifest.v2 carries the CANONICAL-form digests the address is
  # computed over -- the two differ for the three members that embed the address
  # itself, which is why both are shipped.
  reconstruct: selfhost/scripts/sd1_hydrate_cell.sh
  verify: selfhost/engine/route_b/verify_cell_members.sh <address> --overlay <dir>
  evidence: evidence/distribution-1/RESULT.md

# CAN ANOTHER OPERATOR DEPLOY THIS STACK? A separate question from whether the
# stack works, and it currently has a different answer.
#
# Kept distinct from product_surfaces below ON PURPOSE. Those statuses are about
# MECHANISMS physically qualified on the supported cell, and they stand. This
# field is about DISTRIBUTION, and it does not. Collapsing the two would let a
# reader conclude from "iOS: SUPPORTED" that a third party can deploy iOS, which
# is false today.
#
#   capability qualified  !=  product distributable
distribution:
  # SELFHOST-DISTRIBUTION-1 closed every defect CLEANROOM-1 found, and
  # SELFHOST-CLEANROOM-2 re-proved the whole path in the same hostile room --
  # against the published tag, not merely its parent. This comment previously
  # said the repairs were "not yet re-proven" and that the status was therefore
  # not OK; that was true between the two lanes and stopped being true when
  # CLEANROOM-2 passed. Replaced rather than annotated, because a comment
  # contradicting the field below it is worse than no comment.
  status: OK
  reason: SELFHOST-CLEANROOM-2 reproduced the stack in a sealed cleanroom
  assessed: 2026-09-04 (SELFHOST-CLEANROOM-1, negative)
  repaired: 2026-09-04 (SELFHOST-DISTRIBUTION-1)
  reproved: 2026-09-04 (SELFHOST-CLEANROOM-2)
  cleanroom_reproducible: true
  # What "true" rests on, measured with the qualification machine's paths and
  # caches provably unreadable (a Seatbelt profile, with the denial asserted per
  # path AND the control that those paths are readable outside it):
  #   an annotated selfhost tag (immutable intent) resolves anonymously
  #   the bootstrap completes from that tag alone
  #   the record lints clean with no external dependency
  #   cli_revision and flutter_selector resolve
  #   the RECORDED selector's engine.version IS the recorded cell
  #   the cell hydrates 30/30 from the durable distribution
  #   SUPPORTED STATE VERIFIED
  #   iOS and Android release-side artifacts hydrate, no devices
  #   18 of 18 distributed objects served from the hydrated overlay,
  #     0 from upstream, 0 non-200 responses
  # The cleanroom found two real defects in the repair before passing -- a
  # bootstrap that hydrated where neither consumer reads, and an audit script
  # with a hard-coded path on the qualification machine. Both are fixed; that
  # is the argument for running it at all.
  cleanroom_evidence: evidence/cleanroom-2/RESULT.md
  proven_at_revision: df037532d3ce613651e22274abbd82bedf1820e2
  # And re-proven against the published tag itself, which is what an operator
  # pins. The tag had to be cut after the first passing run -- a commit cannot
  # name itself -- so this line is the confirmation that the pinned artifact,
  # not merely its parent, reproduces.
  proven_at_tag: selfhost-v1.1.1
  proven_at_tag_revision: bdb234ab938fc0570e499d800928a0c3d640bfe1
  evidence: evidence/cleanroom-1/RESULT.md
  repair_evidence: evidence/distribution-1/RESULT.md
  repairs:
    - >-
      a durable distribution ref: selfhost-v1.1.1 (annotated, immutable intent)
      carries the current record, the cell-distribution metadata, the corrected
      selector and the bootstrap path. A bare clone no longer has to know about
      a branch. DO NOT PIN selfhost-v1.1.0 -- an earlier bullet here named it,
      and its bootstrap cannot complete: it hydrated the cell where neither the
      verifier nor the CDN reads. It is kept because refs are provenance, and
      bootstrap_selfhost.sh auto-discovers the NEWEST selfhost-v* tag so an
      operator following the documented path does not land on it.
    - >-
      the 30 cell member BYTES are published as release cell-f85251f3 with the
      bundle digest committed here. Proven: downloaded into an empty directory,
      hydrated 30/30, address recomputed, and served 30/30 through a real Caddy
      CDN whose overlay is the reconstructed tree -- with the local overlay
      provably denied by a Seatbelt profile.
    - >-
      the Flutter selector is now 5b180d22, pushed to the fork at a branch and
      an annotated tag, and shared.sh clones from that fork by default. The old
      selector e64eb0af selected the SUPERSEDED cell and was unfetchable.
    - >-
      the verifier reads engine.version at the RECORDED selector rather than at
      HEAD, and checks HEAD IS that selector. Falsified against the exact state
      CLEANROOM-1 found.
    - >-
      SHOREBIRD_ROOT has no machine-specific default: environment, then
      .runtime_root written by the bootstrap, then a failure naming both.
    - >-
      the record's format check no longer needs PyYAML (lib/record_lint.py,
      pure stdlib), so a missing module can no longer be reported as a defect
      in the record.
  # NOT repaired, and it is not a defect -- it is a property. The cell address
  # is a digest over exact bytes and the compiler archive is
  # non-byte-reproducible, so the cell can be DISTRIBUTED but never re-derived.
  # Recorded here so nobody plans a "rebuild it" recovery path.
  cell_is_distribution_only: true
  # THE 2026-09-04 CLEANROOM-1 ASSESSMENT, kept as history. Every item under
  # `not_durable_at_assessment` has since been repaired -- see `repairs` below
  # and `cleanroom_evidence` for the re-proof. Retained rather than deleted so
  # an older evidence document naming these gaps stays readable.
  durable_at_assessment:
    - both repositories clone anonymously
    - cli_revision resolves in the durable repository
    - both engine producers resolve at refs pointing AT the commit
    - the cell DESCRIPTOR is committed, so membership and all 30 digests are durable
    - the cell address recomputes from that descriptor inside the cleanroom
  not_durable_at_assessment:   # ALL REPAIRED — see `repairs`
    - >-
      all 30 addressed cell member BYTES are absent from a fresh clone.
      selfhost/cdn/overlay/* is gitignored, no release asset carries them, and
      the record names no location to fetch them from. The CDN that serves them
      reads that same local directory, so it is not an independent source.
    - >-
      rebuilding is NOT an equivalent recovery path: the address is a digest
      over exact bytes and the Route B compiler archive is recorded as
      non-byte-reproducible, so a rebuild yields a DIFFERENT address. The cell
      is distribution-only.
    - >-
      flutter_selector e64eb0af… is not fetchable from any durable remote (the
      CLI bootstrap fails with "not our ref"), and it selects the SUPERSEDED
      cell cd848320…. The revision that selects the supported cell,
      5b180d224df04a267a19888c3f344474e243b382, is unrecorded and unpushed.
    - >-
      no immutable ref names the current record: the newest selfhost-v* tag
      carries none, and only the mutable tip of a non-default branch describes
      the current stack.
  # The one-line summary a reader should take away. It said "the self-hosted
  # distribution is not reproducible from durable sources" until 2026-09-04,
  # which was the CLEANROOM-1 verdict and is now false -- and it sat directly
  # under `status: OK`, contradicting it.
  summary: >-
    the runtime stack is qualified AND the self-hosted distribution reproduces
    from durable sources: an annotated tag, two anonymously-cloneable
    repositories, and a content-addressed cell distribution. Verified in a
    sealed cleanroom with the qualification machine unreadable.

# CAN AN AUTOMATED JOB RUN THIS WITHOUT A HUMAN? Certified 2026-09-04 by
# CI-NONINTERACTIVE-1: bootstrap -> authenticate -> release -> patch ->
# publish/promote, with file descriptor 0 CLOSED for every invocation.
ci_noninteractive:
  status: CERTIFIED
  qualified: 2026-09-04 (CI-NONINTERACTIVE-1)
  evidence: evidence/ci-noninteractive-1/RESULT.md
  # STDIN CLOSED MEANS `0<&-`, NOT `< /dev/null`. Dart classifies stdin by
  # st_mode and /dev/null is a character device, which it reports as a
  # terminal -- so under /dev/null `stdin.hasTerminal` is TRUE and the CLI
  # believes it can prompt. A contract written against /dev/null tests the
  # wrong thing. Measured both ways in this lane.
  certified_stdin_shape: fd 0 closed (0<&-)
  # The full declared environment. env -i strips everything, so this list IS
  # the contract: nothing reaches the CLI by accident.
  required_environment:
    - SHOREBIRD_TOKEN            # an sb_api_ key; never printed
    - SHOREBIRD_HOSTED_URL       # the operator's control plane
    - SHOREBIRD_ARTIFACT_ORIGIN  # or FLUTTER_STORAGE_BASE_URL
    - ANDROID_HOME               # and ANDROID_SDK_ROOT
    - JAVA_HOME
    - GRADLE_USER_HOME           # HOME does NOT cover this -- see below
    - CI                         # any value; presence alone suppresses prompting
  # Found by failure, in this order, and each fails closed with its remedy
  # named rather than prompting:
  prerequisites:
    - >-
      the app needs the INTERNET permission; a `flutter create` app lacks it.
      `shorebird doctor --fix` supplies it and runs unattended (exit 0).
    - >-
      GRADLE_USER_HOME must be set explicitly. Gradle is a Java process and
      resolves user.home from PASSWD, not from the HOME environment variable,
      so pointing HOME at a clean directory still sends Gradle to the invoking
      user's ~/.gradle. This stays invisible on any machine where that
      directory happens to be readable and warm.
    - >-
      the Flutter remote must carry upstream's version tags, or the SDK
      resolves 0.0.0-unknown and `flutter pub get` refuses flutter_test. See
      lineage.flutter_selector_durability.
  # Every mutable target is explicit or refused. Nothing is ever chosen for you.
  deterministic_selection:
    app: shorebird.yaml app_id
    release: >-
      --release-version. Omitted non-interactively the CLI does NOT prompt and
      does NOT pick the first object: it warns and DERIVES the version from
      pubspec, then proceeds; if that version has no release it exits 70.
      Measured with four releases present. CI should pass the flag, because
      derivation depends on a mutable pubspec.
    track: >-
      --track on `patch` publishes and assigns the track, auto-creating the
      channel. `patches set-track` moves a patch to an EXISTING channel. Both
      unattended. `patches promote` is deprecated in favour of set-track.
    mandatory_args: >-
      `patches set-track` declares --release, --patch and --track mandatory, so
      the arg parser refuses before the command runs -- deterministic by
      construction, not by a runtime check. Measured: omitting one exits 70.
  confirmation:
    contract: >-
      an ordinary invocation does not prompt at all: `confirm` comes from a
      hidden --confirm flag that defaults to false (upstream #3223). When
      --confirm IS passed and nothing can answer, the CLI now REFUSES (exit 64)
      and names the prompt. It previously approved itself silently, which is
      the defect this lane fixed.
    bypass: --no-confirm
  # The one place a genuine prompt remains, and it refuses rather than hanging.
  documented_refusals:
    - >-
      `patches set-track --track <NEW>` asks "No channel named X found. Do you
      want to create it?" and has no flag to skip it. It refuses with exit 64
      and names the prompt. Create the channel by publishing a patch with
      --track=<name>, which auto-creates it.
  secret_handling: >-
      the token appears in 0 captured stdout/stderr files, and 0 audit rows
      contain it. Every mutation is attributed to a credential FINGERPRINT
      (actor_credential, e.g. bootstrap:1b1486344a85) with a request_id.
  proven_run:
    release_id: 10
    patch_numbers: [1, 2]
    audit_events: 35
    interactive_prompts_on_the_certified_path: 0

product_surfaces:
  # WHICH INTEGRATION SHAPES this stack supports, as distinct from which Dart
  # constructs. Recorded because "unsupported construct" and "unsupported
  # surface" have different remediations and collapsing them hides the second.
  standalone_flutter_app:
    ios: SUPPORTED — physically qualified, see physical_device_qualification
    android:
      status: SUPPORTED — physically qualified 2026-09-04 against cell f85251f3…
      qualified: 2026-09-04 (ANDROID-FINAL-STACK-2)
      cell: f85251f344600ae08196925a174e9cff8f0ff18e
      # WHAT WAS PROVEN, in one line each, because "SUPPORTED" is the strongest
      # word in this file and it should be readable without opening the lane
      # document:
      #   release  — `shorebird release android --artifact apk` exit 0 from an
      #              empty engine cache and an empty Gradle home; all 14 Android
      #              identity members served from the cell, none via fallback;
      #              all three packaged libflutter.so carry OUR producer
      #              revision and not the fallback's
      #   patch    — ordinary bidiff producer, patch 1, three artifacts each
      #              ~0.2% of the release artifact they patch; the AOT linker
      #              artifact 404'd throughout and no Route B compiler was
      #              fetched
      #   device   — CPH2551: release marker, then STILL the release marker
      #              after download/install, then the patched marker only after
      #              a restart; installs=1, install_failures=0,
      #              update_failures=0, one client
      # The middle observation is the load-bearing one: without it a changed
      # marker is equally consistent with a rebuilt install.
      what_is_not_covered: >-
        iOS Add-to-App (separately UNSUPPORTED, below), Android app-bundle
        distribution through the Play Store, and any Android ABI beyond the
        three shipped (armeabi-v7a, arm64-v8a, x86_64).
      evidence: evidence/android-final-stack-2/RESULT.md
      supporting_evidence: evidence/android-cell-supply-2/RESULT.md

      # HISTORY, nested so it cannot be read as current and cannot collide with
      # the keys above.
      #
      # A DEFECT THIS RESTRUCTURE FIXES, recorded because it is the more serious
      # of the two problems here. The 2026-09-04 wording pass added a current
      # `evidence:` key while leaving the older `evidence:` line at the SAME
      # level, so the mapping had a duplicate key and the last one won -- the
      # authoritative `evidence` for a SUPPORTED surface silently resolved to
      # the document of the lane that had measured it UNSUPPORTED. A YAML
      # duplicate key does not error, it just quietly takes the wrong value,
      # which is exactly why the record's own machine-readability check exists.
      # Two forward-looking keys (`to_support`, `remaining_for_support`) were
      # also left at the authoritative level, where they contradicted the status
      # line above them.
      superseded_assessment:
        status: UNSUPPORTED ON THIS CELL
        assessed: 2026-09-03 (ANDROID-FINAL-STACK-1)
        cell: cd848320d605ff8af5060cabf9a8d1b35853f752
        evidence: evidence/android-final-stack-1/RESULT.md
        # Still true OF THAT CELL, and that is why the move took a new cell
        # rather than a fix: `shorebird release android` cannot build against
        # cd848320 because the cell publishes NO Android engine artifacts, the
        # pinned Flutter's engine.version IS the cell, and
        # `android-arm64-release/` is in the CDN's @must_be_local matcher — so
        # the 404 is a deliberate protection, not a gap to route around.
        finding: >-
          the Android release → patch → discovery → download → physical
          activation path was already sound on that day's CLI, producer and
          control plane, proven end to end on a STOCK engine (309dd657…) with an
          on-screen marker change on a physical CPH2551. What was missing was a
          cell that served Android engine artifacts. Android patching is bidiff;
          it needs neither Route B nor the AOT linker.
        what_it_asked_for: >-
          publish and qualify Android engine artifacts for the cell (at minimum
          android-arm64-release, which @must_be_local requires be genuinely
          ours). DONE 2026-09-04 on cell f85251f3…, for all three release ABIs
          and the four Maven modules.
        # An earlier version of this row read "SUPPORTED — see ANDROID rows in
        # WORKFLOW_CERTIFICATION.md", written during the ADD-TO-APP-1 wording
        # pass. That was an over-claim: the re-certification against the final
        # stack is entirely iOS (rows 1 and 7 via 6F/6G, the rest carried
        # forward), and ANDROID-FINAL-STACK-1 then measured the opposite.

  ios_add_to_app:
    status: UNSUPPORTED
    assessed: 2026-09-03 (ADD-TO-APP-1)
    # Assessed, not implemented. Four independent blockers, measured:
    #  1 the cell publishes a device-only Flutter.xcframework, so
    #    `flutter build ios-framework` cannot assemble the module's
    #    App.xcframework (its simulator slice builds against the debug engine)
    #  2 the control plane refuses to ACTIVATE a release whose only arch is
    #    `xcframework` (Api._requiredArchs is the full-app set)
    #  3 Route B is not implemented for ios-framework at all
    #  4 an ios-framework CODE patch needs Shorebird's AOT linker, which this
    #    stack does not have
    note: assets-only behaviour does NOT qualify as Route B code push — it
      carries no code. Implementing this is a SECOND Route B product surface
      for embedded Flutter, not a simulator slice plus a small API fix.
    evidence: evidence/addtoapp1/RESULT.md
  android_add_to_app_aar:
    status: UNSUPPORTED
    assessed: 2026-09-03 (ADD-TO-APP-1, control-plane half only)
    note: an `aar` release is refused activation for the same reason as
      `xcframework` (Api._requiredArchs gates android on {aab}). The build and
      patch halves were NOT assessed.
    evidence: evidence/addtoapp1/RESULT.md

