  f85251f344600ae08196925a174e9cff8f0ff18e:
    scope: macos-ios-android
    members: 30
    minted: 2026-09-04 (ANDROID-CELL-SUPPLY-2)
    status: SUPPORTED — this is lineage.cell_address (moved here 2026-09-04)
    # `proven` below is the RELEASE-side evidence from the mint
