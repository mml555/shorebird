# BACKUP-RESTORE-1. Both persistence profiles, certified independently and by
# a re-runnable script that was also run against the PRE-REPAIR code to confirm
# it can fail (single 20/12, scale 14/15 -- every guard added is a check that
# fails without it).
backup_restore:
  status: CERTIFIED
  qualified: 2026-09-04 (BACKUP-RESTORE-1)
  evidence: selfhost/backup_restore/CERTIFICATION.md
  # State the claim precisely. This is NOT full disaster recovery: .env, the
  # image tag, TLS material and the host topology are external prerequisites.
  claim: control-plane data backup and restore
  boundary: selfhost/backup_restore/SECRETS_BOUNDARY.md
  profiles:
    single:
      subject: setup.sh --backup / --restore
      harness: selfhost/scripts/br1_certify_single.sh
      result: 32 passed, 0 failed
    scale:
      subject: ops/backup.sh / ops/restore.sh
      harness: selfhost/scripts/br1_certify_scale.sh
      result: 30 passed, 0 failed
  # THE CONSISTENCY PREDICATE IS NOT "the halves disagree". An artifact row is
  # INSERTed before its bytes are written, so a `pending` row with no object is
  # a FAITHFUL capture of an upload in flight, and scoring it as damage
  # produced a false finding in this lane before it was caught. Only states the
  # live system can never occupy count (selfhost/scripts/br1_tear_check.sh):
  torn_states:
    - object present, no row at all
    - object present, row says pending
    - row says verified, object absent
  # Why the scale pair needs a shared id and the single archive does not.
  causal_defects_repaired:
    - >-
      scale: pg_dump and mc mirror were taken at different instants with no
      quiescing. Every backup taken while serving held at least one object no
      row accounted for (4 of 4 runs).
    - >-
      scale: restore compared nothing. One run's dump with another's objects
      exited 0 silently and produced an artifact reported `verified` that
      answered 404 -- patches/check handed devices a URL that did not resolve.
      Filenames sharing a timestamp are not provenance; nothing read them.
    - >-
      single: the target volume was resolved by a host-wide `grep cps_data$`.
      A --restore run in a directory with NO deployment wiped a different,
      live, healthy deployment's volume.
    - >-
      single: restore wiped /data BEFORE reading the archive, so a truncated
      backup destroyed the copy the operator still had. A well-formed archive
      with no database restored with exit 0, a green tick and a healthy server
      holding zero apps, releases and audit records.
    - >-
      both: quiescing was `stop server || true`. From a foreign directory the
      server stayed up for 94 of 94 requests and the backup reported success.
    - >-
      single: the FIRST repair guarded --backup and left --restore fail-open --
      it validated the archive, stopped the server, and wiped /data without
      ever checking the stop worked. Falsified with a container holding the
      volume: the unguarded restore proceeded and the durable state changed.
      A refusal now also restarts the deployment, so the safety check cannot
      cause the outage it exists to prevent.
  # The backup file is a credential store: api_keys.key holds the PLAINTEXT
  # key, so rotating the env API_KEY does NOT revoke what a leaked backup
  # carries. Measured: after rotation the old bootstrap key 403s but a
  # DB-stored collaborator key still authenticates.
  backup_is_a_secret: true

# UPGRADE-ROLLBACK-1. Both database backends, certified independently by a
# harness that was also run against the pre-guard binary to confirm it can fail
# (29/3, and the three failures are in the dangerous direction: the old binary
# answered 200 over a schema it could not serve).
upgrade_rollback:
  status: CERTIFIED
  qualified: 2026-09-06 (UPGRADE-ROLLBACK-1)
  evidence: selfhost/upgrade_rollback/CERTIFICATION.md
  harness: selfhost/scripts/ur1_certify.sh
  backends:
    sqlite: 40 passed, 0 failed
    postgres: 40 passed, 0 failed
  # The upgrade actually exercised, rather than a version bump with no DDL.
  measured_migration:
    from: {image: "ghcr.io/mml555/code-push-server:1.2.0", schema: 7}
    to: {image: built from this checkout, schema: 12}
    migrations: 5 (new crash_reports table, columns on events and audit_log)
  # IMAGE TAGS ARE NOT A STATEMENT ABOUT THE CODE INSIDE THEM. The git tag
  # code_push_server-v1.3.0 carries a tree whose highest migration is 8; the
  # published :1.3.0 image applies 12.
  #
  # This field claimed "digest" for one commit while both restore paths
  # compared only the reference string -- a guarantee written down and not
  # implemented. It now means what it says: restore resolves the selected image
  # to the identities it answers to and requires the manifest's
  # server_image_id to be one of them, refusing rather than falling back to the
  # tag when the image cannot be resolved at all.
  image_identity:
    recorded: server_image (reference) and server_image_id (digest)
    enforced: >-
      digest, on both profiles, before any destructive mutation. Falsified by a
      control that publishes ONE reference over TWO builds -- the case a
      reference comparison passes and this project has already shipped once.
      Against the commit that recorded the digest without enforcing it, that
      control reports "restoring under the same tag but a DIFFERENT build was
      accepted" and the restore migrates the database to a schema the backup
      never held.
    pre_identity_manifests: tag-only comparison, so older archives still restore
  causal_defects_repaired:
    - >-
      an old binary met a database a newer release had migrated and simply
      carried on: healthz 200, readyz 200, reads 200, patches/check 500. An
      orchestrator saw a ready server while every device saw a broken one.
      Repaired with SchemaTooNewException -> FATAL and exit 65 (EX_DATAERR),
      unit-tested in test/schema_guard_test.dart.
    - >-
      restoring the pre-upgrade backup with the successor image still selected
      printed a green tick, came up healthy, and had already migrated the
      restored database back to the schema being rolled back FROM. The manifest
      now records server_image/server_image_id and restore refuses a mismatch
      on both profiles.
    - >-
      the recorded image DIGEST was not enforced: both restore paths compared
      the reference string, so one tag republished over a different build was
      accepted. Measured on the single profile: exit 0, green tick, and the
      restored database migrated from schema 12 to 13.
    - >-
      pg_restore --clean drops only what the dump mentions, so a scale rollback
      left the newer schema's crash_reports table behind. ops/restore.sh now
      resets the schema first -- safe only because the dump's digest has
      already been verified against its manifest.
  # THE UPGRADE IS NOT ATOMIC EVEN THOUGH EACH MIGRATION IS. Measured on both
  # engines: a failure at version 13 leaves 8..12 committed, no partial DDL,
  # nothing serving -- and the database NOT at the version it started from.
  failed_upgrade:
    partial_ddl_survives: {sqlite: false, postgres: false}
    serves_afterwards: {sqlite: false, postgres: false}
    schema_left_at: "the last migration that committed, not the starting version"
    supported_recovery: >-
      stop the candidate, select the old image, restore the pre-upgrade
      certified backup. NOT "put the old image back" (that only appears to work
      while the intervening migrations happen to be additive) and NOT "retry".
  fixtures: >-
    every shipped migration is additive, so an old binary survives them by
    accident and a rollback test would pass for the wrong reason. The break is
    manufactured by scratch successors applied to a COPY of the package
    (selfhost/upgrade_rollback/fixtures/), never by a migration in the
    permanent history.

# SERVER-IMAGE-PROVENANCE-1. The release process behind U-0: a semantic image
# tag that does not name the release it is named after.
release_provenance:
  status: CERTIFIED
  qualified: 2026-09-06 (SERVER-IMAGE-PROVENANCE-1)
  evidence: selfhost/release_provenance/CERTIFICATION.md
  harness: selfhost/scripts/spp1_certify.sh
  result: 36 passed, 0 failed (22/14 against the publisher it replaces)
  invariant: >-
    a server version names one source revision, one multi-arch manifest digest,
    and one permanently retrievable set of bytes.
  # Measured from GHCR, not inferred. Left in place on purpose: this is the
  # evidence, and re-pointing the tag would be a third silent move.
  historical_defect:
    "ghcr.io/mml555/code-push-server:code_push_server-v1.3.0":
      digest: sha256:a6e8bde71d5e4bfe8cbcd6b24e03ab61bf3225fb9f35536a34a5079cb1fb0cf9
      schema: 8
      source: cf74eeda3e432a7d69175fdcec95f5c0dbe28d43
      note: the actual 1.3.0 release
    "ghcr.io/mml555/code-push-server:1.3.0":
      digest: sha256:320338b891c4471d47a2e92a37898666ae21cac3b03606083264a982379f76b9
      schema: 12
      also_tagged: [selfhost-v1.1.1, latest]
      note: >-
        a distribution tag whose pubspec also said 1.3.0. The publisher fired on
        selfhost-v* too, read version: from the ref it built, and re-tagged
        unconditionally, so the last one to run won.
  enforced:
    - only code_push_server-vX.Y.Z may create :X.Y.Z or move :latest
    - the tag's X.Y.Z must equal pubspec.yaml at the commit the tag resolves to
    - a semantic tag is write-once; a differing digest refuses, a matching one is idempotent
    - every publish also gets :source-<full commit>, never reused, never moved
    - both architecture child digests are read back out of the published manifest
    - every reference is resolved back from the registry after publishing
  # THE OTHER HALF OF RECOVERABILITY. Refusing the wrong build is not enough if
  # the right one is gone: a backup records a digest, and those bytes must stay
  # obtainable for as long as the backup is considered restorable.
  retention:
    reference: "<image>:source-<full commit>"
    certified: >-
      after a later release and with every local image deleted, release A pulls
      by its recorded digest alone, verifies against its banked provenance
      record, and the digest-enforced restore accepts it -- while a different
      release is refused in its place.
    tie_to_backups: >-
      a backup's server_image_id IS the release record's manifest_digest, so the
      two systems name the same object rather than agreeing in spirit.

