  descriptor_sha256: 2fc41d3fbd9966958ba3ccf2be9761e064e92bcca9b72f5c958e81a0bdc72649
  host_extras_sha256: 1455a3714d0337be1b8c952cb5809d5138ef68020f4c85ac464520a79e8cb1df   # host-extras-<address>.tar, 843897344 B; additive, not addressed
  # PREVIOUS DISTRIBUTION (still published, tag cell-aab9fd07): bundle
  # cell-aab9fd07857142c232e4b5a41e41814b8dbf640f.tar, 740839936 B, sha256
  # 021144f5f6e5a8e771327d62a71de1cb78cd2773e0779349b79d84a7c6e09d54.
