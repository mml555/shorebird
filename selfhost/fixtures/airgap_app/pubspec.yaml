# Canonical air-gap acceptance fixture. See README.md in this directory.
#
# The version here is what airgap_acceptance.sh reads to derive
# --release-version, so BUMP IT before each acceptance run (the control plane
# rejects a duplicate release version).
name: airgap_probe
description: Canonical fixture for the sealed air-gap acceptance run.
publish_to: none
version: 29.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  # Test-only Route B hook; see dynamic_modules/lib/routeb.dart.
  dynamic_modules:
    path: dynamic_modules
  flutter:
    sdk: flutter
  # code_push_runtime, NOT shorebird_code_push. The native updater is never
  # offered an assets-only patch (it would inflate an asset archive as a binary
  # diff and tombstone the patch), so shorebird_code_push reports "no patch"
  # and rootBundle keeps serving the compiled-in asset — the assets-only case
  # would be indistinguishable from a broken overlay. code_push_runtime does
  # its own discovery and reports assetsPatchNumber SEPARATELY from the code
  # patchNumber, which is exactly the distinction this fixture asserts.
  code_push_runtime:
    path: ../../../packages/code_push_runtime

flutter:
  uses-material-design: true
  assets:
    # shorebird.yaml MUST be declared here — the CLI refuses to build without
    # it ("Your pubspec.yaml does not have shorebird.yaml as a flutter asset"),
    # because the updater reads app_id and base_url out of the bundled copy at
    # runtime. Caught by the first warm run of this fixture, 2026-08-07.
    - shorebird.yaml
    - assets/probe.json
