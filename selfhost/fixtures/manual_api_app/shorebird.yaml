# This file is used to configure the Shorebird updater used by your app.
# Learn more at https://docs.shorebird.dev
# This file does not contain any sensitive information and should be checked into version control.

# Your app_id is the unique identifier assigned to your app.
# It is used to identify your app when requesting patches from Shorebird's servers.
# It is not a secret and can be shared publicly.
app_id: 393fb814-0c96-dfd2-fb57-871d8f147005

# auto_update controls if Shorebird should automatically update in the background on launch.
# If auto_update: false, you will need to use package:shorebird_code_push to trigger updates.
# https://pub.dev/packages/shorebird_code_push
# Uncommented deliberately: this is the hinge of the fixture. It is an ENGINE
# property with no Dart introspection, so the arm proves it behaviourally --
# by the absence of a download when nothing is pressed.
auto_update: false

# The DEVICE reads this from the bundled copy. SHOREBIRD_HOSTED_URL pointed the
# CLI at the control plane for `init`, but that env var does not travel into
# the app, so without this the on-device updater would target api.shorebird.dev.
base_url: http://10.0.0.7:18080
