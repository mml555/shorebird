# The P1 device specimen. See lib/main.dart for the precommitted shape.
#
# A DEDICATED FIXTURE, not an edit to an existing one. killswitch_app is
# excluded by policy -- its events feed the frozen lifecycle estimator -- and
# airgap_app is R6, "the sharpest serializer" per PARITY §16. Its own app
# identity keeps this qualification launch out of fleet-policy evidence by
# construction rather than by an exclusion rule written afterwards.
name: privatestate_probe
description: >-
  P1 device specimen: a patch to a method of a conventionally private Flutter
  State class, consuming granted private field, getter and method.
publish_to: none
version: 1.0.2+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - shorebird.yaml
  uses-material-design: true
