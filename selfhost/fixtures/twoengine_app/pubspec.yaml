# The two-engine harness fixture. See README.md in this directory.
#
# A THIRD fixture, and a clone rather than an edit, for the reason PARITY §16
# gives: `R6` (airgap_app) is "the sharpest serializer" and its shorebird.yaml,
# version and main.dart are per-run mutable state. A goal that needs its own
# fixture does not contend on R6 at all, which is what makes this lane parallel
# to the flavored fixture's.
name: twoengine_probe
description: Structural harness — two independently constructed FlutterEngines in one process.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

# NO plugins, deliberately. Zero plugins means no Podfile and no
# GeneratedPluginRegistrant to reason about while counting engines — and the
# markers this harness writes use dart:io against the app's own tmp directory,
# so path_provider is not needed to observe per-engine output.

flutter:
  uses-material-design: true
  assets:
    # Declared because the eventual G15 DEVICE gate cuts a release against this
    # fixture, and the CLI refuses to build without it. It is GENERATED by
    # selfhost/scripts/prepare_twoengine_fixture.sh, so `flutter run` fails until
    # that has run once.
    - shorebird.yaml
