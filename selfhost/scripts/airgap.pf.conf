# pf rules for the macOS leg of the air-gap acceptance run.
#
# Loaded into the anchor "shorebird_airgap". IMPORTANT: loading an anchor is
# not enough — the MAIN ruleset must also reference it, or these rules are
# parsed and never evaluated (they silently do nothing, which is how a first
# attempt produced a fully-unblocked "sealed" machine). Use
# selfhost/scripts/airgap_pf.sh, which generates a main ruleset that includes
# Apple's anchors and then references this one.
#
# ANCHOR-SAFE ONLY: no `set` statements (e.g. `set skip on lo0`) — pf rejects
# them inside an anchor. Loopback and link-local are allowed with explicit
# quick passes instead.
#
# Policy: block new outbound HTTP/HTTPS/git-protocol everywhere EXCEPT
#   - loopback: the mirror (:8085/:8443) and control plane (:18080) are here
#   - 169.254/16: the USB-attached test device reaches the control plane over
#     the link-local pair, and nothing else lives there
# SSH to the build host is on a high port and is deliberately not blocked —
# the reverse tunnels that carry the mirror to that host ride on it.
# Every rule is `quick` — decisive on first match. Without quick on the block,
# pf's last-match-wins semantics let a later pass (in the main ruleset or a
# subsequent anchor) override the decision, and the seal silently does nothing:
# rules load, `pfctl -s rules` lists them, and every external host stays
# reachable. That exact false-seal happened here on 2026-08-06.
pass out quick on lo0
pass out quick inet from any to 127.0.0.0/8
pass out quick inet from any to 169.254.0.0/16
block return out quick proto tcp to any port { 80, 443, 9418 }
