# pf rules for the macOS leg of the air-gap acceptance run
# (selfhost/scripts/airgap_run.sh loads this into anchor "shorebird_airgap").
#
# Policy: block outbound HTTP/HTTPS/git on every interface, EXCEPT
#   - loopback (the mirror on :8085/:8443 and the control plane on :18080
#     both live on this host), and
#   - link-local 169.254.0.0/16 (the USB-attached test device reaches the
#     control plane over the link-local pair, and nothing else lives there).
#
# This does not try to firewall DNS or every conceivable protocol — the point
# is that the toolchain's artifact fetches (HTTP/HTTPS) and git clones
# (HTTPS/9418) cannot leave the machine. /etc/hosts poisoning in airgap_run.sh
# is the fast tripwire on top.
set skip on lo0

block return out proto tcp to any port {80, 443, 9418}
pass out proto tcp to 169.254.0.0/16
